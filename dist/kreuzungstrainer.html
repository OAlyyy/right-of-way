<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#131210">
<title>Kreuzungstrainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* ==================================================================
   Fahrschule - Kreuzungstrainer
   Palette taken from German traffic signage (RAL): signal yellow is the
   accent, red/green/blue are reserved for meaning, neutrals are asphalt
   with a warm bias so they read as chosen rather than default grey.
   ================================================================== */

:root{
  /* --- type ------------------------------------------------------ */
  --font-ui:    'Archivo', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
  --font-label: 'Archivo Narrow', 'Archivo', 'Segoe UI', system-ui, sans-serif;
  --font-data:  'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;

  /* --- daylight (default) ---------------------------------------- */
  --ground:    #EFECE3;
  --surface:   #FBFAF6;
  --surface-2: #E4E0D4;
  --sunk:      #D9D4C6;
  --line:      #CFC9B8;
  --line-soft: #E0DBCC;

  --ink:       #1A1813;
  --ink-2:     #55504A;
  --ink-3:     #8B8578;

  --accent:      #FFCC00;   /* RAL 1023 Verkehrsgelb  */
  --accent-deep: #E0A800;
  --accent-ink:  #241C00;
  --accent-wash: #FFF3CC;

  --bad:       #CC1F1A;     /* RAL 3020 Verkehrsrot   */
  --bad-wash:  #FBE4E2;
  --good:      #0B8A4F;     /* RAL 6024 Verkehrsgruen */
  --good-wash: #DFF2E7;
  --info:      #1263B0;     /* RAL 5017 Verkehrsblau  */
  --info-wash: #DEEBF8;
  --warn:      #C2701A;
  --warn-wash: #FBEBD8;

  /* --- the road, read by the canvas renderer --------------------- */
  --road:      #5B5B5E;
  --kerb:      #A3A198;
  --grass:     #7C9A5C;
  --grass-2:   #86A464;
  --paint:     #FFFFFF;
  --paint-dim: #E4E2D8;
  --island:    #6E8F52;
  --rail:      #7E7B72;
  --sky-1:     #7FA8D4;
  --sky-2:     #C6D9EA;
  --cabin:     #2E2A25;
  --cabin-dark:#1E1B17;
  --shadow:    rgba(30,26,16,.30);

  --radius:    16px;
  --radius-sm: 8px;
}

/* --- night: system preference, unless a light theme was chosen --- */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:    #131210;
    --surface:   #1C1B17;
    --surface-2: #26241E;
    --sunk:      #100F0D;
    --line:      #35322A;
    --line-soft: #2A2822;

    --ink:       #F2EFE6;
    --ink-2:     #ABA598;
    --ink-3:     #7B7568;

    --accent:      #FFCC00;
    --accent-deep: #FFD942;
    --accent-ink:  #241C00;
    --accent-wash: #332A0E;

    --bad:       #FF6A5E;
    --bad-wash:  #3A1F1C;
    --good:      #4FD08A;
    --good-wash: #16301F;
    --info:      #6BB2F5;
    --info-wash: #16283A;
    --warn:      #F0A55A;
    --warn-wash: #33240F;

    --road:      #2F2E2B;
    --kerb:      #4C4941;
    --grass:     #23291F;
    --grass-2:   #283021;
    --paint:     #E9E5D9;
    --paint-dim: #A8A499;
    --island:    #2B3624;
    --rail:      #7E7B72;
    --sky-1:     #0C1220;
    --sky-2:     #232F47;
    --cabin:     #17140F;
    --cabin-dark:#0E0C09;
    --shadow:    rgba(0,0,0,.45);
  }
}
/* --- night: explicitly chosen --------------------------------- */
:root[data-theme="dark"]{
  --ground:    #131210;
  --surface:   #1C1B17;
  --surface-2: #26241E;
  --sunk:      #100F0D;
  --line:      #35322A;
  --line-soft: #2A2822;

  --ink:       #F2EFE6;
  --ink-2:     #ABA598;
  --ink-3:     #7B7568;

  --accent:      #FFCC00;
  --accent-deep: #FFD942;
  --accent-ink:  #241C00;
  --accent-wash: #332A0E;

  --bad:       #FF6A5E;
  --bad-wash:  #3A1F1C;
  --good:      #4FD08A;
  --good-wash: #16301F;
  --info:      #6BB2F5;
  --info-wash: #16283A;
  --warn:      #F0A55A;
  --warn-wash: #33240F;

  --road:      #2F2E2B;
  --kerb:      #4C4941;
  --grass:     #23291F;
  --grass-2:   #283021;
  --paint:     #E9E5D9;
  --paint-dim: #A8A499;
  --island:    #2B3624;
  --rail:      #7E7B72;
  --sky-1:     #0C1220;
  --sky-2:     #232F47;
  --cabin:     #17140F;
  --cabin-dark:#0E0C09;
  --shadow:    rgba(0,0,0,.45);
}

/* ================================================================ */
*{ box-sizing:border-box; }
html{ height:100%; }
body{
  height:100vh;
  height:100dvh;   /* keeps the pedals reachable under a mobile URL bar */
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font:400 15px/1.55 var(--font-ui);
  display:flex; flex-direction:column;
  overflow:hidden;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}
.hidden{ display:none !important; }
button{
  font:inherit; cursor:pointer; border:none; color:inherit;
  background:none; touch-action:manipulation;
}
:focus-visible{ outline:2px solid var(--info); outline-offset:2px; }
h1,h2,h3,h4{ text-wrap:balance; margin:0; }

/* signage-style eyebrow: the small uppercase plates on German signs */
.eyebrow{
  font-family:var(--font-label);
  font-size:11px; font-weight:700;
  text-transform:uppercase; letter-spacing:.12em;
  color:var(--ink-3);
}

/* ---------------------------- topbar ---------------------------- */
#topbar{
  flex:0 0 auto;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:10px max(16px, env(safe-area-inset-left)) 10px max(16px, env(safe-area-inset-right));
  background:var(--surface);
  border-bottom:1px solid var(--line);
}
.brand{ display:flex; align-items:center; gap:11px; min-width:0; }
/* Zeichen 306: the yellow diamond that means "you have priority" */
.logo{
  width:26px; height:26px; flex:0 0 auto;
  background:var(--accent);
  border:2.5px solid var(--ink);
  transform:rotate(45deg);
  border-radius:3px;
}
:root[data-theme="dark"] .logo,
:root:not([data-theme="light"]) .logo{ border-color:var(--ink); }
.brand-txt{
  font-family:var(--font-label);
  font-size:15px; font-weight:600; letter-spacing:.04em;
  color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.brand-txt b{ color:var(--ink); font-weight:700; }
nav{ display:flex; gap:6px; flex:0 0 auto; }
button.nav{
  font-family:var(--font-label); font-weight:600; letter-spacing:.03em;
  padding:7px 13px; border-radius:var(--radius-sm);
  color:var(--ink-2); border:1px solid transparent;
}
button.nav:hover{ background:var(--surface-2); color:var(--ink); }

/* ---------------------------- screens --------------------------- */
.screen{ flex:1 1 auto; min-height:0; }
#screen-menu{ overflow:auto; }
.menu-inner{
  max-width:1080px; margin:0 auto;
  padding-block:36px 64px;
  padding-inline:max(18px, env(safe-area-inset-left)) max(18px, env(safe-area-inset-right));
}
.menu-head{ max-width:62ch; display:flex; flex-direction:column; gap:12px; }
h1{
  font-family:var(--font-label);
  font-size:clamp(28px, 5vw, 42px); font-weight:700;
  line-height:1.08; letter-spacing:-.01em;
}
h1 em{ font-style:normal; color:var(--accent-deep); }
.lead{ color:var(--ink-2); font-size:16px; margin:0; }
.lead-en{ display:block; color:var(--ink-3); font-size:13px; margin-top:6px; }

/* the free-drive call to action, on the same yellow plate as the merksatz */
.drive-cta{
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  margin-top:22px; padding:16px 18px;
  background:var(--accent-wash);
  border:1px solid var(--accent-deep);
  border-color:color-mix(in srgb, var(--accent) 45%, transparent);
  border-radius:var(--radius-sm);
}
.drive-cta-txt{ flex:1 1 240px; }
.drive-cta-title{ font-family:var(--font-label); font-weight:700; font-size:16px; letter-spacing:.02em; }
.drive-cta-sub{ font-size:13px; color:var(--ink-2); margin-top:2px; }

.tally{
  display:flex; align-items:center; gap:10px;
  margin:26px 0 22px; padding:11px 14px;
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius-sm);
}
.tally-bar{
  flex:1 1 auto; height:7px; border-radius:99px;
  background:var(--sunk); overflow:hidden;
}
.tally-fill{ height:100%; background:var(--accent); border-radius:99px; transition:width .4s ease; }
.tally-txt{ font-family:var(--font-data); font-size:12px; color:var(--ink-2); white-space:nowrap; }

.group{ margin-bottom:30px; }
.group-title{ margin-bottom:11px; }
.group-row{
  display:grid; gap:10px;
  grid-template-columns:repeat(auto-fill, minmax(196px, 1fr));
}
.card{
  display:flex; flex-direction:column; gap:3px; text-align:left;
  padding:13px 14px 11px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  transition:border-color .15s, transform .15s, background .15s;
}
.card:hover{ border-color:var(--ink-3); transform:translateY(-2px); }
.card-lvl{ font-family:var(--font-data); font-size:10.5px; color:var(--ink-3); letter-spacing:.04em; }
.card-title{ font-weight:600; font-size:15px; line-height:1.25; }
.card-en{ font-size:12px; color:var(--ink-3); }
.card-foot{ margin-top:auto; padding-top:10px; }
/* result plate, shaped like the small supplementary plates on signposts */
.badge{
  display:inline-block; font-family:var(--font-data); font-size:10.5px; font-weight:700;
  padding:2.5px 7px; border-radius:3px; letter-spacing:.02em;
  background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line);
}
.badge.ok{ background:var(--good-wash); color:var(--good); border-color:transparent; }
.badge.bad{ background:var(--warn-wash); color:var(--warn); border-color:transparent; }
.badge.new{ background:transparent; color:var(--ink-3); }
.card.done{ border-color:var(--good); }
.menu-foot{ margin-top:30px; }

.ghost{
  border:1px solid var(--line); color:var(--ink-2);
  padding:8px 14px; border-radius:var(--radius-sm);
  font-family:var(--font-label); font-weight:600; letter-spacing:.03em;
}
.ghost:hover{ color:var(--ink); border-color:var(--ink-3); }
.ghost.small{ padding:6px 11px; font-size:13px; }
.ghost.off{ opacity:.45; }

/* ----------------------------- play ----------------------------- */
.play-wrap{ display:flex; height:100%; min-height:0; }
#canvas-wrap{
  position:relative; flex:1 1 auto; min-width:0;
  background:var(--sunk); overflow:hidden;
}
#game{ display:block; width:100%; height:100%; touch-action:none; }

/* ---- instruments ---- */
#hud{
  position:absolute; inset:0 0 auto 0;
  display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
  padding:12px max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
  pointer-events:none;
}
.readout{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius-sm); box-shadow:0 2px 10px var(--shadow);
}
.gauge{
  display:flex; align-items:baseline; gap:5px;
  padding:5px 12px 6px;
}
#hud-speed{
  font-family:var(--font-data); font-weight:700; font-size:27px; line-height:1.1;
  font-variant-numeric:tabular-nums; letter-spacing:-.02em;
}
#hud-speed.over{ color:var(--bad); }
.gauge small{ font-family:var(--font-label); font-size:11px; color:var(--ink-3); letter-spacing:.05em; }
/* the instrument cluster: indicator arrows either side of the speedo,
   the way they sit on a real dashboard */
.hud-left{ display:flex; align-items:flex-start; gap:8px; }
.cluster-dash{ display:flex; align-items:stretch; overflow:hidden; }
.cluster-dash .gauge{ border-left:1px solid var(--line); border-right:1px solid var(--line); }
.cluster-dash .ind{
  box-shadow:none; border:none; border-radius:0;
  width:40px; height:auto; background:transparent;
}
.hud-right{ display:flex; flex-direction:column; align-items:flex-end; gap:7px; }
.chips{ display:flex; gap:7px; align-items:flex-start; }
.chip.btn{ pointer-events:auto; cursor:pointer; color:var(--ink); }
.chip.btn:hover{ border-color:var(--ink-3); }
#minimap{
  pointer-events:none;
  width:148px; height:148px; border-radius:var(--radius-sm);
  background:var(--surface); border:1px solid var(--line);
  box-shadow:0 2px 10px var(--shadow);
}
.look{ width:64px; height:78px; flex-direction:column; gap:3px; }
.look small{
  font-family:var(--font-label); font-weight:700; font-size:9.5px;
  letter-spacing:.08em; color:var(--ink-3);
}
.look.on{ background:var(--info); color:#fff; border-color:transparent; }
.look.on small{ color:rgba(255,255,255,.75); }
.chip{
  padding:6px 10px; font-size:11px;
  font-family:var(--font-label); font-weight:600; letter-spacing:.04em;
  color:var(--ink-3); text-transform:uppercase;
  display:flex; gap:6px; align-items:baseline;
}
.chip b{ font-family:var(--font-data); font-size:13px; color:var(--ink); letter-spacing:0; }
/* the round red-bordered speed-limit sign */
.limitsign{
  width:42px; height:42px; border-radius:50%;
  background:#fff; border:4px solid var(--bad);
  display:grid; place-items:center;
  font-family:var(--font-data); font-weight:700; font-size:14px; color:#1A1813;
  box-shadow:0 2px 10px var(--shadow);
}
#hud-task{
  display:none;
  font-size:12.5px; color:var(--ink-2);
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius-sm); padding:6px 11px; max-width:46ch;
}

#hud-hint{
  position:absolute; left:50%; transform:translateX(-50%);
  bottom:calc(112px + env(safe-area-inset-bottom));
  max-width:min(88%, 62ch); text-align:center;
  background:var(--surface); border:1px solid var(--accent);
  border-left-width:5px;
  color:var(--ink); padding:9px 15px; border-radius:var(--radius-sm);
  font-size:14px; box-shadow:0 4px 18px var(--shadow);
}

/* ---- thumb controls ---- */
.controls{
  position:absolute; bottom:0; left:0; right:0;
  display:flex; align-items:flex-end; justify-content:space-between;
  padding:0 max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
  pointer-events:none; gap:12px;
}
.controls > *{ pointer-events:auto; }
.cluster{ display:flex; gap:9px; }
.ind{
  display:flex; align-items:center; justify-content:center;
  width:60px; height:56px; border-radius:var(--radius-sm);
  background:var(--surface); border:1px solid var(--line);
  color:var(--ink-3); display:grid; place-items:center;
  box-shadow:0 2px 10px var(--shadow);
  transition:background .08s, color .08s;
}
.ind svg{ width:20px; height:20px; fill:currentColor; }
.ind.on{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent-deep); }
.pedal{
  width:96px; height:78px; border-radius:var(--radius-sm);
  background:var(--surface); border:1px solid var(--line);
  color:var(--ink-2); box-shadow:0 2px 10px var(--shadow);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  font-family:var(--font-label); font-weight:700; font-size:13px; letter-spacing:.06em;
  user-select:none; touch-action:none;
  transition:background .07s, color .07s, transform .07s;
}
.pedal small{ font-family:var(--font-data); font-weight:500; font-size:10px; color:var(--ink-3); letter-spacing:0; }
.pedal.gas.down{ background:var(--good); color:#fff; border-color:transparent; transform:translateY(2px); }
.pedal.brake.down{ background:var(--bad); color:#fff; border-color:transparent; transform:translateY(2px); }
.pedal.down small{ color:rgba(255,255,255,.72); }

/* ---------------------------- sidebar --------------------------- */
#side{
  flex:0 0 292px; overflow:auto;
  background:var(--surface); border-left:1px solid var(--line);
  padding:18px; display:flex; flex-direction:column; gap:20px;
}
.side-block{ display:flex; flex-direction:column; gap:7px; }
.side-title{ font-family:var(--font-label); font-size:18px; font-weight:700; line-height:1.2; }
.side-task{ color:var(--ink-2); font-size:13.5px; }
.side-signs{ display:flex; gap:8px; flex-wrap:wrap; }
.ctrl{ width:100%; border-collapse:collapse; font-size:13px; color:var(--ink-2); }
.ctrl td{ padding:3.5px 0; vertical-align:top; }
.ctrl td:first-child{ width:98px; white-space:nowrap; }
kbd{
  display:inline-block; min-width:20px; text-align:center;
  font-family:var(--font-data); font-size:11px; font-weight:500;
  background:var(--surface-2); color:var(--ink);
  border:1px solid var(--line); border-bottom-width:2px;
  border-radius:4px; padding:1px 5px;
}
.note{ font-size:12.5px; color:var(--ink-3); margin:2px 0 0; }
.side-foot{ margin-top:auto; display:flex; gap:8px; flex-wrap:wrap; }

/* --------------------------- overlays --------------------------- */
.overlay{
  position:absolute; inset:0; z-index:20;
  display:flex; align-items:center; justify-content:center;
  padding:max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  background:rgba(18,16,13,.80);
  background:color-mix(in srgb, var(--sunk) 82%, transparent);
  backdrop-filter:blur(3px);
}
#overlay-ref{ position:fixed; }
.panel{
  width:100%; max-width:600px; max-height:100%; overflow:auto;
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius); padding:22px 24px;
  box-shadow:0 20px 50px var(--shadow);
  display:flex; flex-direction:column; gap:16px;
}
.panel h2{ font-family:var(--font-label); font-size:22px; font-weight:700; line-height:1.15; }
.sub{ color:var(--ink-3); font-size:13px; }

.brief-head{ display:flex; flex-direction:column; gap:2px; }
.task{
  background:var(--info-wash); border-radius:var(--radius-sm); padding:12px 14px;
  display:flex; flex-direction:column; gap:3px;
}
.task-de{ font-size:15.5px; font-weight:500; }
.task-en{ color:var(--ink-3); font-size:12.5px; }
.signs{ display:flex; flex-direction:column; gap:11px; }
.signitem{ display:flex; align-items:center; gap:13px; }
.sl-de{ font-size:14px; font-weight:500; }
.sl-en{ font-size:12px; color:var(--ink-3); }
/* the Merksatz reads like a yellow supplementary plate */
.merk{
  background:var(--accent-wash);
  border:1px solid var(--accent-deep);
  border-color:color-mix(in srgb, var(--accent) 45%, transparent);
  border-radius:var(--radius-sm); padding:11px 14px; font-size:14px;
}
.merk b{ font-family:var(--font-label); letter-spacing:.03em; }
.merk-sub{ font-size:12.5px; opacity:.72; margin-top:5px; }
.keys{ display:flex; gap:13px; flex-wrap:wrap; color:var(--ink-3); font-size:12px; }
.keys span{ display:flex; align-items:center; gap:3px; }
.primary{
  background:var(--accent); color:var(--accent-ink);
  font-family:var(--font-label); font-weight:700; letter-spacing:.04em;
  padding:11px 20px; border-radius:var(--radius-sm);
  transition:filter .12s;
}
.primary:hover{ filter:brightness(1.06); }
.primary.alt{ background:var(--good); color:#fff; }
.primary.big{ width:100%; padding:14px; font-size:16px; }
.primary small{ font-family:var(--font-data); font-weight:500; font-size:11px; opacity:.7; }

/* ---- debrief ---- */
.res-head{ display:flex; gap:15px; align-items:center; }
.scorebox{
  flex:0 0 auto; min-width:88px; text-align:center;
  background:var(--surface-2); border-radius:var(--radius-sm); padding:9px 14px;
}
#res-score{ font-family:var(--font-data); font-size:31px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums; }
.scorebox small{ font-family:var(--font-label); font-size:10.5px; color:var(--ink-3); letter-spacing:.08em; text-transform:uppercase; }
.verdict{ font-family:var(--font-label); font-size:21px; font-weight:700; line-height:1.15; }
.verdict.ok{ color:var(--good); }
.verdict.bad{ color:var(--bad); }
.faults{ display:flex; flex-direction:column; gap:10px; }
.fault{
  display:grid; grid-template-columns:auto 1fr; gap:4px 13px;
  background:var(--surface-2); border-radius:var(--radius-sm); padding:13px 15px;
}
/* the deduction sits on a plate, like the value plates under a sign */
.f-plate{
  grid-row:1 / span 2; align-self:start;
  font-family:var(--font-data); font-weight:700; font-size:12.5px;
  padding:5px 8px; border-radius:4px; min-width:40px; text-align:center;
  background:var(--ink-3); color:var(--surface);
}
.fault.major .f-plate{ background:var(--bad); color:#fff; }
.fault.minor .f-plate{ background:var(--warn); color:#fff; }
.fault.hint  .f-plate{ background:var(--info); color:#fff; }
.fault.ok    .f-plate{ background:var(--good); color:#fff; }
/* retried with a rewind: shown for revision, not counted */
.fault.fixed{ opacity:.72; }
.fault.fixed .f-plate{ background:var(--good); color:#fff; }
#hud-hint{ white-space:pre-line; }
.f-body{ display:flex; flex-direction:column; gap:5px; min-width:0; }
.f-title{ font-weight:600; font-size:15px; line-height:1.25; }
.f-en{ color:var(--ink-3); font-size:12px; }
.f-detail{ color:var(--warn); font-size:13px; }
.f-why{ font-size:13.5px; color:var(--ink-2); }
.f-whyen{ font-size:12.5px; color:var(--ink-3); }
.f-rule{
  background:var(--info-wash); border-radius:6px; padding:9px 11px;
  font-size:13px; color:var(--ink-2);
}
.f-rule strong{ color:var(--ink); }
.f-ruleen{ color:var(--ink-3); font-size:12px; margin-top:3px; }
.f-tip{ font-size:13px; color:var(--good); }
.points{ display:flex; flex-direction:column; gap:9px; }
.point{ display:flex; flex-direction:column; gap:2px; }
.p-de{ font-size:13.5px; }
.p-en{ font-size:12px; color:var(--ink-3); }
.res-buttons{ display:flex; gap:9px; flex-wrap:wrap; }

/* ---- reference sheet ---- */
.ref{ max-width:700px; }
.ref-head{ display:flex; justify-content:space-between; align-items:center; gap:12px; }
#ref-body{ display:flex; flex-direction:column; }
.ref-order{
  background:var(--accent-wash);
  border:1px solid var(--accent-deep);
  border-color:color-mix(in srgb, var(--accent) 45%, transparent);
  border-radius:var(--radius-sm); padding:14px 16px; margin-bottom:16px;
}
.ref-order h4{ font-family:var(--font-label); font-size:14px; margin-bottom:9px; letter-spacing:.02em; }
.ref-step{ display:flex; gap:9px; font-size:13.5px; color:var(--ink-2); margin-bottom:5px; }
.ref-step i{ font-family:var(--font-data); font-style:normal; color:var(--ink-3); flex:0 0 auto; }
.ref-row{ display:flex; gap:14px; padding:13px 0; border-top:1px solid var(--line-soft); align-items:flex-start; }
.ref-sign{ flex:0 0 auto; }
.ref-txt{ display:flex; flex-direction:column; gap:3px; min-width:0; }
.ref-title{ font-weight:600; font-size:14.5px; }
.ref-de{ font-size:13px; color:var(--ink-2); }
.ref-en{ font-size:12px; color:var(--ink-3); }

/* --------------------------- responsive -------------------------- */
@media (max-width:960px){
  #side{ display:none; }
  #hud-task{ display:block; }
  #hud{ flex-wrap:wrap; }
}
@media (max-width:560px){
  #topbar{ padding-top:max(8px, env(safe-area-inset-top)); }
  .brand-txt{ font-size:13px; }
  .brand-txt .long{ display:none; }
  #hud{ padding:9px 10px 0; gap:7px; }
  .gauge{ padding:4px 10px 5px; }
  #hud-speed{ font-size:22px; }
  .limitsign{ width:36px; height:36px; border-width:3px; font-size:12px; }
  .chip{ padding:5px 8px; }
  #hud-task{ order:3; flex-basis:100%; font-size:12px; padding:5px 9px; }
  .pedal{ width:82px; height:72px; font-size:12px; }
  .ind{ width:54px; height:52px; }
  .cluster-dash .ind{ width:34px; height:auto; }
  .look{ width:56px; height:72px; }
  #minimap{ width:96px; height:96px; }
  #hud-hint{ font-size:13px; padding:8px 12px; bottom:calc(104px + env(safe-area-inset-bottom)); }
  .panel{ padding:17px 16px; border-radius:var(--radius-sm); gap:13px; }
  .panel h2{ font-size:19px; }
  .res-buttons > *{ flex:1 1 auto; }
  .menu-inner{ padding-block:24px 48px; }
  .group-row{ grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); }
}
/* short landscape phones: keep the road visible, shrink the chrome */
@media (max-height:460px) and (orientation:landscape){
  #topbar{ padding-top:4px; padding-bottom:4px; }
  .logo{ width:20px; height:20px; }
  .pedal{ height:60px; width:88px; }
  .ind{ height:46px; width:54px; }
  .look{ height:60px; width:56px; }
  #minimap{ width:92px; height:92px; }
  #hud-hint{ bottom:calc(74px + env(safe-area-inset-bottom)); padding:6px 12px; }
}

/* touch-only devices: the keyboard legend is noise */
@media (hover:none) and (pointer:coarse){
  #brief-keys{ display:none; }
  .primary small, .pedal small{ display:none; }
}

@media (prefers-reduced-motion:reduce){
  *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}

<body>


<header id="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true"></span>
    <span class="brand-txt"><b>Kreuzungstrainer</b> <span class="long">&middot; Fahrschule</span></span>
  </div>
  <nav>
    <button id="btn-lang"  class="nav" type="button" title="Sprache / Language">Deutsch</button>
    <button id="btn-theme" class="nav" type="button" title="Day / Night">Night</button>
    <button id="btn-menu"  class="nav" type="button" data-t="nav.lessons">Lessons</button>
    <button id="btn-ref"   class="nav" type="button" data-t="nav.sheet">Cheat sheet</button>
  </nav>
</header>

<!-- ============================ MENU ============================ -->
<section id="screen-menu" class="screen">
  <div class="menu-inner">
    <div class="menu-head">
      <h1 id="menu-h1"></h1>
      <p class="lead" id="menu-lead"></p>
    </div>

    <div class="drive-cta">
      <div class="drive-cta-txt">
        <div class="drive-cta-title" data-t="drive.cta.title"></div>
        <div class="drive-cta-sub" data-t="drive.cta.sub"></div>
      </div>
      <button id="btn-drive" class="primary" type="button" data-t="drive.cta.button"></button>
    </div>

    <div class="tally">
      <div class="tally-bar"><div class="tally-fill" id="tally-fill" style="width:0%"></div></div>
      <div class="tally-txt" id="progress-line">0 / 19</div>
    </div>

    <div id="level-grid"></div>

    <div class="menu-foot">
      <button id="btn-reset" class="ghost" type="button" data-t="menu.reset"></button>
    </div>
  </div>
</section>

<!-- ============================ PLAY ============================ -->
<section id="screen-play" class="screen hidden">
  <div class="play-wrap">

    <div id="canvas-wrap">
      <canvas id="game"></canvas>

      <div id="hud">
        <div class="hud-left">
          <div class="cluster-dash readout">
            <button id="ind-l" class="ind" type="button" title="A">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4 4 12l10 8v-5h6V9h-6z"/></svg>
            </button>
            <div class="gauge"><span id="hud-speed">0</span><small>km/h</small></div>
            <button id="ind-r" class="ind" type="button" title="D">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4l10 8-10 8v-5H4V9h6z"/></svg>
            </button>
          </div>
        </div>
        <div id="hud-task"></div>
        <div class="hud-right">
          <div class="chips">
            <div class="limitsign" id="hud-limit">50</div>
            <div class="chip readout"><span id="hud-time-label" data-t="hud.time"></span> <b id="hud-time">45</b></div>
            <div class="chip readout"><span data-t="hud.faults"></span> <b id="hud-faults">0</b></div>
            <button id="btn-view" class="chip readout btn" type="button">2D</button>
          </div>
          <canvas id="minimap" width="296" height="296"></canvas>
        </div>
      </div>

      <div id="hud-hint" class="hidden"></div>

      <div class="controls">
        <div class="cluster">
          <button id="look-l" class="ind look" type="button" title="Q">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4 4 12l10 8v-5h6V9h-6z"/></svg>
            <small data-t="look.label">LOOK</small>
          </button>
          <button id="look-r" class="ind look" type="button" title="E">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4l10 8-10 8v-5H4V9h6z"/></svg>
            <small data-t="look.label">LOOK</small>
          </button>
        </div>
        <div class="cluster">
          <button id="pedal-brake" class="pedal brake" type="button"><span data-t="pedal.brake"></span><small>S</small></button>
          <button id="pedal-gas"   class="pedal gas"   type="button"><span data-t="pedal.gas"></span><small>W</small></button>
        </div>
      </div>

      <!-- briefing -->
      <div id="overlay-brief" class="overlay hidden">
        <div class="panel brief">
          <div class="brief-head">
            <div class="eyebrow" id="brief-group">Lektion</div>
            <h2 id="brief-title">Titel</h2>
            <div id="brief-en" class="sub">Subtitle</div>
          </div>
          <div class="task">
            <div class="task-de" id="brief-task"></div>
            <div class="task-en" id="brief-task-en"></div>
          </div>
          <div id="brief-signs" class="signs"></div>
          <div class="merk"><b data-t="brief.remember"></b> <span id="brief-merk"></span>
            <div class="merk-sub" id="brief-merk-sub"></div></div>
          <div class="keys" id="brief-keys"></div>
          <button id="btn-start" class="primary big" type="button">
            <span data-t="brief.start"></span> <small data-t="brief.startKey"></small></button>
        </div>
      </div>

      <!-- free-drive: stopped to explain a fault -->
      <div id="overlay-fault" class="overlay hidden">
        <div class="panel result">
          <div class="res-head">
            <div>
              <div class="verdict bad" data-t="drive.fault.stopped"></div>
              <div class="sub" data-t="drive.fault.sub"></div>
            </div>
          </div>
          <div id="fault-card" class="faults"></div>
          <div class="res-buttons">
            <button id="btn-fault-rewind" class="primary" type="button">
              <span data-t="drive.fault.rewind"></span> <small data-t="drive.fault.rewindKey"></small></button>
            <button id="btn-fault-continue" class="ghost" type="button">
              <span data-t="drive.fault.continue"></span> <small data-t="drive.fault.continueKey"></small></button>
          </div>
        </div>
      </div>

      <!-- debrief -->
      <div id="overlay-result" class="overlay hidden">
        <div class="panel result">
          <div class="res-head">
            <div class="scorebox">
              <div id="res-score">0</div><small data-t="res.points"></small>
            </div>
            <div>
              <div id="res-verdict" class="verdict">&nbsp;</div>
              <div id="res-sub" class="sub"></div>
            </div>
          </div>
          <div id="res-faults" class="faults"></div>
          <div id="res-points" class="points"></div>
          <div class="res-buttons">
            <button id="btn-retry" class="primary" type="button">
              <span data-t="res.again"></span> <small data-t="res.againKey"></small></button>
            <button id="btn-next"  class="primary alt" type="button">
              <span data-t="res.next"></span> <small data-t="res.nextKey"></small></button>
            <button id="btn-list"  class="ghost" type="button" data-t="res.list"></button>
          </div>
        </div>
      </div>
    </div>

    <aside id="side">
      <div class="side-block">
        <div class="eyebrow" data-t="side.lesson"></div>
        <div id="side-title" class="side-title"></div>
        <div id="side-task" class="side-task"></div>
      </div>
      <div class="side-block">
        <div class="eyebrow" data-t="side.signs"></div>
        <div id="side-signs" class="side-signs"></div>
      </div>
      <div class="side-block">
        <div class="eyebrow" data-t="side.controls"></div>
        <table class="ctrl">
          <tr><td><kbd>W</kbd> <kbd>&uarr;</kbd></td><td data-t="ctrl.throttle"></td></tr>
          <tr><td><kbd>S</kbd> <kbd>&darr;</kbd></td><td data-t="ctrl.brake"></td></tr>
          <tr><td><kbd>Q</kbd> <kbd>E</kbd></td><td data-t="ctrl.look"></td></tr>
          <tr><td><kbd>A</kbd> <kbd>D</kbd></td><td data-t="ctrl.indicators"></td></tr>
          <tr><td><kbd>V</kbd></td><td data-t="ctrl.view"></td></tr>
          <tr><td><kbd>R</kbd></td><td data-t="ctrl.restart"></td></tr>
          <tr><td><kbd>H</kbd></td><td data-t="ctrl.hints"></td></tr>
        </table>
        <p class="note" data-t="side.note"></p>
      </div>
      <div class="side-foot">
        <button id="btn-hints" class="ghost small" type="button" data-t="side.hints"></button>
        <button id="btn-end-drive" class="ghost small hidden" type="button" data-t="drive.end"></button>
        <button id="btn-quit"  class="ghost small" type="button" data-t="side.quit"></button>
      </div>
    </aside>
  </div>
</section>

<!-- ========================= REFERENCE ========================= -->
<div id="overlay-ref" class="overlay hidden">
  <div class="panel ref">
    <div class="ref-head">
      <h2 data-t="ref.title"></h2>
      <button id="btn-ref-close" class="ghost small" type="button" data-t="ref.close"></button>
    </div>
    <div id="ref-body"></div>
  </div>
</div>

      'drive.result.sub':'{a} Kreuzungen fehlerfrei gemeistert.',
      'drive.result.explained':'Diese Fehler stehen noch auf deinem Bogen:',
      'drive.result.fixed':'Mit Zurückspulen geübt ({n}) – zählt nicht gegen dich:',
      'drive.result.retry':'Neue Stadt', 'drive.result.list':'Zurück zum Menü'
    }
  };

  /* lesson groups, keyed by the German name used in scenarios.js */
  var GROUPS = {
    'Vorfahrt':     { de:'Vorfahrt',      en:'Right of way' },
    'Schilder':     { de:'Schilder',      en:'Signs' },
    'Abbiegen':     { de:'Abbiegen',      en:'Turning' },
    'Fussgaenger':  { de:'Fussgänger', en:'Pedestrians' },
    'Ampel':        { de:'Ampel',         en:'Traffic lights' },
    'Kreisverkehr': { de:'Kreisverkehr',  en:'Roundabouts' },
    'Besondere':    { de:'Besondere Fälle', en:'Special cases' },

  };

  function t(key, vars){

    if (vars) for (var k in vars) s = s.split('{'+k+'}').join(vars[k]);
    return s;
  }
  function group(name){ return pick(GROUPS[name] || { de:name, en:name }); }

  return {
    t:t, pick:pick, other:other, group:group,
    get:function(){ return lang; },
    set:function(l){ lang = (l === 'de') ? 'de' : 'en'; },
    toggle:function(){ lang = lang === 'en' ? 'de' : 'en'; return lang; }
  };
})();

'use strict';
/* ------------------------------------------------------------------
   geo.js - world constants, vector math, path building
   Coordinate system: world units, y points DOWN (screen convention).
   The intersection centre is always at (0,0).
   ------------------------------------------------------------------ */

var CFG = {
  PPM:      12,      // world units per metre
  LANE:     48,      // width of one lane  (= 4 m)
  HALF:     24,      // half a lane        (lane centre offset)
  BOX:      48,      // half width of the carriageway = edge of junction box
  FAR:      880,     // where every approach path starts (~73 m out)
  RING:     150,     // roundabout: radius of the circulating lane centre
  CAR_L:    52,      // 4.3 m
  CAR_W:    24,      // 2.0 m
  ACC:      42,      // player acceleration   u/s^2  (~3.5 m/s^2)
  BRAKE:    110,     // player braking        u/s^2  (~9 m/s^2)
  COAST:    16,      // engine braking
  AI_ACC:   38,
  AI_DEC:   95,
  PED_V:    17       // 1.4 m/s
};

/* km/h  <->  world units per second */
function kmh(v){ return v / 3.6 * CFG.PPM; }
function toKmh(u){ return u * 3.6 / CFG.PPM; }

var Geo = (function(){

  function add(a,b){ return {x:a.x+b.x, y:a.y+b.y}; }
  function sub(a,b){ return {x:a.x-b.x, y:a.y-b.y}; }
  function mul(a,k){ return {x:a.x*k,   y:a.y*k};   }
  function len(a){ return Math.hypot(a.x,a.y); }
  function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
  function norm(a){ var l = len(a)||1; return {x:a.x/l, y:a.y/l}; }
  /* rotate 90 deg clockwise on screen (y down) => "to the right of" */
  function rot90cw(a){ return {x:-a.y, y:a.x}; }
  function lerp(a,b,t){ return {x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t}; }
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

  /* outward unit vector of each arm (pointing away from the centre) */
  var ARM_VEC = { N:{x:0,y:-1}, E:{x:1,y:0}, S:{x:0,y:1}, W:{x:-1,y:0} };
  var ARM_ORDER = ['N','E','S','W'];

  /* the arm lying to the right of somebody arriving FROM arm
     (identical to the arm a right turn would take them into) */
  function rightOf(arm){
    var i = ARM_ORDER.indexOf(arm);
    return ARM_ORDER[(i+3)%4];
  }
  function leftOf(arm){
    var i = ARM_ORDER.indexOf(arm);
    return ARM_ORDER[(i+1)%4];
  }
  function opposite(arm){
    var i = ARM_ORDER.indexOf(arm);
    return ARM_ORDER[(i+2)%4];
  }
  /* which way a from->to move turns */
  function turnOf(from,to){
    if (to === rightOf(from))   return 'right';
    if (to === leftOf(from))    return 'left';
    if (to === opposite(from))  return 'straight';
    return 'uturn';
  }

  /* centre of the APPROACH lane on arm, d units out from the centre */
  function laneIn(arm,d){
    var o = ARM_VEC[arm], r = rot90cw(o);
    return { x:o.x*d - r.x*CFG.HALF, y:o.y*d - r.y*CFG.HALF };
  }
  /* centre of the EXIT lane on arm, d units out from the centre */
  function laneOut(arm,d){
    var o = ARM_VEC[arm], r = rot90cw(o);
    return { x:o.x*d + r.x*CFG.HALF, y:o.y*d + r.y*CFG.HALF };
  }
  function lineIntersect(p1,d1,p2,d2){
    var den = d1.x*d2.y - d1.y*d2.x;
    if (Math.abs(den) < 1e-6) return null;
    var t = ((p2.x-p1.x)*d2.y - (p2.y-p1.y)*d2.x) / den;
    return { x:p1.x+d1.x*t, y:p1.y+d1.y*t };
  }
  function quadPoints(p0,c,p1,n){
    var out=[];
    for (var i=0;i<=n;i++){
      var t=i/n, m=1-t;
      out.push({ x:m*m*p0.x + 2*m*t*c.x + t*t*p1.x,
                 y:m*m*p0.y + 2*m*t*c.y + t*t*p1.y });
    }
    return out;
  }
  /* Chaikin corner cutting - turns a rough polyline into a drivable curve */
  function smooth(pts,iters){
    for (var k=0;k<(iters||1);k++){
      var out=[pts[0]];
      for (var i=0;i<pts.length-1;i++){
        var a=pts[i], b=pts[i+1];
        out.push({x:a.x*0.75+b.x*0.25, y:a.y*0.75+b.y*0.25});
        out.push({x:a.x*0.25+b.x*0.75, y:a.y*0.25+b.y*0.75});
      }
      out.push(pts[pts.length-1]);
      pts=out;
    }
    return pts;
  }
  function dedupe(pts){
    var out=[pts[0]];
    for (var i=1;i<pts.length;i++){
      if (dist(pts[i], out[out.length-1]) > 0.5) out.push(pts[i]);
    }
    return out;
  }

  /* ---------------- Path ---------------- */
  function Path(pts){
    this.pts = dedupe(pts);
    this.cum = [0];
    for (var i=1;i<this.pts.length;i++){
      this.cum.push(this.cum[i-1] + dist(this.pts[i-1], this.pts[i]));
    }
    this.length = this.cum[this.cum.length-1];
  }
  Path.prototype.at = function(s){
    s = clamp(s, 0, this.length);
    var lo = 0, hi = this.cum.length-1;
    while (lo < hi-1){
      var mid = (lo+hi)>>1;
      if (this.cum[mid] <= s) lo = mid; else hi = mid;
    }
    var a = this.pts[lo], b = this.pts[lo+1] || this.pts[lo];
    var seg = (this.cum[lo+1] - this.cum[lo]) || 1;
    var t = (s - this.cum[lo]) / seg;
    return { x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t,
             h:Math.atan2(b.y-a.y, b.x-a.x) };
  };
  /* first s (walking forward) at which the path is within r of the centre */
  Path.prototype.sAtRadius = function(r){
    for (var s=0; s<=this.length; s+=2){
      var p = this.at(s);
      if (Math.hypot(p.x,p.y) <= r) return s;
    }
    return this.length;
  };
  /* last s at which the path is still within r of the centre */
  Path.prototype.sLeavingRadius = function(r){
    for (var s=this.length; s>=0; s-=2){
      var p = this.at(s);
      if (Math.hypot(p.x,p.y) <= r) return s;
    }
    return 0;
  };

  /* ---- path through a normal junction: arm from -> arm to ----
     Turns start and finish a little way outside the junction box so the
     radius is realistic (about 5 m) instead of a 2 m hairpin. */
  function junctionPath(from,to){
    var turn = turnOf(from,to);
    var ext  = turn === 'straight' ? CFG.BOX : CFG.BOX + 34;
    var p0 = laneIn(from, CFG.FAR);
    var p1 = laneIn(from, ext);
    var p2 = laneOut(to,  ext);
    var p3 = laneOut(to,  CFG.FAR);
    var dIn  = mul(ARM_VEC[from], -1);
    var dOut = ARM_VEC[to];
    var pts  = [p0, p1];
    var c = lineIntersect(p1, dIn, p2, dOut);
    if (c && turn !== 'straight'){
      pts = pts.concat(quadPoints(p1, c, p2, 16).slice(1));
    } else {
      pts.push(p2);
    }
    pts.push(p3);
    return new Path(pts);
  }

  /* ---- path through a roundabout ---- */
  var ARM_ANGLE = { E:0, N:90, W:180, S:270 };   // maths angle, y flipped
  function ringPoint(deg, r){
    var a = deg*Math.PI/180;
    return { x:Math.cos(a)*r, y:-Math.sin(a)*r };
  }
  function roundaboutPath(from,to){
    var R  = CFG.RING;
    var a0 = ARM_ANGLE[from], a1 = ARM_ANGLE[to];
    var pts = [ laneIn(from, CFG.FAR), laneIn(from, R+70) ];
    /* sweep anticlockwise on screen = increasing maths angle */
    var start = a0 + 16, end = a1 - 16;
    while (end <= start) end += 360;
    for (var a=start; a<=end; a+=6) pts.push(ringPoint(a, R));
    pts.push(ringPoint(end, R));
    pts.push(laneOut(to, R+70));
    pts.push(laneOut(to, CFG.FAR));
    return new Path(smooth(pts, 2));
  }

  /* ---- straight rail line across the map ---- */
  function railPath(from,to,offset){
    var o = offset || 0;
    var a = ARM_VEC[from], b = ARM_VEC[to];
    var pa = rot90cw(a), pb = rot90cw(b);
    var p0 = { x:a.x*CFG.FAR + pa.x*o,    y:a.y*CFG.FAR + pa.y*o };
    var p1 = { x:b.x*CFG.FAR - pb.x*o,    y:b.y*CFG.FAR - pb.y*o };
    return new Path([p0, {x:0,y:0}, p1]);
  }

  /* ---- where do two paths conflict? ----
     Returns the EARLIEST point of closest approach, which is what a
     driver actually has to time: the crossing point for crossing paths,
     the merge point for merging paths. */
  function conflictOf(pa, pb, thresh){
    var best = null, step = 5;
    for (var sa=0; sa<=pa.length; sa+=step){
      var A = pa.at(sa);
      for (var sb=0; sb<=pb.length; sb+=step){
        var B = pb.at(sb);
        var d = Math.hypot(A.x-B.x, A.y-B.y);
        if (!best || d < best.d - 0.001)
          best = { d:d, sa:sa, sb:sb, x:(A.x+B.x)/2, y:(A.y+B.y)/2 };
      }
    }
    if (!best || best.d > (thresh || CFG.CAR_W+14)) return null;
    return best;
  }

  return { add:add, sub:sub, mul:mul, len:len, dist:dist, norm:norm,
           rot90cw:rot90cw, lerp:lerp, clamp:clamp,
           ARM_VEC:ARM_VEC, ARM_ORDER:ARM_ORDER, ARM_ANGLE:ARM_ANGLE,
           rightOf:rightOf, leftOf:leftOf, opposite:opposite, turnOf:turnOf,
           laneIn:laneIn, laneOut:laneOut, ringPoint:ringPoint,
           smooth:smooth, quadPoints:quadPoints, lineIntersect:lineIntersect,
           Path:Path, junctionPath:junctionPath, roundaboutPath:roundaboutPath,
           railPath:railPath, conflictOf:conflictOf };
})();

'use strict';
/* ------------------------------------------------------------------
   rules.js - the StVO priority engine + the fault catalogue.
   This is the "Fahrlehrer" brain of the game. Every piece of text is
   bilingual: {de, en}. The UI picks a language, the engine never does.
   ------------------------------------------------------------------ */

var Rules = (function(){

  /* Rank of a road arm. Higher rank = has priority.
       4  Vorfahrtstrasse / priority road (Z 306, Z 301)
       3  unmarked road, rechts-vor-links applies
       2  Vorfahrt gewaehren (Z 205) or Stop (Z 206)   -> must give way
       1  leaving a driveway / verkehrsberuhigter Bereich / field track
     Traffic lights, when running, override all of this.              */
  var SIGN_RANK = {
    'priority' : 4,
    'none'     : 3,
    'yield'    : 2,
    'stop'     : 2,
    'exit'     : 1,
    'ring'     : 4,
    'ringentry': 2
  };

  function signOf(sc, arm){
    return (sc.layout.signs && sc.layout.signs[arm]) || 'none';
  }

  /* ---------------- traffic lights ---------------- */
  function lightFor(sc, arm, t){
    var L = sc.lights;
    if (!L) return null;
    var group = L.groups[arm];
    if (!group) return null;
    var total = 0, i;
    for (i=0;i<L.program.length;i++) total += L.program[i].dur;
    var tt = ((t + (L.t0||0)) % total + total) % total;
    for (i=0;i<L.program.length;i++){
      if (tt < L.program[i].dur) return L.program[i][group] || 'red';
      tt -= L.program[i].dur;
    }
    return 'red';
  }
  function lightRank(state){
    if (state === 'green' || state === 'yellow') return 4;
    return 0;
  }
  function hasGreenArrow(sc, arm){
    return !!(sc.gruenpfeil && sc.gruenpfeil.indexOf(arm) >= 0);
  }

  /* ---------------- effective rank of one vehicle ---------------- */
  function rankOf(sc, veh, t){
    if (veh.ranked !== undefined) return veh.ranked;
    /* in a roundabout, priority depends on whether you are already
       circulating, not on which arm you came from */
    if (sc.layout.type === 'roundabout')
      return (veh.s >= veh.junctionS) ? SIGN_RANK.ring : SIGN_RANK.ringentry;
    var ls = lightFor(sc, veh.fromArm, t);
    if (ls !== null) return lightRank(ls);
    var s = veh.signOverride || signOf(sc, veh.fromArm);
    return SIGN_RANK[s] !== undefined ? SIGN_RANK[s] : 3;
  }

  /* ------------------------------------------------------------------
     Who has to give way?  Called only for pairs whose paths conflict.
       'a' / 'b'    -> that one has priority
       'coordinate' -> neither yields, just keep clear
       'follow'     -> same approach arm, a queue
     ------------------------------------------------------------------ */
  function priority(sc, a, b, t){
    if (a.fromArm === b.fromArm)
      return { who:'follow', reason:'same_arm' };

    var ra = rankOf(sc, a, t), rb = rankOf(sc, b, t);

    if (sc.railPriority && ra === rb){
      if (a.kind === 'tram' && b.kind !== 'tram') return { who:'a', reason:'schiene' };
      if (b.kind === 'tram' && a.kind !== 'tram') return { who:'b', reason:'schiene' };
    }
    if (a.kind === 'bus' && a.pullingOut) return { who:'a', reason:'bus' };
    if (b.kind === 'bus' && b.pullingOut) return { who:'b', reason:'bus' };
    if (a.emergency) return { who:'a', reason:'einsatz' };
    if (b.emergency) return { who:'b', reason:'einsatz' };

    if (ra !== rb){
      var lit = sc.lights && lightFor(sc, a.fromArm, t) !== null;
      return { who: ra > rb ? 'a' : 'b', reason: lit ? 'ampel' : 'schild' };
    }

    /* --- equal rank --- */
    if (sc.layout.type === 'roundabout')
      return { who:'coordinate', reason:'kreisel' };

    var ta = Geo.turnOf(a.fromArm, a.toArm);
    var tb = Geo.turnOf(b.fromArm, b.toArm);

    /* oncoming: the one turning left gives way */
    if (b.fromArm === Geo.opposite(a.fromArm)){
      if (ta === 'left' && tb === 'left') return { who:'coordinate', reason:'voreinander' };
      if (ta === 'left')  return { who:'b', reason:'linksabbieger' };
      if (tb === 'left')  return { who:'a', reason:'linksabbieger' };
      return { who:'coordinate', reason:'kein_konflikt' };
    }

    /* otherwise: rechts vor links */
    if (b.fromArm === Geo.rightOf(a.fromArm)) return { who:'b', reason:'rvl' };
    if (a.fromArm === Geo.rightOf(b.fromArm)) return { who:'a', reason:'rvl' };

    return { who:'coordinate', reason:'unklar' };
  }

  /* ------------------------------------------------------------------
     Why the decision went that way, in both languages.
     ------------------------------------------------------------------ */
  var REASON_TEXT = {

      title:{ de:'Rechts vor links', en:'Right before left' },
      text:{

    },

'use strict';
/* ------------------------------------------------------------------
   signs.js - vector drawings of the German traffic signs used in game.
   Every sign is drawn centred on (x,y) with a bounding size s.
   ------------------------------------------------------------------ */

var Signs = (function(){

  function poly(ctx, pts, fill, stroke, lw){
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
    if (fill){ ctx.fillStyle = fill; ctx.fill(); }
    if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = lw||2; ctx.stroke(); }
  }
  function circle(ctx,x,y,r,fill,stroke,lw){
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
    if (fill){ ctx.fillStyle=fill; ctx.fill(); }
    if (stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||2; ctx.stroke(); }
  }
  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  /* a little walking person, used on crossing / play-street signs */
  function pedGlyph(ctx,x,y,h,col){
    ctx.save();
    ctx.strokeStyle = col; ctx.fillStyle = col;
    ctx.lineWidth = Math.max(1, h*0.11);
    ctx.lineCap = 'round';
    circle(ctx, x, y-h*0.36, h*0.13, col, null);
    ctx.beginPath();
    ctx.moveTo(x, y-h*0.22); ctx.lineTo(x, y+h*0.04);       // torso
    ctx.moveTo(x, y-h*0.16); ctx.lineTo(x+h*0.18, y-h*0.02); // arm
    ctx.moveTo(x, y-h*0.16); ctx.lineTo(x-h*0.14, y+h*0.02); // arm
    ctx.moveTo(x, y+h*0.04); ctx.lineTo(x+h*0.16, y+h*0.34); // leg
    ctx.moveTo(x, y+h*0.04); ctx.lineTo(x-h*0.13, y+h*0.32); // leg
    ctx.stroke();
    ctx.restore();
  }

  function arrowCurve(ctx, cx, cy, r, a0, a1, col, lw, head){
    ctx.save();
    ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(cx,cy,r,a0,a1); ctx.stroke();
    if (head){
      var hx = cx + Math.cos(a1)*r, hy = cy + Math.sin(a1)*r;
      var tx = -Math.sin(a1), ty = Math.cos(a1);
      var nx = Math.cos(a1),  ny = Math.sin(a1);
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(hx + tx*lw*1.9, hy + ty*lw*1.9);
      ctx.lineTo(hx - nx*lw*1.5 + tx*0 - tx*0, hy - ny*lw*1.5);
      ctx.lineTo(hx + nx*lw*1.5, hy + ny*lw*1.5);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  /* ---------------------------------------------------------------- */
  var draw = {

    /* Zeichen 205 - Vorfahrt gewaehren */
    yield: function(ctx,x,y,s){
      var h = s*0.86;
      poly(ctx, [[x, y+h*0.62],[x-s*0.5, y-h*0.42],[x+s*0.5, y-h*0.42]], '#ffffff', '#d02020', s*0.13);
    },

    /* Zeichen 206 - Stop */
    stop: function(ctx,x,y,s){
      var r = s*0.5, pts=[];
      for (var i=0;i<8;i++){
        var a = Math.PI/8 + i*Math.PI/4;
        pts.push([x+Math.cos(a)*r, y+Math.sin(a)*r]);
      }
      poly(ctx, pts, '#d02020', '#ffffff', s*0.06);
      ctx.fillStyle='#fff';
      ctx.font = 'bold '+(s*0.32)+'px Arial, sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('STOP', x, y+s*0.02);
    },

    /* Zeichen 306 - Vorfahrtstrasse */
    priority: function(ctx,x,y,s){
      var r = s*0.5;
      poly(ctx, [[x,y-r],[x+r,y],[x,y+r],[x-r,y]], '#ffffff', '#111', s*0.05);
      var r2 = r*0.66;
      poly(ctx, [[x,y-r2],[x+r2,y],[x,y+r2],[x-r2,y]], '#ffcc00', null);
    },

    /* Zeichen 301 - Vorfahrt (an der naechsten Kreuzung) */
    priority_next: function(ctx,x,y,s){
      var h=s*0.86;
      poly(ctx, [[x, y-h*0.5],[x-s*0.5, y+h*0.42],[x+s*0.5, y+h*0.42]], '#ffffff', '#111', s*0.05);
      ctx.strokeStyle='#111'; ctx.lineWidth=s*0.09; ctx.lineCap='butt';
      ctx.beginPath();
      ctx.moveTo(x-s*0.26,y+h*0.14); ctx.lineTo(x+s*0.26,y+h*0.14);
      ctx.moveTo(x,y+h*0.30); ctx.lineTo(x,y-h*0.10);
      ctx.stroke();
    },

    /* Zeichen 350 - Fussgaengerueberweg */
    crossing: function(ctx,x,y,s){
      var r=s*0.5;
      poly(ctx, [[x-r,y-r],[x+r,y-r],[x+r,y+r],[x-r,y+r]], '#1a4fa0', '#fff', s*0.05);
      poly(ctx, [[x-r*0.72,y+r*0.72],[x+r*0.5,y-r*0.6],[x+r*0.72,y+r*0.72]], '#fff', null);
      pedGlyph(ctx, x-r*0.1, y-r*0.04, s*0.62, '#1a4fa0');
      ctx.fillStyle='#fff';
      ctx.fillRect(x-r*0.72, y+r*0.5, r*1.44, r*0.2);
    },

    /* Zeichen 215 - Kreisverkehr */
    roundabout: function(ctx,x,y,s){
      var r=s*0.5;
      circle(ctx,x,y,r,'#1a4fa0','#fff',s*0.05);
      for (var i=0;i<3;i++){
        var a0 = -Math.PI/2 + i*(Math.PI*2/3) + 0.35;
        var a1 = a0 + 1.25;
        arrowCurve(ctx, x, y, r*0.52, a0, a1, '#fff', s*0.085, true);
      }
    },

    /* Zeichen 274.1 - Zone 30 */
    zone30: function(ctx,x,y,s){
      var r=s*0.5;
      poly(ctx, [[x-r,y-r*0.9],[x+r,y-r*0.9],[x+r,y+r*0.9],[x-r,y+r*0.9]], '#fff', '#111', s*0.045);
      circle(ctx,x,y-r*0.06,r*0.46,'#fff','#d02020',s*0.09);
      ctx.fillStyle='#111';
      ctx.font='bold '+(s*0.36)+'px Arial, sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('30', x, y-r*0.04);
      ctx.font='bold '+(s*0.17)+'px Arial, sans-serif';
      ctx.fillText('ZONE', x, y+r*0.62);
    },

    /* Zeichen 274 - zulaessige Hoechstgeschwindigkeit */
    limit50: function(ctx,x,y,s){
      circle(ctx,x,y,s*0.5,'#fff','#d02020',s*0.11);
      ctx.fillStyle='#111';
      ctx.font='bold '+(s*0.44)+'px Arial, sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('50', x, y+s*0.02);
    },

    /* Zeichen 325.1 - verkehrsberuhigter Bereich (Spielstrasse) */
    play_street: function(ctx,x,y,s){
      var r=s*0.5;
      poly(ctx, [[x-r,y-r],[x+r,y-r],[x+r,y+r],[x-r,y+r]], '#1a4fa0', '#fff', s*0.05);
      ctx.fillStyle='#fff';
      ctx.fillRect(x-r*0.8, y+r*0.42, r*1.6, r*0.16);
      pedGlyph(ctx, x+r*0.28, y+r*0.02, s*0.52, '#fff');
      pedGlyph(ctx, x-r*0.34, y+r*0.06, s*0.38, '#fff');
      /* small car silhouette */
      ctx.fillStyle='#fff';
      roundRect(ctx, x-r*0.78, y-r*0.62, r*0.72, r*0.34, r*0.08); ctx.fill();
    },

    /* Zeichen 720 - Gruenpfeil */
    green_arrow: function(ctx,x,y,s){
      var r=s*0.5;
      poly(ctx, [[x-r,y-r],[x+r,y-r],[x+r,y+r],[x-r,y+r]], '#111', '#333', s*0.04);
      ctx.save();
      ctx.fillStyle='#25c05a';
      ctx.translate(x,y);
      ctx.beginPath();
      ctx.moveTo(-r*0.55,-r*0.5); ctx.lineTo(-r*0.15,-r*0.5);
      ctx.lineTo(-r*0.15, r*0.02); ctx.lineTo(r*0.2, r*0.02);
      ctx.lineTo(r*0.2, -r*0.28); ctx.lineTo(r*0.68, r*0.16);
      ctx.lineTo(r*0.2, r*0.6);  ctx.lineTo(r*0.2, r*0.34);
      ctx.lineTo(-r*0.55, r*0.34);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    },

    /* Andreaskreuz - Schienenverkehr hat Vorrang */
    tram: function(ctx,x,y,s){
      var r=s*0.5;
      ctx.save();
      ctx.strokeStyle='#d02020'; ctx.lineWidth=s*0.15; ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(x-r*0.9,y-r*0.55); ctx.lineTo(x+r*0.9,y+r*0.55);
      ctx.moveTo(x-r*0.9,y+r*0.55); ctx.lineTo(x+r*0.9,y-r*0.55);
      ctx.stroke();
      ctx.restore();
    },

    /* Bushaltestelle (Zeichen 224) */
    bus_stop: function(ctx,x,y,s){
      var r=s*0.5;
      circle(ctx,x,y,r,'#ffcc00','#111',s*0.05);
      ctx.fillStyle='#111';
      ctx.fillRect(x-r*0.42, y-r*0.42, r*0.84, r*0.62);
      ctx.fillStyle='#ffcc00';
      ctx.fillRect(x-r*0.32, y-r*0.32, r*0.64, r*0.24);
      ctx.fillStyle='#111';
      circle(ctx, x-r*0.24, y+r*0.26, r*0.11, '#111', null);
      circle(ctx, x+r*0.24, y+r*0.26, r*0.11, '#111', null);
    },

    /* "no sign here" placeholder for rechts-vor-links junctions */
    none: function(ctx,x,y,s){
      circle(ctx,x,y,s*0.46,'rgba(255,255,255,0.06)','#6b7684',s*0.05);
      ctx.strokeStyle='#6b7684'; ctx.lineWidth=s*0.07; ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(x-s*0.16,y-s*0.16); ctx.lineTo(x+s*0.16,y+s*0.16);
      ctx.stroke();
    },

    ringentry: function(ctx,x,y,s){ draw.yield(ctx,x,y,s); },
    ring:      function(ctx,x,y,s){ draw.priority(ctx,x,y,s); },
    exit:      function(ctx,x,y,s){ draw.play_street(ctx,x,y,s); }
  };

  /* label shown under a sign in the briefing panel */
  var LABEL = {
    yield:        ['Vorfahrt gewaehren', 'Give way (Z 205)'],
    stop:         ['Stop', 'Full stop required (Z 206)'],
    priority:     ['Vorfahrtstrasse', 'Priority road (Z 306)'],
    priority_next:['Vorfahrt', 'Priority at next junction (Z 301)'],
    crossing:     ['Fussgaengerueberweg', 'Zebra crossing (Z 350)'],
    roundabout:   ['Kreisverkehr', 'Roundabout (Z 215)'],
    zone30:       ['Zone 30', 'Zone limit 30 km/h'],
    limit50:      ['Tempo 50', 'Speed limit 50 km/h'],
    play_street:  ['Verkehrsberuhigter Bereich', 'Home zone - walking pace'],
    green_arrow:  ['Gruenpfeil', 'Right on red after a full stop (Z 720)'],
    tram:         ['Andreaskreuz', 'Rail vehicles have priority'],
    bus_stop:     ['Haltestelle', 'Bus stop (Z 224)'],
    none:         ['Kein Schild', 'No sign - rechts vor links applies'],
    ringentry:    ['Vorfahrt gewaehren', 'Give way to the circle'],
    exit:         ['Ausfahrt', 'Leaving a home zone - give way to all']
  };

  function render(ctx, type, x, y, s){
    var f = draw[type];
    if (f) f(ctx, x, y, s);
  }

  /* Build a small <canvas> element showing a sign - used by the UI panels */
  function chip(type, size){
    size = size || 46;
    var c = document.createElement('canvas');
    var dpr = window.devicePixelRatio || 1;
    c.width = size*dpr; c.height = size*dpr;
    c.style.width = size+'px'; c.style.height = size+'px';
    var ctx = c.getContext('2d');
    ctx.scale(dpr,dpr);
    render(ctx, type, size/2, size/2, size*0.86);
    return c;
  }

  /* Signs are redrawn on every frame in both views, so rasterise each
     one once and reuse the bitmap. Keyed by type and pixel size. */
  var cache = {};
  function bitmap(type, px){
    var key = type + '|' + px;
    if (cache[key]) return cache[key];
    var c = document.createElement('canvas');
    c.width = px; c.height = px;
    var g = c.getContext('2d');
    render(g, type, px/2, px/2, px*0.72);
    cache[key] = c;
    return c;
  }

  return { render:render, chip:chip, bitmap:bitmap,
           LABEL:LABEL, pedGlyph:pedGlyph, draw:draw };
})();
