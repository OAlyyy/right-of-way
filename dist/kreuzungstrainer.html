'use strict';
/* ------------------------------------------------------------------
   sim.js - the world: vehicles, pedestrians, traffic lights and the
   examiner ("Pruefer") that writes down every mistake.
   ------------------------------------------------------------------ */

var Sim = (function(){

  var CROSS_MID  = CFG.BOX + 46;   // distance of a zebra crossing from centre
  var CROSS_HALF = 18;             // half depth of the striped area

  /* ---------- helpers on paths ---------- */

  /* projection of a path point onto an arm axis (distance from centre
     measured along that arm, negative on the far side)                */
  function proj(p, arm){
    var o = Geo.ARM_VEC[arm];
    return p.x*o.x + p.y*o.y;
  }
  /* first s where the projection on `arm` drops to or below d (approach) */
  function sProjBelow(path, arm, d){
    for (var s=0; s<=path.length; s+=2){
      if (proj(path.at(s), arm) <= d) return s;
    }
    return path.length;
  }
  /* first s after `from` where the projection on `arm` rises to d (exit) */
  function sProjAbove(path, arm, d, from){
    for (var s=(from||0); s<=path.length; s+=2){
      if (proj(path.at(s), arm) >= d) return s;
    }
    return path.length;
  }
  /* comfortable speed through the curvature of the path, per 10 units */
  function curveProfile(path){
    var prof = [], A_LAT = 4.2*CFG.PPM, DEC = 70, i;
    for (var s=0; s<=path.length; s+=10){
      var a = path.at(Math.max(0,s-18)), b = path.at(s), c = path.at(Math.min(path.length,s+18));
      var h1 = Math.atan2(b.y-a.y, b.x-a.x), h2 = Math.atan2(c.y-b.y, c.x-b.x);
      var d = Math.abs(Math.atan2(Math.sin(h2-h1), Math.cos(h2-h1)));
      var arc = Geo.dist(a,b) + Geo.dist(b,c);
      var R = d > 0.01 ? arc/d : 1e6;
      prof.push(Math.min(kmh(200), Math.sqrt(A_LAT*R)));
    }
    /* backward pass: at every point be slow enough to still reach the
       speed the next bend demands, braking comfortably                */
    for (i = prof.length-2; i >= 0; i--)
      prof[i] = Math.min(prof[i], Math.sqrt(prof[i+1]*prof[i+1] + 2*DEC*10));
    return prof;
  }
  function curveV(veh, s){
    var i = Math.round(s/10);
    if (i < 0) i = 0;
    if (i >= veh.prof.length) i = veh.prof.length-1;
    return veh.prof[i];
  }
  /* speed we may still have now in order to be stopped at distance d */
  /* Is this vehicle actually coming, or is it parked at its own line? */
  function isApproaching(o){
    if (o.v > kmh(3)) return true;
    if (o.lineS !== undefined && o.s < o.lineS - 4) return false;
    return true;
  }

  function approachV(d, dec){
    if (d <= 0) return 0;
    return Math.sqrt(2*dec*d);
  }

  /* ---------------- Vehicle ---------------- */
  function Vehicle(o){
    for (var k in o) this[k] = o[k];
    this.kind      = o.kind || 'car';
    this.len       = o.len || CFG.CAR_L;
    this.wid       = o.wid || CFG.CAR_W;
    this.v         = o.v || 0;
    this.indicator = o.indicator || 'off';
    this.brakeLight= false;
    this.didStop   = false;
    this.prof      = curveProfile(this.path);
    this.pos       = this.path.at(this.s);
    this.done      = false;
  }
  Vehicle.prototype.front = function(){
    return { x:this.pos.x + Math.cos(this.pos.h)*this.len*0.5,
             y:this.pos.y + Math.sin(this.pos.h)*this.len*0.5 };
  };
  Vehicle.prototype.turn = function(){ return Geo.turnOf(this.fromArm, this.toArm); };

  /* ---------------- Pedestrian ---------------- */
  function Ped(o){
    for (var k in o) this[k] = o[k];
    this.u     = o.u0;                    // lateral position across the road
    this.state = o.start === 'walking' ? 'walking' : 'waiting';
    this.wait  = 0;
  }
  Ped.prototype.point = function(){
    var o = Geo.ARM_VEC[this.arm], p = Geo.rot90cw(o);
    return { x:o.x*this.d + p.x*this.u, y:o.y*this.d + p.y*this.u };
  };
  Ped.prototype.onRoad = function(){ return Math.abs(this.u) < CFG.BOX + 4; };

  /* ---------------- World ---------------- */
  function World(sc){
    this.sc = sc;
    this.t  = 0;
    this.vehicles = [];
    this.peds = [];
    this.faults = [];
    this.state = 'run';          // run | done | crash
    this.endTimer = 0;
    this.maxSpeed = 0;
    this.idle = 0;
    this.hintText = null;
    this.build();
  }

  World.prototype.pathFor = function(spec){
    var L = this.sc.layout;
    if (spec.kind === 'tram') return Geo.railPath(spec.from, spec.to, spec.railOffset||0);
    if (L.type === 'roundabout') return Geo.roundaboutPath(spec.from, spec.to);
    if (spec.kind === 'bus' && spec.bay) return this.busPath(spec);
    return Geo.junctionPath(spec.from, spec.to);
  };

  /* a bus that starts parked in a lay-by and merges back into the lane */
  World.prototype.busPath = function(spec){
    var jp = Geo.junctionPath(spec.from, spec.to);
    var o  = Geo.ARM_VEC[spec.from], r = Geo.rot90cw(o);
    var d0 = spec.d0;
    var bay = { x:Geo.laneIn(spec.from,d0).x + r.x*CFG.LANE*0.66,
                y:Geo.laneIn(spec.from,d0).y + r.y*CFG.LANE*0.66 };
    var merged = Geo.laneIn(spec.from, d0-150);
    var pts = [bay, merged];
    for (var i=0;i<jp.pts.length;i++){
      if (proj(jp.pts[i], spec.from) < d0-150) pts.push(jp.pts[i]);
    }
    return new Geo.Path(Geo.smooth(pts,1));
  };

  World.prototype.build = function(){
    var sc = this.sc, self = this;
    var holdR = sc.layout.type === 'roundabout' ? CFG.RING + 76 : CFG.BOX + 8;

    function mk(spec, isPlayer){
      var path = self.pathFor(spec);
      var v = new Vehicle({
        path: path, fromArm: spec.from, toArm: spec.to,
        kind: spec.kind || 'car',
        color: spec.color || (isPlayer ? '#4da3ff' : '#e0574a'),
        isPlayer: !!isPlayer,
        len: spec.len, wid: spec.wid,
        emergency: !!spec.emergency,
        signOverride: spec.sign,
        cruise: kmh(spec.speed !== undefined ? spec.speed : 45),
        v: kmh(spec.v0 !== undefined ? spec.v0 : (spec.speed !== undefined ? spec.speed : 45)),
        s: 0, id: spec.id || ('v'+Math.random().toString(36).slice(2,7)),
        parked: !!spec.parked, releaseAt: spec.releaseAt,
        bay: !!spec.bay, indicator: spec.indicator || 'off'
      });
      v.s = (spec.kind === 'bus' && spec.bay) ? 0
          : v.path.sAtRadius(spec.d0 !== undefined ? spec.d0 : CFG.FAR-10);
      v.arriveRel = spec.arriveRel;
      if (spec.parked) v.v = 0;
      v.junctionS = v.path.sAtRadius(holdR);
      v.lineS = v.junctionS - v.len*0.5;   // where the FRONT reaches the line
      /* zebra crossing on the approach arm */
      if (self.hasCrossing(spec.from)){
        v.crossS = sProjBelow(v.path, spec.from, CROSS_MID + CROSS_HALF + 10);
      }
      /* zebra crossing on the arm we turn into */
      if (self.hasCrossing(spec.to) && spec.to !== spec.from){
        v.exitCrossS = sProjAbove(v.path, spec.to, CROSS_MID - CROSS_HALF - 6, v.junctionS);
      }
      v.pos = v.path.at(v.s);
      return v;
    }

    this.player = mk(sc.player, true);
    this.player.maxV = kmh(sc.player.maxSpeed || 70);
    this.vehicles.push(this.player);

    (sc.traffic||[]).forEach(function(spec){ self.vehicles.push(mk(spec,false)); });

    (sc.peds||[]).forEach(function(p){
      self.peds.push(new Ped({
        arm: p.arm, d: CROSS_MID,
        u0: p.from === 'right' ? (CFG.BOX+22) : -(CFG.BOX+22),
        dir: p.from === 'right' ? -1 : 1,
        start: p.start || 'waiting',
        kid: !!p.kid,
        intent: p.intent !== false
      }));
    });

    /* pre-compute the conflict point of every pair of paths */
    this.conf = {};
    for (var i=0;i<this.vehicles.length;i++){
      for (var j=i+1;j<this.vehicles.length;j++){
        var a = this.vehicles[i], b = this.vehicles[j];
        if (a.fromArm === b.fromArm) continue;      // queueing, not crossing
        var th = (a.kind==='tram'||b.kind==='tram') ? CFG.CAR_W+26 : CFG.CAR_W+14;
        var c = Geo.conflictOf(a.path, b.path, th);
        if (c) this.conf[a.id+'|'+b.id] = c;
      }
    }

    /* --- scenario timing ---------------------------------------------
       A scenario is only a good exercise if the other car reaches the
       conflict point at the right moment. Instead of hand-tuning start
       distances, a vehicle may declare arriveRel = how many seconds
       before (-) or after (+) the player it should get there. We solve
       for its start position once the conflict points are known.      */
    var p = this.player;
    for (var v = 0; v < this.vehicles.length; v++){
      var o = this.vehicles[v];
      if (o.isPlayer || o.arriveRel === undefined) continue;
      var c = this.conflictBetween(p, o);
      if (!c) continue;
      var ref = kmh(sc.player.refSpeed !== undefined ? sc.player.refSpeed
                    : (sc.player.v0 !== undefined ? sc.player.v0 : 45));
      var tPlayer = (c.sa - p.s) / Math.max(ref, kmh(5));
      var tO = Math.max(0.2, tPlayer + o.arriveRel);
      o.s = Geo.clamp(c.sb - tO*Math.max(o.v, kmh(5)), 0, Math.max(0, c.sb - 30));
      o.pos = o.path.at(o.s);
      o.junctionS = o.path.sAtRadius(holdR);
      o.lineS = o.junctionS - o.len*0.5;
    }
  };

  /* exposed so tools and the UI can ask "how fast may I take this bend" */
  World.prototype.curveSpeed = function(veh, s){ return curveV(veh, s); };

  /* Which junction's rules apply to this vehicle right now?
     A lesson has exactly one, so it is always the scenario itself; the
     open-world map returns whichever junction the car is approaching. */
  World.prototype.junctionFor = function(){ return this.sc; };

  World.prototype.hasCrossing = function(arm){
    return !!(this.sc.layout.crossings && this.sc.layout.crossings.indexOf(arm) >= 0);
  };
  World.prototype.conflictBetween = function(a,b){
    var c = this.conf[a.id+'|'+b.id];
    if (c) return { sa:c.sa, sb:c.sb, x:c.x, y:c.y };
    c = this.conf[b.id+'|'+a.id];
    if (c) return { sa:c.sb, sb:c.sa, x:c.x, y:c.y };
    return null;
  };
  World.prototype.light = function(arm, veh){
    return Rules.lightFor(this.junctionFor(veh || this.player), arm, this.t);
  };

  /* ---------------- longitudinal control ---------------- */

  /* everything that forces `veh` to slow down; returns {v, cause} */
  World.prototype.constraints = function(veh){
    var self = this, sc = this.sc;
    var best = { v: Math.min(veh.cruise, curveV(veh, veh.s)), cause:null, kind:null };
    function want(v, cause, kind){
      if (v < best.v){ best.v = v; best.cause = cause; best.kind = kind || cause; }
    }

    /* --- traffic light --- */
    var J  = this.junctionFor(veh);
    var ls = Rules.lightFor(J, veh.fromArm, this.t);
    if (ls && veh.s < veh.lineS){
      var d = veh.lineS - veh.s;
      var canStop = d > (veh.v*veh.v)/(2*CFG.AI_DEC);
      if (ls === 'red' || ls === 'redyellow' || (ls === 'yellow' && canStop)){
        if (!(Rules.hasGreenArrow(J, veh.fromArm) && veh.turn() === 'right' && veh.didStop))
          want(approachV(d - 4, CFG.AI_DEC), 'light', 'light');
      }
    }
    /* --- stop sign: a full halt, once --- */
    var sign = veh.signOverride || Rules.signOf(J, veh.fromArm);
    if ((sign === 'stop' || (Rules.hasGreenArrow(J, veh.fromArm) && ls === 'red'))
        && !veh.didStop && veh.s < veh.lineS){
      want(approachV(veh.lineS - veh.s - 2, CFG.AI_DEC), 'stopsign', 'stopsign');
    }
    /* --- Sec. 8 II StVO: approach slowly enough to still give way ---
       "mit maessiger Geschwindigkeit heranfahren". Without it an AI
       cruises up to the line at 50 and only reacts once somebody is
       actually there, by which point no amount of braking helps and it
       simply drives into them. Free driving only: a lesson's traffic is
       placed to arrive at a chosen moment, and slowing it here would
       rewrite the choreography the lesson is teaching. */
    if (this.moderateApproach && veh.s < veh.lineS && !veh.emergency){
      var onPriority = (sign === 'priority') || ls === 'green' || ls === 'yellow';
      if (!onPriority)
        want(approachV(veh.lineS - veh.s, CFG.AI_DEC*0.33) + kmh(7), 'sightline', 'sightline');
    }

    /* --- pedestrians on a crossing ahead of us --- */
    for (var pi=0; pi<this.peds.length; pi++){
      var ped = this.peds[pi];
      var cs = null;
      if (ped.arm === veh.fromArm && veh.crossS !== undefined && veh.s < veh.crossS) cs = veh.crossS;
      if (ped.arm === veh.toArm && veh.exitCrossS !== undefined && veh.s < veh.exitCrossS) cs = veh.exitCrossS;
      if (cs === null) continue;
      var blocking = ped.state === 'walking' ? ped.onRoad()
                   : (ped.intent && ped.state === 'waiting');
      /* only the half of the road we are about to drive over matters,
         plus a safety margin on the far side                          */
      if (ped.state === 'walking'){
        var side = Geo.rot90cw(Geo.ARM_VEC[veh.fromArm]);
        blocking = ped.onRoad();
      }
      if (blocking) want(approachV(cs - veh.s - 12, CFG.AI_DEC), 'ped', 'ped');
    }
    /* --- keeping our distance from the car in front --- */
    var lead = this.leaderOf(veh);
    if (lead){
      var g = lead.gap - 18;
      want(Math.max(0, Math.min(lead.veh.v + Math.max(0,g)*0.9,
                                approachV(Math.max(0,g), CFG.AI_DEC))), lead.veh, 'follow');
    }

    /* --- Sec. 11 StVO: only enter a junction you can also clear ---
       Without this, a car stops halfway across, wedges the junction and
       everything behind it waits for ever. */
    if (lead && veh.s < veh.lineS && lead.veh.v < kmh(4)){
      var clearLen = (veh.exitS !== undefined ? veh.exitS - veh.lineS : 150) + veh.len*0.6;
      if (lead.gap < clearLen) want(approachV(veh.lineS - veh.s - 4, CFG.AI_DEC), 'blocked', 'blocked');
    }

    /* --- giving way to other vehicles --- */
    for (var i=0;i<this.vehicles.length;i++){
      var o = this.vehicles[i];
      if (o === veh || o.done) continue;

      var c = this.conflictBetween(veh, o);
      if (!c) continue;
      if (veh.s > c.sa + veh.len*0.5) continue;            // we are through
      if (o.s > c.sb + o.len*0.6) continue;                // they are through

      var pr = Rules.priority(this.junctionFor(veh), veh, o, this.t);
      var mustWait = (pr.who === 'b');                     // `o` has priority
      var tOther = (c.sb - o.s) / Math.max(o.v, kmh(10));
      var tMe    = (c.sa - veh.s) / Math.max(veh.v, kmh(6));

      /* Once you are past the line and merging into the same exit as
         the other car, your job is to clear the junction, not to stop in
         it (Sec. 11). Waiting inside a junction is only right when you
         are a left-turner holding for oncoming traffic. */
      /* Whoever is already crossing the junction is let out first, whatever
         the signs say: you cannot enforce priority against a car that is
         already in there. Only cars still short of their own line defer,
         and only to somebody actually moving through - defer to one that
         has stopped, and a left-turner waiting inside for us while we wait
         outside for it holds the junction shut for good. */
      var occupying = o.s > o.lineS && (o.exitS === undefined || o.s < o.exitS) &&
                      o.v > kmh(3) && o.brakeCause !== veh;
      /* Gate on the real conflict point, not our own give-way line: on a
         wide junction a car can clear its line well before it reaches
         where the paths actually cross, and stops needing to look out for
         someone already committed right when it matters most. */
      if (occupying && veh.s < c.sa - 10 && tMe < 3.2)
        want(approachV(Math.max(0, c.sa - veh.s - 14), CFG.AI_DEC), o, 'occupied');

      var merging = (veh.toArm === o.toArm) && veh.s > veh.lineS + 6;
      /* patience: if we have both been crawling a while, somebody has to
         move, which is what a driver waving you through amounts to */
      var deadlocked = (veh.stoppedFor || 0) > 4 && (o.stoppedFor || 0) > 4;
      if (mustWait && isApproaching(o) && !deadlocked && !merging){
        if (tOther < tMe + 2.4 || o.s > c.sb - o.len){
          var stopAt = Math.min(veh.lineS, c.sa - veh.len*0.5 - 22);
          want(approachV(stopAt - veh.s, CFG.AI_DEC), o, 'yield');
        }
      } else if (pr.who === 'coordinate'){
        /* Nobody has priority here, so somebody still has to decide. Judge
           both cars by the same yardstick - the separate speed floors above
           flatter the other car, so each reads the other as the faster and
           both stop - and settle a dead heat the same way every time. Two
           cars politely waiting for each other lock a roundabout solid. */
        var floor = kmh(8);
        var tHim = (c.sb - o.s)   / Math.max(o.v,   floor);
        var tUs  = (c.sa - veh.s) / Math.max(veh.v, floor);
        var giveWay = tHim < tUs - 0.3 ||
                      (Math.abs(tHim - tUs) <= 0.3 && String(o.id) < String(veh.id));
        if (giveWay && tUs < 2.2 && !deadlocked)
          want(approachV(Math.max(0, c.sa - veh.s - 34), CFG.AI_DEC), o, 'yield');
      }
    }
    return best;
  };

  /* The vehicle we are following: nearest one ahead, in our lane, pointing
     roughly the same way. Works across separate paths, which the open-world
     map needs and a lesson does not mind. */
  World.prototype.leaderOf = function(veh){
    var best = null, c = Math.cos(veh.pos.h), s = Math.sin(veh.pos.h);
    for (var i=0;i<this.vehicles.length;i++){
      var o = this.vehicles[i];
      if (o === veh || o.done) continue;
      var dx = o.pos.x - veh.pos.x, dy = o.pos.y - veh.pos.y;
      if (Math.hypot(dx,dy) > 420) continue;
      var lon =  dx*c + dy*s;
      var lat = -dx*s + dy*c;
      if (lon <= 0) continue;
      if (Math.abs(lat) > (veh.wid + o.wid)*0.5 + 14) continue;
      var dh = Math.atan2(Math.sin(o.pos.h - veh.pos.h), Math.cos(o.pos.h - veh.pos.h));
      if (Math.abs(dh) > 1.0) continue;
      var gap = lon - (veh.len + o.len)*0.5;
      if (!best || gap < best.gap) best = { veh:o, gap:gap };
    }
    return best;
  };

  /* Last-resort anti-crash braking for the AI only.
     Measured against the other car's real footprint - the same circles
     the collision test uses - rather than its bounding box. A box is far
     too fat side-on: it makes a car waiting in its own lane read as if it
     were parked across the junction, which is how a whole town gridlocks.
     Only what is genuinely ahead of our own nose counts; something level
     with us we drive clear of, we do not stop for. */
  World.prototype.proximityBrake = function(veh){
    var near = [], i, j, k;
    for (i=0;i<this.vehicles.length;i++){
      var o = this.vehicles[i];
      if (o === veh || o.done) continue;
      if (Geo.dist(o.pos, veh.pos) > 230) continue;
      near.push({ veh:o, circ:bodyCircles(o) });
    }
    if (!near.length) return { v:1e9, who:null };

    /* Walk our own path forward from the nose and ask what we would
       actually drive into. Projecting on the current heading instead gets
       a turn badly wrong - it looks straight through the bend - and calls
       a car standing beside us an obstruction, which wedges junctions. */
    var half = veh.wid*0.5, limit = 1e9, who = null;
    var end = Math.min(190, veh.path.length - veh.s);
    for (var d = veh.len*0.5 + 4; d <= end; d += 8){
      var q = veh.path.at(veh.s + d);
      for (j=0;j<near.length;j++){
        var circ = near[j].circ;
        for (k=0;k<circ.length;k++){
          if (Math.hypot(circ[k].x - q.x, circ[k].y - q.y) > half + circ[k].r + 4) continue;
          var lim = approachV(Math.max(0, d - veh.len*0.5 - 12), CFG.AI_DEC*1.15);
          if (lim < limit){ limit = lim; who = near[j].veh; }
        }
      }
      if (limit <= 0) break;
    }
    return { v:limit, who:who };
  };

  /* ---------------- update ---------------- */
  World.prototype.update = function(dt, input){
    var i;
    if (this.state !== 'run'){ this.endTimer += dt; return; }
    this.t += dt;

    /* --- pedestrians decide whether to step onto the road --- */
    for (i=0;i<this.peds.length;i++) this.updatePed(this.peds[i], dt);

    /* --- vehicles --- */
    for (i=0;i<this.vehicles.length;i++){
      var veh = this.vehicles[i];
      if (veh.done) continue;
      if (veh.isPlayer) this.drivePlayer(veh, dt, input);
      else this.driveAI(veh, dt);

      veh.s += veh.v*dt;
      veh.pos = veh.path.at(veh.s);
      veh.stoppedFor = veh.v < kmh(5) ? (veh.stoppedFor || 0) + dt
                                       : Math.max(0, (veh.stoppedFor || 0) - dt*2.5);
      if (veh.v < kmh(1.6) && veh.s < veh.junctionS) veh.didStop = true;
      if (veh.s >= veh.path.length - 4){
        if (veh.isPlayer) this.finish('ziel');
        else veh.done = true;
      }
    }

    this.examine(dt, input);
    this.collisions();
  };

  World.prototype.updatePed = function(ped, dt){
    if (ped.state === 'walking'){
      ped.u += ped.dir*CFG.PED_V*dt;
      if (Math.abs(ped.u) > CFG.BOX + 26) ped.state = 'done';
      return;
    }
    if (ped.state !== 'waiting') return;
    ped.wait += dt;
    /* step out when the nearest approaching car is far enough away or slow */
    var safe = true;
    for (var i=0;i<this.vehicles.length;i++){
      var v = this.vehicles[i];
      if (v.done) continue;
      var cs = (v.fromArm === ped.arm && v.crossS !== undefined) ? v.crossS
             : (v.toArm === ped.arm && v.exitCrossS !== undefined) ? v.exitCrossS : null;
      if (cs === null || v.s > cs) continue;
      var tt = (cs - v.s) / Math.max(v.v, 1);
      if (v.v > kmh(6) && tt < 2.6) safe = false;
    }
    if (ped.intent && (safe || ped.wait > 6)) ped.state = 'walking';
  };

  World.prototype.driveAI = function(veh, dt){
    if (veh.parked){
      if (this.t < (veh.releaseAt||0)){ veh.v = 0; return; }
      if (this.t < (veh.releaseAt||0) + 1.2){ veh.indicator = 'left'; veh.v = 0; veh.pullingOut = true; return; }
      veh.pullingOut = veh.s < veh.path.sAtRadius(CFG.FAR - 260);
      veh.parked = false;
    }
    var c = this.constraints(veh);
    var prox = this.proximityBrake(veh);
    var target = Math.min(c.v, prox.v);
    veh.brakeCause = (c.v <= prox.v + 0.01) ? c.cause : prox.who;
    veh.brakeKind  = (c.v <= prox.v + 0.01) ? c.kind  : 'prox';
    if (target > veh.cruise) target = veh.cruise;

    if (target > veh.v) veh.v = Math.min(target, veh.v + CFG.AI_ACC*dt);
    else                veh.v = Math.max(target, veh.v - CFG.AI_DEC*dt);
    if (veh.v < 0) veh.v = 0;
    veh.brakeLight = target < veh.v - 1;

    /* AI indicators */
    var t = veh.turn();
    if (this.junctionFor(veh).layout.type === 'roundabout'){
      veh.indicator = veh.s > veh.path.length - 260 ? 'right' : 'off';
    } else if (veh.s > veh.junctionS - 220 && veh.s < veh.junctionS + 60 && t !== 'straight'){
      veh.indicator = t;
    } else if (!veh.pullingOut){
      veh.indicator = 'off';
    }
  };

  World.prototype.drivePlayer = function(veh, dt, input){
    if (input.throttle) veh.v += CFG.ACC*dt;
    else if (input.brake) veh.v -= CFG.BRAKE*dt;
    else veh.v -= CFG.COAST*dt;
    veh.v = Geo.clamp(veh.v, 0, veh.maxV);
    veh.brakeLight = !!input.brake;
    veh.indicator = input.indicator;
    this.maxSpeed = Math.max(this.maxSpeed, veh.v);
  };

  /* ---------------- the examiner ---------------- */
  World.prototype.fault = function(id, reason, detail){
    for (var i=0;i<this.faults.length;i++) if (this.faults[i].id === id) return;
    this.faults.push({ id:id, reason:reason||null, detail:detail||null, t:this.t });
  };

  World.prototype.examine = function(dt, input){
    var sc = this.sc, p = this.player, i;
    var prevS = p.prevS === undefined ? p.s : p.prevS;

    /* --- speed limit --- */
    /* Booked for driving too fast, not for the instant a new limit starts
       to apply: passing a sign at the old speed and slowing is what a
       driver actually does. */
    var lim = sc.limit || 50;
    if (toKmh(p.v) > lim + 4) this.overspeed = (this.overspeed || 0) + dt;
    else this.overspeed = 0;
    if (this.overspeed > 1.2) this.fault('zu_schnell', null, {
      de: Math.round(toKmh(this.maxSpeed))+' km/h statt erlaubter '+lim+' km/h',
      en: Math.round(toKmh(this.maxSpeed))+' km/h where '+lim+' km/h is the limit' });
    /* --- Schrittgeschwindigkeit (home zone, bus with hazard lights) --- */
    if (sc.walkingPace && p.s < p.lineS && toKmh(p.v) > 9)
      this.fault('schritt', null, {
        de: Math.round(toKmh(p.v))+' km/h – erlaubt sind etwa 4 bis 7 km/h',
        en: Math.round(toKmh(p.v))+' km/h – about 4 to 7 km/h is allowed' });
    /* --- too fast through the bend --- */
    if (p.s > p.lineS && p.v > curveV(p, p.s)*1.7 && p.turn() !== 'straight')
      this.fault('kurve_zu_schnell');

    /* Note, every frame we are still short of the line, which conflicting
       cars the game is calling clear. A car far off can tip the arithmetic
       either way between one frame and the next, and the examiner must not
       be able to contradict a tenth of a second later the answer it was
       giving while we decided to go. */
    if (p.s < p.lineS){
      if (!p.wasClear) p.wasClear = {};
      for (var wi=0; wi<this.vehicles.length; wi++){
        var wv = this.vehicles[wi];
        if (wv.isPlayer || wv.done) continue;
        var wc = this.conflictBetween(p, wv);
        if (wc && !this.hinders(p, wv, wc)) p.wasClear[wv.id] = this.t;
      }
    }

    /* --- crossing the stop line: the big moment --- */
    if (prevS < p.lineS && p.s >= p.lineS){
      this.checkEntry();
    }
    /* --- stopped past the line while obliged to give way --- */
    if (p.v < kmh(1.5) && p.s > p.lineS + 10 && p.s < p.lineS + 80 && this.mustGiveWayHere())
      this.fault('haltelinie');

    /* --- pedestrian crossings --- */
    this.checkPeds(prevS);

    /* --- bus pulling out: did we squeeze past it? --- */
    for (i=0;i<this.vehicles.length;i++){
      var b = this.vehicles[i];
      if (b.kind !== 'bus' || !b.pullingOut || b.fromArm !== p.fromArm) continue;
      if (b.v < kmh(4) && proj(p.pos, p.fromArm) < proj(b.pos, b.fromArm) - 4)
        this.fault('bus_behindert', 'bus');
    }
    /* --- an AI with priority forced to brake because of us --- */
    for (i=0;i<this.vehicles.length;i++){
      var o = this.vehicles[i];
      if (o.isPlayer || o.done) continue;
      if (o.brakeCause !== p) continue;
      /* being behind us in the queue is not a failure to give way */
      if (o.brakeKind === 'follow' || o.brakeKind === 'blocked') continue;
      /* it stood and let us out: it does not get to change its mind */
      if (p.conceded && p.conceded[o.id]) continue;
      if (o.brakeKind === 'prox'){
        /* A last-resort lift-off is not evidence on its own: the envelope
           it uses is deliberately fat, so two cars rounding the same bend
           in their own lanes trip it. Blame us only where the paths really
           do cross, and only once we have actually crossed our own line -
           behind it we are where we belong. */
        if (!this.conflictBetween(p, o)) continue;
        if (p.s < p.lineS) continue;
        if (Geo.dist(o.pos, p.pos) > 130) continue;
        var dh = Math.abs(Math.atan2(Math.sin(o.pos.h - p.pos.h), Math.cos(o.pos.h - p.pos.h)));
        if (dh < 0.6) continue;                 // same direction: just traffic
      }
      /* Slowing for its own bend is not "had to brake because of you". */
      var freeV = Math.min(o.cruise, this.curveSpeed(o, o.s));
      if (o.v > freeV*0.75) continue;
      var pr = Rules.priority(this.junctionFor(p), p, o, this.t);
      if (pr.who === 'b') this.fault(this.faultForReason(pr.reason), pr.reason, this.describe(o));
    }
    /* --- standing still although we had priority --- */
    if (p.v < kmh(1.2) && p.s < p.lineS && p.s > p.lineS - 150){
      /* queued behind somebody is not dithering: we cannot drive through
         the car in front, and Sec. 11 forbids entering a junction we
         could not clear anyway */
      var ahead = this.leaderOf(p);
      var queued = !!(ahead && ahead.gap < 110 && ahead.veh.v < kmh(6));
      if (!queued && !this.mustGiveWayHere() && !this.pedBlocking() && this.light(p.fromArm, p) !== 'red'
          && this.light(p.fromArm, p) !== 'redyellow'
          && (p.signOverride || Rules.signOf(this.junctionFor(p), p.fromArm)) !== 'stop'){
        this.idle += dt;
        if (this.idle > 2.0) this.fault('vorfahrt_nicht_genutzt');
      }
    } else this.idle = 0;

    /* --- time limit --- */
    if (this.t > (sc.timeLimit || 45)){ this.fault('zeit'); this.finish('zeit'); }

    p.prevS = p.s;
  };

  World.prototype.faultForReason = function(reason){
    if (reason === 'einsatz') return 'einsatz_blockiert';
    if (reason === 'bus')     return 'bus_behindert';
    return 'vorfahrt';
  };

  /* description of the other party, in German, for the report */
  World.prototype.describe = function(o){
    var p = this.player, de = null, en = null;
    if (o.fromArm === Geo.rightOf(p.fromArm)){ de = ' von rechts'; en = ' from your right'; }
    else if (o.fromArm === Geo.leftOf(p.fromArm)){ de = ' von links'; en = ' from your left'; }
    else if (o.fromArm === Geo.opposite(p.fromArm)){ de = ' aus dem Gegenverkehr'; en = ' coming the other way'; }
    var whatDe = o.kind === 'tram' ? 'Die Strassenbahn'
               : o.kind === 'bus'  ? 'Der Linienbus'
               : o.emergency       ? 'Das Einsatzfahrzeug' : 'Das Fahrzeug';
    var whatEn = o.kind === 'tram' ? 'The tram'
               : o.kind === 'bus'  ? 'The bus'
               : o.emergency       ? 'The emergency vehicle' : 'The car';
    return { de: whatDe + (de||''), en: whatEn + (en||'') };
  };

  /* Would pulling out now actually hold the other driver up?
     Both the live hint and the examiner ask this exact question, so the
     game can never warn you it is clear and then book you for going. */
  World.prototype.hinders = function(p, o, c){
    if (o.s > c.sb + o.len*0.6) return false;   // already through
    /* A car that is slow only because it is already easing off for us is
       still coming: pull out and it simply has to keep braking, which is
       the fault itself. Without this the game waves you into a car that
       lifted off precisely because you were waiting at the line. Once it
       has genuinely come to a stand we take it at its word and go. */
    var easingForUs = (o.brakeCause === p) && (o.stoppedFor || 0) < 3;
    if (!easingForUs){
      if (!isApproaching(o)) return false;      // waiting at its own line
      if (o.v < kmh(5)) return false;           // standing still
    }
    var freeV  = Math.max(o.v, o.cruise*0.8);
    var tOther = (c.sb - o.s - (o.len*0.5 + 18)) / Math.max(freeV, kmh(10));
    var tClear = (c.sa + p.len*0.5 + 24 - p.s) / Math.max(p.v, kmh(14));
    return tOther < tClear + 0.9;
  };

  /* is there, right now, somebody we are obliged to wait for? */
  World.prototype.mustGiveWayHere = function(){
    var p = this.player, sc = this.sc;
    var ls = this.light(p.fromArm, p);
    if (ls === 'red' || ls === 'redyellow') return true;
    for (var i=0;i<this.vehicles.length;i++){
      var o = this.vehicles[i];
      if (o.isPlayer || o.done) continue;
      /* a bus indicating out of its stop just ahead of us */
      if (o.kind === 'bus' && o.pullingOut && o.fromArm === p.fromArm){
        var gap = proj(p.pos, p.fromArm) - proj(o.pos, o.fromArm);
        if (gap > 0 && gap < 330) return true;
      }
      var c = this.conflictBetween(p,o);
      if (!c) continue;
      if (o.s > c.sb + o.len*0.6) continue;
      var pr = Rules.priority(this.junctionFor(p), p, o, this.t);
      if (pr.who !== 'b') continue;
      if (this.hinders(p, o, c)) return true;
    }
    return false;
  };
  World.prototype.pedBlocking = function(){
    for (var i=0;i<this.peds.length;i++){
      var ped = this.peds[i];
      if (ped.state === 'walking' && ped.onRoad()) return true;
      if (ped.state === 'waiting' && ped.intent) return true;
    }
    return false;
  };

  /* the moment the player passes the give-way / stop line */
  World.prototype.checkEntry = function(){
    var sc = this.sc, p = this.player, i;
    var ls  = this.light(p.fromArm, p);
    var arrow = Rules.hasGreenArrow(this.junctionFor(p), p.fromArm) && p.turn() === 'right';

    /* red light */
    if (ls === 'red' || ls === 'redyellow'){
      if (arrow){ if (!p.didStop) this.fault('gruenpfeil_kein_halt'); }
      else this.fault('rotlicht');
    }
    /* stop sign */
    var sign = p.signOverride || Rules.signOf(this.junctionFor(p), p.fromArm);
    if (sign === 'stop' && !p.didStop) this.fault('stop_kein_halt');

    /* indicators */
    var t = p.turn();
    if (this.junctionFor(p).layout.type === 'roundabout'){
      if (p.indicator === 'left') this.fault('blinker_kreisel', null,
        { de:'Beim Einfahren in den Kreisel wird nicht geblinkt.',
          en:'You indicated left while joining the roundabout.' });
    } else if (t === 'left' && p.indicator !== 'left'){
      this.fault('blinker', null, { de:'Links abgebogen ohne Blinker.', en:'Turned left without indicating.' });
    } else if (t === 'right' && p.indicator !== 'right'){
      this.fault('blinker', null, { de:'Rechts abgebogen ohne Blinker.', en:'Turned right without indicating.' });
    }

    /* did we cut in front of somebody with priority? */
    /* Whoever was not in our way as we committed is noted down. The hint
       and the examiner must give the same answer, so a car that had
       stopped and let us go cannot become a failure to give way once we
       are already across the line and committed to the turn. */
    p.conceded = {};
    for (i=0;i<this.vehicles.length;i++){
      var o = this.vehicles[i];
      if (o.isPlayer || o.done) continue;
      var c = this.conflictBetween(p,o);
      if (!c) continue;
      var pr = Rules.priority(this.junctionFor(p), p, o, this.t);
      if (pr.who !== 'b') continue;
      var clearAt = p.wasClear && p.wasClear[o.id];
      var toldClear = clearAt !== undefined && this.t - clearAt < 0.7;
      if (this.hinders(p, o, c) && !toldClear)
        this.fault(this.faultForReason(pr.reason), pr.reason, this.describe(o));
      else p.conceded[o.id] = true;
    }
  };

  World.prototype.checkPeds = function(prevS){
    var p = this.player;
    for (var i=0;i<this.peds.length;i++){
      var ped = this.peds[i];
      var cs = (ped.arm === p.fromArm && p.crossS !== undefined) ? p.crossS
             : (ped.arm === p.toArm && p.exitCrossS !== undefined) ? p.exitCrossS : null;
      if (cs === null) continue;
      if (prevS < cs && p.s >= cs){
        var turning = (ped.arm === p.toArm && p.toArm !== p.fromArm);
        if (ped.state === 'walking' && ped.onRoad())
          this.fault(turning ? 'abbiegen_fussgaenger' : 'fussgaenger', null,
            { de:'Der Fussgänger war schon auf der Fahrbahn.',
              en:'The pedestrian was already on the road.' });
        else if (ped.state === 'waiting' && ped.intent && p.v > kmh(12))
          this.fault(turning ? 'abbiegen_fussgaenger' : 'fussgaenger', null,
            { de:'Der Fussgänger wartete erkennbar am Bordstein.',
              en:'The pedestrian was clearly waiting at the kerb.' });
      }
    }
  };

  /* ---------------- collisions ---------------- */
  function bodyCircles(v){
    var c = Math.cos(v.pos.h), s = Math.sin(v.pos.h);
    var n = Math.max(2, Math.round(v.len/26)), out = [];
    for (var i=0;i<n;i++){
      var t = (i/(n-1) - 0.5)*(v.len - v.wid);
      out.push({ x:v.pos.x + c*t, y:v.pos.y + s*t, r:v.wid*0.5 });
    }
    return out;
  }
  World.prototype.collisions = function(){
    var p = this.player, i, j, k, m;
    var pc = bodyCircles(p);
    for (i=0;i<this.vehicles.length;i++){
      var o = this.vehicles[i];
      if (o.isPlayer || o.done) continue;
      var oc = bodyCircles(o);
      for (k=0;k<pc.length;k++) for (m=0;m<oc.length;m++){
        if (Math.hypot(pc[k].x-oc[m].x, pc[k].y-oc[m].y) < pc[k].r+oc[m].r-3){
          this.fault('kollision', null, this.describe(o));
          this.crashPoint = { x:(pc[k].x+oc[m].x)/2, y:(pc[k].y+oc[m].y)/2 };
          this.finish('crash');
          return;
        }
      }
    }
    for (i=0;i<this.peds.length;i++){
      var ped = this.peds[i];
      if (ped.state === 'done') continue;
      var pp = ped.point();
      for (k=0;k<pc.length;k++){
        if (Math.hypot(pc[k].x-pp.x, pc[k].y-pp.y) < pc[k].r + 9){
          this.fault('ped_kollision');
          this.crashPoint = pp;
          this.finish('crash');
          return;
        }
      }
    }
  };

  World.prototype.finish = function(why){
    if (this.state !== 'run') return;
    this.state = why === 'crash' ? 'crash' : 'done';
    this.endReason = why;
    this.player.v = why === 'crash' ? 0 : this.player.v;
  };

  /* ---------------- live coaching hint ---------------- */
  /* Returns a bilingual {de,en} pair, or null. The UI picks a language. */
  World.prototype.hint = function(){
    var p = this.player, sc = this.sc, i;
    if (this.state !== 'run') return null;
    var ls = this.light(p.fromArm, p);

    if (p.s < p.lineS){
      if (ls === 'red' || ls === 'redyellow')
        return { de:'Rot – vor der Haltelinie anhalten.',
                 en:'Red – stop before the line.' };
      if (ls === 'yellow')
        return { de:'Gelb – anhalten, wenn du noch sicher bremsen kannst.',
                 en:'Amber – stop if you can still brake safely.' };

      var sign = p.signOverride || Rules.signOf(this.junctionFor(p), p.fromArm);
      if (sign === 'stop' && !p.didStop)
        return { de:'Stoppschild: vollständig anhalten, auch wenn frei ist.',
                 en:'STOP sign: come to a complete standstill, even if the road is clear.' };
      if (Rules.hasGreenArrow(this.junctionFor(p), p.fromArm) && ls === 'red' && !p.didStop)
        return { de:'Grünpfeil: erst vollständig halten, dann rechts abbiegen.',
                 en:'Green arrow: stop completely first, then turn right.' };
      if (this.pedBlocking() && p.crossS !== undefined && p.s < p.crossS)
        return { de:'Fussgänger am Überweg – anhalten und vorlassen.',
                 en:'Pedestrian at the crossing – stop and let them go.' };

      /* who, specifically, do we have to wait for? */
      var worst = null;
      for (i=0;i<this.vehicles.length;i++){
        var o = this.vehicles[i];
        if (o.isPlayer || o.done) continue;
        var c = this.conflictBetween(p,o);
        if (!c || o.s > c.sb + o.len || !isApproaching(o)) continue;
        var pr = Rules.priority(this.junctionFor(p), p, o, this.t);
        var tOther = (c.sb - o.s)/Math.max(o.v, kmh(10));
        if (pr.who === 'b' && tOther < 5.5){
          var who = this.describe(o);
          var r = Rules.REASON_TEXT[pr.reason];
          worst = {
            de: who.de + ' hat Vorfahrt' + (r ? ' – ' + r.title.de.toLowerCase() : '') + '.',
            en: who.en + ' has priority' + (r ? ' – ' + r.title.en.toLowerCase() : '') + '.'
          };
        }
      }
      if (worst) return worst;

      /* nothing to wait for: coach the mechanics instead */
      var t = p.turn();
      if (this.junctionFor(p).layout.type === 'roundabout')
        return { de:'Kreisverkehr: Vorfahrt beachten, beim Einfahren NICHT blinken.',
                 en:'Roundabout: give way to the circle, and do NOT indicate joining it.' };
      if (t !== 'straight' && p.indicator !== t)
        return t === 'left'
          ? { de:'Blinker links setzen.', en:'Indicate left.' }
          : { de:'Blinker rechts setzen.', en:'Indicate right.' };
      if (p.v < kmh(3) && p.s > p.lineS - 120)
        return { de:'Frei – du darfst fahren.', en:'Clear – you may go.' };
      /* in the driver view you have to actually look before you go */
      if (p.s > p.lineS - 220 && this.junctionFor(p).layout.type !== 'roundabout')
        return { de:'Vor der Kreuzung: Tempo raus und nach links und rechts schauen.',
                 en:'Coming up to the junction: ease off and look left and right.' };
      return { de:'Frei – du darfst fahren.', en:'Clear – you may go.' };
    }

    var nearExit = (p.exitS !== undefined) ? (p.s > p.exitS - 260 && p.s < p.exitS)
                                           : (p.s > p.path.length - 300);
    if (this.junctionFor(p).layout.type === 'roundabout' && p.indicator !== 'right' && nearExit)
      return { de:'Vor dem Verlassen des Kreisels rechts blinken.',
               en:'Indicate right before you leave the roundabout.' };
    if (p.exitCrossS !== undefined && p.s < p.exitCrossS && this.pedBlocking())
      return { de:'Beim Abbiegen haben Fussgänger Vorrang.',
               en:'Pedestrians have priority over you while you turn.' };
    return null;
  };

  /* ---------------- final report ---------------- */
  World.prototype.report = function(){
    var score = 100, major = 0;
    var rows = this.faults.map(function(f){
      var def = Rules.FAULTS[f.id];
      score -= def.pts;
      if (def.sev === 'major') major++;
      return { id:f.id, def:def, reason:f.reason, detail:f.detail };
    });
    score = Math.max(0, score);
    return { score:score, passed: major === 0 && score >= 70, faults:rows,
             reason:this.endReason };
  };

  return { World:World, Vehicle:Vehicle, Ped:Ped, curveProfile:curveProfile,
           CROSS_MID:CROSS_MID, CROSS_HALF:CROSS_HALF, proj:proj };
})();

/* ---------- js/city.js ---------- */
'use strict';
/* ------------------------------------------------------------------
   city.js - the open world.

   A grid of junctions joined by two-lane streets. Each junction carries
   its own signs, so the same priority engine that runs a single lesson
   runs the whole town. You drive a route through it; the examiner sits
   in the passenger seat and stops you the moment you get something
   wrong.
   ------------------------------------------------------------------ */

var City = (function(){

  var SPACING = 1160;              // centre to centre (~97 m)
  var ENTRY   = 250;               // where a junction's own geometry starts
  var LINK    = SPACING - 2*ENTRY; // straight bit between two junctions

  /* deterministic RNG so a seed always rebuilds the same town */
  function rng(seed){
    var x = seed || 12345;
    return function(){
      x ^= x << 13; x ^= x >>> 17; x ^= x << 5;
      return ((x >>> 0) % 100000) / 100000;
    };
  }

  /* ---------------- the local shape of one junction ---------------- */
  /* from the entry point on arm A to the exit point on arm B, in
     coordinates local to the junction centre                         */
  function junctionPiece(from, to, kind){
    if (kind === 'roundabout'){
      var pts = [Geo.laneIn(from, ENTRY), Geo.laneIn(from, CFG.RING + 70)];
      var a0 = Geo.ARM_ANGLE[from] + 16, a1 = Geo.ARM_ANGLE[to] - 16;
      while (a1 <= a0) a1 += 360;
      for (var a = a0; a <= a1; a += 6) pts.push(Geo.ringPoint(a, CFG.RING));
      pts.push(Geo.ringPoint(a1, CFG.RING));
      pts.push(Geo.laneOut(to, CFG.RING + 70));
      pts.push(Geo.laneOut(to, ENTRY));
      return Geo.smooth(pts, 2);
    }
    var turn = Geo.turnOf(from, to);
    var ext  = turn === 'straight' ? CFG.BOX : CFG.BOX + 34;
    var p1 = Geo.laneIn(from, ext), p2 = Geo.laneOut(to, ext);
    var out = [Geo.laneIn(from, ENTRY), p1];
    if (turn !== 'straight'){
      var c = Geo.lineIntersect(p1, Geo.mul(Geo.ARM_VEC[from], -1), p2, Geo.ARM_VEC[to]);
      if (c) out = out.concat(Geo.quadPoints(p1, c, p2, 16).slice(1));
      else out.push(p2);
    } else out.push(p2);
    out.push(Geo.laneOut(to, ENTRY));
    return out;
  }

  /* Where two cars crossing the same junction actually meet.
     Computed once for every pair of movements and reused everywhere. */
  var CONFLICT = null;
  function buildConflictTable(){
    if (CONFLICT) return CONFLICT;
    CONFLICT = {};
    var arms = Geo.ARM_ORDER, moves = [];
    arms.forEach(function(f){
      arms.forEach(function(t){
        if (f !== t) moves.push({ f:f, t:t, path:new Geo.Path(junctionPiece(f, t, 'cross')) });
      });
    });
    for (var i = 0; i < moves.length; i++){
      for (var j = 0; j < moves.length; j++){
        if (i === j) continue;
        var A = moves[i], B = moves[j];
        if (A.f === B.f) continue;                 // a queue, not a crossing
        var c = Geo.conflictOf(A.path, B.path, CFG.CAR_W + 14);
        if (c) CONFLICT[A.f + A.t + '|' + B.f + B.t] = { sa:c.sa, sb:c.sb };
      }
    }
    return CONFLICT;
  }
  function localConflict(fa, ta, fb, tb){
    return buildConflictTable()[fa + ta + '|' + fb + tb] || null;
  }

  /* Real Frankfurt street names, so the free drive reads like a real
     town instead of "Street 3". A separate RNG stream from the layout's
     own `rand`, so naming never perturbs which junction gets which sign -
     the two are shuffled independently. */
  var FRANKFURT_STREETS = [
    'Zeil', 'Kaiserstraße', 'Berger Straße', 'Mainzer Landstraße',
    'Bockenheimer Landstraße', 'Friedberger Landstraße', 'Eschersheimer Landstraße',
    'Hanauer Landstraße', 'Schweizer Straße', 'Leipziger Straße', 'Münchener Straße',
    'Taunusstraße', 'Gutleutstraße', 'Niddastraße', 'Braubachstraße', 'Fahrgasse',
    'Oeder Weg', 'Berliner Straße', 'Adickesallee', 'Miquelallee', 'Frankenallee',
    'Darmstädter Landstraße', 'Homburger Landstraße', 'Grüneburgweg'
  ];
  function shuffled(list, rand){
    var out = list.slice(), i;
    for (i = out.length - 1; i > 0; i--){
      var j = Math.floor(rand()*(i+1)), t = out[i]; out[i] = out[j]; out[j] = t;
    }
    return out;
  }

  /* ---------------- the map ---------------- */
  function Map(opts){
    opts = opts || {};
    this.cols = opts.cols || 5;
    this.rows = opts.rows || 4;
    var rand = rng(opts.seed || 7);
    var srand = rng((opts.seed || 7) * 7919 + 104729);
    var pool = shuffled(FRANKFURT_STREETS, srand);
    this.rowStreets = []; this.colStreets = [];
    var ri, ci;
    for (ri = 0; ri < this.rows; ri++) this.rowStreets.push(pool[ri % pool.length]);
    for (ci = 0; ci < this.cols; ci++) this.colStreets.push(pool[(this.rows + ci) % pool.length]);
    this.nodes = [];

    var c, r, i;
    for (r = 0; r < this.rows; r++){
      for (c = 0; c < this.cols; c++){
        this.nodes.push({
          id: r*this.cols + c, c:c, r:r,
          x: (c - (this.cols-1)/2) * SPACING,
          y: (r - (this.rows-1)/2) * SPACING,
          arms: [], layout:{ type:'cross', signs:{} }, lights:null
        });
      }
    }
    /* which streets are through-roads */
    var priRow = 1 + Math.floor(rand()*Math.max(1, this.rows-1));
    var priCol = 1 + Math.floor(rand()*Math.max(1, this.cols-1));

    for (i = 0; i < this.nodes.length; i++){
      var n = this.nodes[i];
      if (n.r > 0)           n.arms.push('N');
      if (n.r < this.rows-1) n.arms.push('S');
      if (n.c > 0)           n.arms.push('W');
      if (n.c < this.cols-1) n.arms.push('E');
      /* the renderer reads L.arms off the layout, the way a lesson's
         scenario carries it - keep the two shapes the same */
      n.layout.arms = n.arms;

      var onPriRow = (n.r === priRow), onPriCol = (n.c === priCol);
      var roll = rand();

      if (onPriRow && onPriCol){
        /* two main roads meeting: put lights here */
        n.lights = {
          groups:{ N:'A', S:'A', E:'B', W:'B' }, t0: Math.floor(rand()*20),
          program:[ { A:'green', B:'red', dur:12 }, { A:'yellow', B:'red', dur:3 },
                    { A:'red', B:'redyellow', dur:1.5 }, { A:'red', B:'green', dur:12 },
                    { A:'red', B:'yellow', dur:3 }, { A:'redyellow', B:'red', dur:1.5 } ]
        };
        n.arms.forEach(function(a){ n.layout.signs[a] = 'none'; });
        n.kind = 'lights';
      } else if (onPriRow || onPriCol){
        var mainArms = onPriRow ? ['E','W'] : ['N','S'];
        n.arms.forEach(function(a){
          n.layout.signs[a] = mainArms.indexOf(a) >= 0 ? 'priority'
                            : (roll > 0.78 ? 'stop' : 'yield');
        });
        n.kind = 'priority';
      } else if (roll > 0.88 && n.arms.length === 4){
        /* the town's roundabout */
        n.layout.type = 'roundabout';
        n.arms.forEach(function(a){ n.layout.signs[a] = 'ringentry'; });
        n.kind = 'roundabout';
      } else {
        n.arms.forEach(function(a){ n.layout.signs[a] = 'none'; });
        n.kind = 'rvl';
      }

      /* a zebra crossing on some approaches of quiet junctions */
      if (n.kind === 'rvl' && rand() > 0.72){
        n.layout.crossings = [n.arms[Math.floor(rand()*n.arms.length)]];
      }
      n.limit = (n.kind === 'rvl' || n.kind === 'roundabout') ? 30 : 50;
      /* the rule engine reads these off an object shaped like a scenario */
      n.railPriority = false;
    }
    this.nodeAt = function(cc, rr){
      if (cc < 0 || rr < 0 || cc >= this.cols || rr >= this.rows) return null;
      return this.nodes[rr*this.cols + cc];
    };
  }

  Map.prototype.neighbour = function(node, arm){
    var d = { N:[0,-1], S:[0,1], E:[1,0], W:[-1,0] }[arm];
    return this.nodeAt(node.c + d[0], node.r + d[1]);
  };

  /* The street a given exit from `node` belongs to: a north-south arm is
     the column's street, an east-west arm the row's - the grid's real
     corridors, not the junction itself. */
  Map.prototype.streetName = function(node, arm){
    return (arm === 'N' || arm === 'S') ? this.colStreets[node.c] : this.rowStreets[node.r];
  };

  /* ---------------- routes ---------------- */
  /* A route is a list of junction traversals. Each one knows where it
     starts along the path, where its give-way line is, and where it
     hands over to the next.                                          */
  Map.prototype.buildRoute = function(startNode, startArm, steps, rand){
    rand = rand || Math.random;
    var route = [], node = startNode, from = startArm, i;
    for (i = 0; i < steps; i++){
      var outs = node.arms.filter(function(a){ return a !== from; });
      if (!outs.length) break;
      /* prefer going straight on, the way a real route mostly does */
      var straight = Geo.opposite(from);
      var to;
      if (outs.indexOf(straight) >= 0 && rand() < 0.5) to = straight;
      else to = outs[Math.floor(rand()*outs.length) % outs.length];
      var next = this.neighbour(node, to);
      route.push({ node:node, from:from, to:to });
      if (!next) break;
      node = next;
      from = Geo.opposite(to);
    }
    return route;
  };

  /* Turn a route into one long path, remembering the landmarks the
     rule engine needs for every step. Points are de-duplicated here so
     the indices still line up with the finished Path.               */
  Map.prototype.routePath = function(route){
    var pts = [], marks = [];
    function push(p){
      if (!pts.length || Geo.dist(pts[pts.length-1], p) > 0.5) pts.push(p);
    }
    var first = route[0];
    var lead = Geo.laneIn(first.from, ENTRY + LINK);
    push({ x:first.node.x + lead.x, y:first.node.y + lead.y });

    route.forEach(function(step, i){
      var piece = junctionPiece(step.from, step.to, step.node.layout.type);
      var startIdx = pts.length;
      piece.forEach(function(q){ push({ x:step.node.x + q.x, y:step.node.y + q.y }); });
      marks.push({ step:step, startIdx:startIdx, endIdx:pts.length - 1 });
      var nxt = route[i+1];
      if (nxt){
        var link = Geo.laneIn(nxt.from, ENTRY);
        push({ x:nxt.node.x + link.x, y:nxt.node.y + link.y });
      } else {
        var out = Geo.laneOut(step.to, ENTRY + LINK);
        push({ x:step.node.x + out.x, y:step.node.y + out.y });
      }
    });

    var path = new Geo.Path(pts);
    var steps = marks.map(function(m){
      var n = m.step.node;
      /* the give-way line is set back from the carriageway edge, so a car
         waiting at it stands clear of the traffic crossing in front */
      var holdR = n.layout.type === 'roundabout' ? CFG.RING + 76 : CFG.BOX + 34;
      var enterS = path.cum[m.startIdx];
      var exitS  = path.cum[m.endIdx];
      /* the give-way line: first point inside holdR, searched only
         across this junction rather than the whole route */
      var jS = enterS;
      for (var t = enterS; t <= exitS; t += 2){
        var q = path.at(t);
        if (Math.hypot(q.x - n.x, q.y - n.y) <= holdR){ jS = t; break; }
      }
      return { node:n, from:m.step.from, to:m.step.to,
               enterS:enterS, exitS:exitS, junctionS:jS };
    });
    return { path:path, steps:steps };
  };

  return {
    SPACING:SPACING, ENTRY:ENTRY, LINK:LINK,
    Map:Map, junctionPiece:junctionPiece,
    localConflict:localConflict, buildConflictTable:buildConflictTable,
    rng:rng
  };
})();

/* ---------- js/drive.js ---------- */
'use strict';
/* ------------------------------------------------------------------
   drive.js - free driving through the open world.

   Reuses the lesson simulator wholesale: same physics, same priority
   engine, same fault catalogue. What changes is that every car now
   carries a route through many junctions instead of sitting on one,
   and the examiner interrupts the drive the moment you get it wrong.
   ------------------------------------------------------------------ */

var Drive = (function(){

  var TARGET_TRAFFIC = 13;
  var SPAWN_NEAR = 2400, DESPAWN_FAR = 3400;
  /* rewind: a snapshot of the whole town every half second, the last ~15 s
     kept, and a retry goes back this far before the moment of the fault */
  var SNAP_EVERY = 0.5, SNAP_KEEP = 30, REWIND_BY = 5;

  /* ---------------- the world ---------------- */
  function DriveWorld(opts){
    opts = opts || {};
    this.map  = new City.Map({ cols:opts.cols || 5, rows:opts.rows || 4, seed:opts.seed || 7 });
    this.rand = City.rng((opts.seed || 7) * 31 + 11);
    this.sc   = { limit:50, timeLimit:1e9, layout:{ type:'cross', arms:Geo.ARM_ORDER, signs:{} },
                  points:[], title:'Freie Fahrt', en:'Free drive' };
    this.t = 0;
    this.vehicles = [];
    this.peds = [];
    this.faults = [];
    this.state = 'run';
    this.endTimer = 0;
    this.maxSpeed = 0;
    this.idle = 0;
    this.paused = false;
    this.pending = null;          // the fault being explained right now
    this.fixed   = [];            // faults taken back with a rewind and retried
    this.history = [];            // snapshots for rewinding
    this.hold    = null;          // after a rewind: frozen until you press gas
    this.cleared = 0;             // junctions driven correctly
    this.target  = opts.target || 12;
    this.moderateApproach = true; // Sec. 8 II: live traffic eases off at junctions
    this.build();
  }
  DriveWorld.prototype = Object.create(Sim.World.prototype);
  DriveWorld.prototype.constructor = DriveWorld;

  /* ---------------- building ---------------- */
  DriveWorld.prototype.build = function(){
    City.buildConflictTable();
    var m = this.map;
    var start = m.nodeAt(0, m.rows - 1) || m.nodes[0];
    var startArm = start.arms.indexOf('S') >= 0 ? 'S' : start.arms[0];

    this.player = this.makeCar({
      node:start, from:startArm, steps:60, isPlayer:true,
      color:'#4da3ff', speed:50
    });
    this.player.maxV = kmh(90);
    this.player.v = kmh(30);
    this.vehicles.push(this.player);

    for (var i = 0; i < TARGET_TRAFFIC; i++) this.spawnTraffic(true);
  };

  var CAR_COLORS = ['#e0574a','#e8b93c','#54a86b','#d8dde3','#7a6fd0','#3f8fd0','#c97b3f'];

  DriveWorld.prototype.makeCar = function(o){
    var route = this.map.buildRoute(o.node, o.from, o.steps, this.rand);
    if (!route.length) return null;
    var built = this.map.routePath(route);
    var v = new Sim.Vehicle({
      path: built.path, fromArm: route[0].from, toArm: route[0].to,
      kind: o.kind || 'car',
      color: o.color || CAR_COLORS[Math.floor(this.rand()*CAR_COLORS.length)],
      isPlayer: !!o.isPlayer,
      cruise: kmh(o.speed || (38 + Math.floor(this.rand()*14))),
      v: kmh(o.v0 !== undefined ? o.v0 : (o.speed || 42)),
      s: o.s || 0,
      id: 'v' + (this.nextId = (this.nextId || 0) + 1)
    });
    v.steps = built.steps;
    v.stepIdx = 0;
    this.syncStep(v, true);
    v.pos = v.path.at(v.s);
    return v;
  };

  /* Move a vehicle's "current junction" on when it has driven through
     one, and republish the landmarks the rule engine reads. */
  DriveWorld.prototype.syncStep = function(veh, force){
    var st = veh.steps[veh.stepIdx];
    while (st && veh.s > st.exitS + 10 && veh.stepIdx < veh.steps.length - 1){
      if (veh.isPlayer && !veh.faultedHere) this.cleared++;
      veh.faultedHere = false;
      veh.stepIdx++;
      veh.didStop = false;
      veh.conceded = null;          // a new junction, a fresh judgement
      st = veh.steps[veh.stepIdx];
      force = true;
    }
    if (!st) return;
    if (force || veh.fromArm !== st.from){
      veh.fromArm  = st.from;
      veh.toArm    = st.to;
      veh.node     = st.node;
      veh.junctionS = st.junctionS;
      veh.lineS     = st.junctionS - veh.len*0.5;
      veh.enterS    = st.enterS;
      veh.exitS     = st.exitS;
      veh.crossS = undefined; veh.exitCrossS = undefined;
      var cr = st.node.layout.crossings;
      if (cr && cr.indexOf(st.from) >= 0) veh.crossS = veh.lineS - 26;
    }
  };

  /* ---------------- rules context ---------------- */
  DriveWorld.prototype.junctionFor = function(veh){
    var n = (veh && veh.node) || (this.player && this.player.node);
    return n || this.sc;
  };
  DriveWorld.prototype.hasCrossing = function(){ return false; };

  /* Two cars conflict only if they are both at the same junction. */
  DriveWorld.prototype.conflictBetween = function(a, b){
    if (!a.node || !b.node || a.node !== b.node) return null;
    if (a.fromArm === b.fromArm) return null;
    /* A roundabout's conflict table is still built from straight-line
       "cross" geometry (buildConflictTable always passes kind:'cross'),
       which is only an approximation good for where an entering car meets
       the ring. Two cars both already circulating never actually cross -
       it is a single lane - so without this a phantom intersection from
       that approximation has them "coordinate" past each other and collide;
       likewise two cars both still waiting to enter do not cross either. */
    if (a.node.layout.type === 'roundabout'){
      var aCirc = a.s >= a.junctionS, bCirc = b.s >= b.junctionS;
      if (aCirc === bCirc) return null;
    }
    var lc = City.localConflict(a.fromArm, a.toArm, b.fromArm, b.toArm);
    if (!lc) return null;
    return { sa: a.enterS + lc.sa, sb: b.enterS + lc.sb };
  };

  /* ---------------- traffic ---------------- */
  DriveWorld.prototype.spawnTraffic = function(initial){
    var m = this.map, p = this.player;
    for (var tries = 0; tries < 20; tries++){
      var node = m.nodes[Math.floor(this.rand()*m.nodes.length)];
      if (!node.arms.length) continue;
      var arm = node.arms[Math.floor(this.rand()*node.arms.length)];
      var d = Math.hypot(node.x - (p ? p.pos.x : 0), node.y - (p ? p.pos.y : 0));
      if (p && (d < 420 || d > SPAWN_NEAR)) continue;
      var car = this.makeCar({ node:node, from:arm, steps:8, s:this.rand()*700 });
      if (!car) continue;
      /* don't drop one on top of somebody */
      var clash = false;
      for (var i = 0; i < this.vehicles.length; i++){
        if (Geo.dist(this.vehicles[i].pos, car.pos) < 120) { clash = true; break; }
      }
      if (clash) continue;
      this.vehicles.push(car);
      return car;
    }
    return null;
  };

  DriveWorld.prototype.cullTraffic = function(){
    var p = this.player, keep = [];
    for (var i = 0; i < this.vehicles.length; i++){
      var v = this.vehicles[i];
      if (v.isPlayer){ keep.push(v); continue; }
      var d = Geo.dist(v.pos, p.pos);
      var far = d > DESPAWN_FAR;
      var finished = v.s >= v.path.length - 8;
      /* last resort: something wedged itself somewhere out of sight */
      var wedged = (v.stoppedFor || 0) > 25 && d > 900;
      if (!far && !finished && !wedged) keep.push(v);
    }
    this.vehicles = keep;
    while (this.vehicles.length < TARGET_TRAFFIC + 1) {
      if (!this.spawnTraffic()) break;
    }
  };

  /* ---------------- update ---------------- */
  DriveWorld.prototype.update = function(dt, input){
    if (this.paused || this.state !== 'run'){
      if (this.state !== 'run') this.endTimer += dt;
      return;
    }
    /* just rewound: the town waits for you to set off again */
    if (this.hold){
      if (!input.throttle && !input.brake) return;
      this.hold = null;
    }
    if (this.t - (this.lastSnap === undefined ? -1 : this.lastSnap) >= SNAP_EVERY) this.remember();
    this.t += dt;
    var i;

    for (i = 0; i < this.vehicles.length; i++){
      var veh = this.vehicles[i];
      if (veh.done) continue;
      this.syncStep(veh);
      if (veh.isPlayer) this.drivePlayer(veh, dt, input);
      else this.driveAI(veh, dt);
      veh.s += veh.v*dt;
      veh.pos = veh.path.at(veh.s);
      /* patience timer: feeds the deadlock breaker in the rule engine */
      veh.stoppedFor = veh.v < kmh(5) ? (veh.stoppedFor || 0) + dt
                                       : Math.max(0, (veh.stoppedFor || 0) - dt*2.5);
      if (veh.v < kmh(1.6) && veh.s < veh.junctionS) veh.didStop = true;
      if (veh.s >= veh.path.length - 4){
        if (veh.isPlayer) this.extendPlayer();
        else veh.done = true;
      }
    }

    this.examine(dt, input);
    if (this.grace > 0) this.grace -= dt; else this.collisions();
    this.speedLimit();
    if ((this.tick = (this.tick || 0) + 1) % 45 === 0) this.cullTraffic();
    if (this.cleared >= this.target && !this.faults.length) this.finish('ziel');
  };

  /* the road never runs out: graft another stretch on the end */
  DriveWorld.prototype.extendPlayer = function(){
    var p = this.player;
    var last = p.steps[p.steps.length - 1];
    var node = this.map.neighbour(last.node, last.to);
    if (!node){ this.finish('ziel'); return; }
    var route = this.map.buildRoute(node, Geo.opposite(last.to), 40, this.rand);
    if (!route.length){ this.finish('ziel'); return; }
    var built = this.map.routePath(route);
    p.path = built.path;
    p.prof = Sim.curveProfile(p.path);
    p.steps = built.steps;
    p.stepIdx = 0;
    p.s = 0;
    p.prevS = 0;
    this.syncStep(p, true);
    p.pos = p.path.at(0);
  };

  /* The limit belongs to the street you are on, and a new one starts at
     the sign - which stands where the next junction's geometry begins,
     not the moment the last junction is behind you. */
  DriveWorld.prototype.speedLimit = function(){
    var p = this.player, st = p.steps && p.steps[p.stepIdx];
    if (!st) return;
    var here = st.node.limit || 50;
    if (p.s < st.enterS && p.streetLimit){
      this.sc.limit  = p.streetLimit;
      this.nextLimit = here !== p.streetLimit ? here : null;
    } else {
      p.streetLimit  = here;
      this.sc.limit  = here;
      this.nextLimit = null;
    }
  };

  /* ---------------- the examiner ---------------- */
  /* Same checks as a lesson, but instead of running to the end we stop
     the car and explain the moment something goes wrong. */
  DriveWorld.prototype.fault = function(id, reason, detail){
    if (this.pending) return;
    this.lastFault = this.lastFault || {};
    if (this.lastFault[id] !== undefined && this.t - this.lastFault[id] < 10) return;
    this.lastFault[id] = this.t;
    var rec = { id:id, reason:reason || null, detail:detail || null, t:this.t };
    this.faults.push(rec);
    this.pending = rec;
    this.paused = true;
    this.player.faultedHere = true;
    var def = Rules.FAULTS[id];
    if (def && def.sev === 'major') this.majors = (this.majors || 0) + 1;
  };
  DriveWorld.prototype.resume = function(){
    this.pending = null;
    this.paused = false;
    this.crashPoint = null;
    this.grace = 2.5;              // don't re-trigger on the same contact
  };

  /* ---------------- rewind ---------------- */
  /* Paths, junction nodes and routes never change once built, so a
     vehicle copy can share them; only the few fields that are mutated in
     place need their own copy, and references between vehicles (who is
     braking for whom) are re-pointed at the copies. */
  function copyMap(o){
    var c = {};
    for (var k in o) if (Object.prototype.hasOwnProperty.call(o, k)) c[k] = o[k];
    return c;
  }
  function copyVehicle(v){
    var c = Object.create(Object.getPrototypeOf(v));
    for (var k in v) if (Object.prototype.hasOwnProperty.call(v, k)) c[k] = v[k];
    if (v.conceded) c.conceded = copyMap(v.conceded);
    if (v.wasClear) c.wasClear = copyMap(v.wasClear);
    return c;
  }
  function copyFleet(list){
    var out = list.map(copyVehicle), byId = {};
    out.forEach(function(v){ byId[v.id] = v; });
    out.forEach(function(v){
      for (var k in v){
        if (Object.prototype.hasOwnProperty.call(v, k) && v[k] instanceof Sim.Vehicle)
          v[k] = byId[v[k].id] || null;
      }
    });
    return out;
  }
  var SCALARS = ['t','cleared','idle','overspeed','maxSpeed','tick','grace','nextLimit'];

  DriveWorld.prototype.remember = function(){
    var snap = { vehicles:copyFleet(this.vehicles), limit:this.sc.limit,
                 lastFault:copyMap(this.lastFault || {}) }, self = this;
    SCALARS.forEach(function(k){ snap[k] = self[k]; });
    this.history.push(snap);
    if (this.history.length > SNAP_KEEP) this.history.shift();
    this.lastSnap = this.t;
  };

  DriveWorld.prototype.canRewind = function(){ return this.history.length > 0; };

  /* Take the fault back: put the town where it was a few seconds before
     it happened and let the driver try that moment again. */
  DriveWorld.prototype.rewind = function(){
    var f = this.pending;
    if (!f || !this.history.length) return false;
    var want = f.t - REWIND_BY, i = this.history.length - 1;
    while (i > 0 && this.history[i].t > want) i--;
    var snap = this.history[i], self = this;
    this.history.length = i + 1;           // the future we are undoing

    this.vehicles = copyFleet(snap.vehicles);
    for (var j = 0; j < this.vehicles.length; j++)
      if (this.vehicles[j].isPlayer) this.player = this.vehicles[j];
    SCALARS.forEach(function(k){ self[k] = snap[k]; });
    this.sc.limit = snap.limit;
    this.lastFault = copyMap(snap.lastFault);
    this.lastSnap = this.t;

    /* Everything after the snapshot never happened. The fault you are
       retrying is kept aside so the summary can show what you practised;
       anything else in that window will simply happen again if repeated. */
    this.faults = this.faults.filter(function(x){ return x.t <= snap.t; });
    this.majors = this.faults.filter(function(x){
      var d = Rules.FAULTS[x.id]; return d && d.sev === 'major';
    }).length;
    this.fixed.push(f);
    this.pending = null;
    this.paused = false;
    this.crashPoint = null;
    this.hold = { fault:f, back:Math.max(0, Math.round(f.t - this.t)) };
    this.speedLimit();                     // the sign for where we are now
    return true;
  };

  /* A knock stops you and gets explained, but the drive carries on. */
  DriveWorld.prototype.finish = function(why){
    if (why === 'crash'){ this.player.v = 0; return; }
    if (this.state !== 'run') return;
    this.state = 'done';
    this.endReason = why;
  };

  DriveWorld.prototype.report = function(){
    var score = 100, major = 0;
    var rows = this.faults.map(function(f){
      var def = Rules.FAULTS[f.id];
      score -= def.pts;
      if (def.sev === 'major') major++;
      return { id:f.id, def:def, reason:f.reason, detail:f.detail };
    });
    var fixed = this.fixed.map(function(f){
      return { id:f.id, def:Rules.FAULTS[f.id], reason:f.reason, detail:f.detail };
    });
    return { score:Math.max(0, score), passed: major === 0 && this.cleared >= this.target,
             faults:rows, fixed:fixed, reason:this.endReason, cleared:this.cleared };
  };

  /* ---------------- navigation ---------------- */
  /* the street the player is on right now, for the HUD */
  DriveWorld.prototype.currentStreet = function(){
    var p = this.player, st = p.steps && p.steps[p.stepIdx];
    if (!st) return null;
    return this.map.streetName(st.node, st.to);
  };

  /* what the examiner tells you to do next */
  DriveWorld.prototype.instruction = function(){
    var p = this.player;
    if (!p.steps || !p.steps[p.stepIdx]) return null;
    var st = p.steps[p.stepIdx];
    var dist = Math.max(0, (st.junctionS - p.s) / CFG.PPM);
    var turn = Geo.turnOf(st.from, st.to);
    var far = dist > 60;
    var where = far ? { de:'In ' + Math.round(dist/10)*10 + ' Metern', en:'In ' + Math.round(dist/10)*10 + ' metres' }
                    : { de:'Jetzt', en:'Now' };
    var onto = this.map.streetName(st.node, st.to);
    var what = turn === 'left'  ? { de:'links abbiegen auf die ' + onto, en:'turn left onto ' + onto }
             : turn === 'right' ? { de:'rechts abbiegen auf die ' + onto, en:'turn right onto ' + onto }
             : { de:'geradeaus weiter auf der ' + onto, en:'carry straight on along ' + onto };
    if (st.node.layout.type === 'roundabout')
      what = { de:'im Kreisverkehr ' + (turn === 'left' ? 'dritte' : turn === 'right' ? 'erste' : 'zweite') + ' Ausfahrt auf die ' + onto,
               en:'take the ' + (turn === 'left' ? 'third' : turn === 'right' ? 'first' : 'second') + ' exit onto ' + onto };
    return { de: where.de + ' ' + what.de + '.', en: where.en + ', ' + what.en + '.',
             turn:turn, dist:dist, street:onto };
  };

  return { DriveWorld:DriveWorld };
})();

/* ---------- js/render.js ---------- */
'use strict';
/* ------------------------------------------------------------------
   render.js - top-down drawing of the world.
   ------------------------------------------------------------------ */

var Render = (function(){

  /* Defaults are the night palette; syncTheme() replaces them with
     whatever the stylesheet currently resolves to, so the road follows
     the viewer's light / dark theme like the rest of the page.        */
  var COL = {
    grass:   '#23291f',
    grass2:  '#283021',
    road:    '#2f2e2b',
    kerb:    '#4c4941',
    paint:   '#e9e5d9',
    paintDim:'#a8a499',
    island:  '#2b3624',
    rail:    '#7e7b72',
    shadow:  'rgba(0,0,0,.45)',
    bad:     '#ff6a5e',
    route:   'rgba(107,178,245,0.34)',
    routeArrow:'rgba(107,178,245,0.62)'
  };

  var VARS = {
    grass:'--grass', grass2:'--grass-2', road:'--road', kerb:'--kerb',
    paint:'--paint', paintDim:'--paint-dim', island:'--island',
    rail:'--rail', shadow:'--shadow', bad:'--bad'
  };
  function hexToRgba(hex, a){
    var h = (hex||'').trim().replace('#','');
    if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    if (h.length !== 6) return null;
    var n = parseInt(h,16);
    if (isNaN(n)) return null;
    return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
  }
  /* read the palette back out of the stylesheet */
  function syncTheme(){
    if (typeof document === 'undefined' || !document.documentElement) return;
    if (typeof getComputedStyle !== 'function') return;
    var cs = getComputedStyle(document.documentElement);
    for (var k in VARS){
      var v = cs.getPropertyValue(VARS[k]);
      if (v && v.trim()) COL[k] = v.trim();
    }
    var info = (cs.getPropertyValue('--info')||'').trim();
    COL.route = hexToRgba(info, 0.34) || COL.route;
    COL.routeArrow = hexToRgba(info, 0.62) || COL.routeArrow;
  }

  function armAngle(arm){
    var o = Geo.ARM_VEC[arm];
    return Math.atan2(o.y, o.x);
  }

  /* ---------- camera ---------- */
  function camera(ctx, w, h, world, preview){
    /* Every drawing function below builds its geometry as if the current
       junction sat at the origin - true for a lesson (there is only ever
       one), not for the open world, where junctions sit at their own real
       map coordinates. Recentring the whole transform on the live
       junction here means nothing below needs to know the difference. */
    var j = world.junctionFor(world.player);
    var ox = j.x || 0, oy = j.y || 0;
    var span = j.layout.type === 'roundabout' ? 1180 : 950;
    if (preview) span = j.layout.type === 'roundabout' ? 900 : 680;
    var scale = Math.min(w, h) / span;
    var p = world.player.pos;
    var lx = p.x - ox, ly = p.y - oy;
    var cam = { x:0, y:0 };
    if (!preview){
      /* follow the car when far out, settle onto the junction when close,
         but never so tightly that the junction appears too late to read */
      var k = Geo.clamp((Math.hypot(lx, ly) - 90)/460, 0, 1) * 0.55;
      cam = { x:lx*k, y:ly*k };
    }
    ctx.setTransform(1,0,0,1,0,0);
    ctx.translate(w/2, h/2);
    ctx.scale(scale, scale);
    ctx.translate(-(cam.x + ox), -(cam.y + oy));
    return scale;
  }

  /* ---------- ground ---------- */
  function drawGround(ctx, world){
    var sc = world.junctionFor(world.player), L = sc.layout, i;
    ctx.fillStyle = COL.grass;
    ctx.fillRect(-CFG.FAR*1.4, -CFG.FAR*1.4, CFG.FAR*2.8, CFG.FAR*2.8);

    /* a little texture so motion is visible */
    ctx.fillStyle = COL.grass2;
    for (i=-8;i<=8;i++) for (var j=-8;j<=8;j++){
      if ((i+j)%2) continue;
      ctx.fillRect(i*130-60, j*130-60, 66, 66);
    }

    var ring = L.type === 'roundabout';
    var inner = ring ? CFG.RING + CFG.BOX : 0;

    /* carriageways */
    L.arms.forEach(function(arm){
      ctx.save();
      ctx.rotate(armAngle(arm));
      ctx.fillStyle = COL.kerb;
      ctx.fillRect(inner ? inner-6 : 0, -CFG.BOX-7, CFG.FAR, CFG.BOX*2+14);
      ctx.fillStyle = COL.road;
      ctx.fillRect(inner ? inner-6 : 0, -CFG.BOX, CFG.FAR, CFG.BOX*2);
      ctx.restore();
    });

    if (ring){
      ctx.beginPath();
      ctx.arc(0,0,CFG.RING+CFG.BOX+7,0,Math.PI*2);
      ctx.fillStyle = COL.kerb; ctx.fill();
      ctx.beginPath();
      ctx.arc(0,0,CFG.RING+CFG.BOX,0,Math.PI*2);
      ctx.fillStyle = COL.road; ctx.fill();
      ctx.beginPath();
      ctx.arc(0,0,CFG.RING-CFG.BOX,0,Math.PI*2);
      ctx.fillStyle = COL.island; ctx.fill();
      ctx.beginPath();
      ctx.arc(0,0,CFG.RING-CFG.BOX,0,Math.PI*2);
      ctx.strokeStyle = COL.kerb; ctx.lineWidth = 7; ctx.stroke();
      /* a few bushes on the island */
      ctx.fillStyle = COL.kerb;
      for (var b=0;b<7;b++){
        var a = b/7*Math.PI*2, r = (CFG.RING-CFG.BOX)*0.55;
        ctx.beginPath();
        ctx.arc(Math.cos(a)*r, Math.sin(a)*r, 16, 0, Math.PI*2);
        ctx.fill();
      }
    } else {
      /* junction box on top of the arms */
      ctx.fillStyle = COL.road;
      ctx.fillRect(-CFG.BOX, -CFG.BOX, CFG.BOX*2, CFG.BOX*2);
    }

    /* home-zone paving on one arm */
    if (L.playzone){
      ctx.save();
      ctx.rotate(armAngle(L.playzone));
      ctx.fillStyle = COL.kerb;
      ctx.fillRect(CFG.BOX+40, -CFG.BOX, CFG.FAR, CFG.BOX*2);
      ctx.strokeStyle = COL.road; ctx.lineWidth = 2;
      for (var x=CFG.BOX+60; x<CFG.FAR; x+=40){
        ctx.beginPath(); ctx.moveTo(x, -CFG.BOX); ctx.lineTo(x, CFG.BOX); ctx.stroke();
      }
      ctx.restore();
    }

    /* bus lay-by */
    if (L.busstop){
      ctx.save();
      ctx.rotate(armAngle(L.busstop));
      ctx.fillStyle = COL.road;
      ctx.fillRect(CFG.BOX+330, -CFG.BOX-46, 250, 46);
      ctx.strokeStyle = COL.paintDim; ctx.lineWidth = 3;
      ctx.setLineDash([14,12]);
      ctx.beginPath();
      ctx.moveTo(CFG.BOX+330, -CFG.BOX); ctx.lineTo(CFG.BOX+580, -CFG.BOX);
      ctx.stroke(); ctx.setLineDash([]);
      ctx.restore();
    }
  }

  /* ---------- road markings ---------- */
  function drawMarkings(ctx, world){
    var sc = world.junctionFor(world.player), L = sc.layout;
    var ring = L.type === 'roundabout';
    var inner = ring ? CFG.RING + CFG.BOX : CFG.BOX;

    L.arms.forEach(function(arm){
      ctx.save();
      ctx.rotate(armAngle(arm));

      /* centre line (Leitlinie) */
      ctx.strokeStyle = COL.paintDim; ctx.lineWidth = 4;
      ctx.setLineDash([26, 22]);
      ctx.beginPath();
      ctx.moveTo(inner + 14, 0); ctx.lineTo(CFG.FAR, 0);
      ctx.stroke();
      ctx.setLineDash([]);

      /* give-way / stop line on the approach half (local y in [-BOX,0]) */
      var sign  = Rules.signOf(sc, arm);
      var lit   = sc.lights && sc.lights.groups[arm];
      var lineX = ring ? CFG.RING + CFG.BOX + 8 : CFG.BOX + 8;
      var hasCross = L.crossings && L.crossings.indexOf(arm) >= 0;
      if (hasCross) lineX = Sim.CROSS_MID + Sim.CROSS_HALF + 12;

      if (lit || sign === 'stop'){
        ctx.fillStyle = COL.paint;
        ctx.fillRect(lineX, -CFG.BOX, 7, CFG.BOX);
      } else if (sign === 'yield' || sign === 'ringentry' || sign === 'exit'){
        /* Wartelinie: broken line */
        ctx.fillStyle = COL.paint;
        for (var y=-CFG.BOX+3; y<-2; y+=17) ctx.fillRect(lineX, y, 7, 10);
      }

      /* zebra crossing */
      if (hasCross){
        ctx.fillStyle = COL.paint;
        for (var yy=-CFG.BOX+6; yy<CFG.BOX-4; yy+=17){
          ctx.fillRect(Sim.CROSS_MID - Sim.CROSS_HALF, yy, Sim.CROSS_HALF*2, 10);
        }
      }
      ctx.restore();
    });

    /* rails */
    if (L.rails){
      ctx.save();
      ctx.strokeStyle = COL.rail; ctx.lineWidth = 3;
      var a = Geo.ARM_VEC[L.rails[0]], p = Geo.rot90cw(a);
      [-11, 11].forEach(function(off){
        ctx.beginPath();
        ctx.moveTo(a.x*CFG.FAR + p.x*off, a.y*CFG.FAR + p.y*off);
        ctx.lineTo(-a.x*CFG.FAR + p.x*off, -a.y*CFG.FAR + p.y*off);
        ctx.stroke();
      });
      ctx.restore();
    }
  }

  /* ---------- the route the player has to take ---------- */
  function drawRoute(ctx, world){
    var p = world.player, path = p.path;
    ctx.save();
    ctx.strokeStyle = COL.route;
    ctx.lineWidth = 16; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.setLineDash([22, 20]);
    ctx.beginPath();
    var started = false;
    for (var s = p.s; s <= Math.min(path.length, p.s + 900); s += 12){
      var q = path.at(s);
      if (!started){ ctx.moveTo(q.x, q.y); started = true; } else ctx.lineTo(q.x, q.y);
    }
    ctx.stroke();
    ctx.setLineDash([]);

    /* arrow at the exit */
    var e = path.at(Math.min(path.length, p.junctionS + 210));
    ctx.translate(e.x, e.y); ctx.rotate(e.h);
    ctx.fillStyle = COL.routeArrow;
    ctx.beginPath();
    ctx.moveTo(20,0); ctx.lineTo(-10,-14); ctx.lineTo(-10,14);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  /* ---------- signs at the roadside ---------- */
  function drawSigns(ctx, world, scale){
    var sc = world.junctionFor(world.player), L = sc.layout;
    L.arms.forEach(function(arm){
      var type = L.type === 'roundabout' ? 'roundabout' : Rules.signOf(sc, arm);

      /* signs stand on the right-hand kerb of the approaching driver */
      var o = Geo.ARM_VEC[arm], r = Geo.rot90cw(o);
      var base = L.type === 'roundabout' ? CFG.RING + CFG.BOX : CFG.BOX;
      var d = base + 46;
      var off = -(CFG.BOX + 34);
      var x = o.x*d + r.x*off, y = o.y*d + r.y*off;

      /* an unsigned arm simply has no post - that IS the information */
      if (type !== 'none') drawSignPost(ctx, type, x, y, 54);

      if (L.zone && arm === sc.player.from)
        drawSignPost(ctx, L.zone, x + 74*o.x, y + 74*o.y, 54);
      if (sc.gruenpfeil && sc.gruenpfeil.indexOf(arm) >= 0)
        drawSignPost(ctx, 'green_arrow', x, y - 60, 40);
      if (L.bend && arm === sc.player.from)
        drawBendPlate(ctx, x, y + 40, L.bend);
    });

    if (L.busstop){
      var o2 = Geo.ARM_VEC[L.busstop], r2 = Geo.rot90cw(o2);
      var bx = o2.x*(CFG.BOX+430) + r2.x*(-(CFG.BOX+34));
      var by = o2.y*(CFG.BOX+430) + r2.y*(-(CFG.BOX+34));
      drawSignPost(ctx, 'bus_stop', bx, by, 48);
    }
    if (L.playzone){
      var o3 = Geo.ARM_VEC[L.playzone], r3 = Geo.rot90cw(o3);
