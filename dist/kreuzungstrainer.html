      drawSignPost(ctx, 'play_street',
        o3.x*(CFG.BOX+70) + r3.x*(CFG.BOX+34),
        o3.y*(CFG.BOX+70) + r3.y*(CFG.BOX+34), 50);
    }
  }

  function drawSignPost(ctx, type, x, y, size){
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = COL.shadow;
    ctx.beginPath(); ctx.ellipse(3, 8, size*0.5, size*0.22, 0, 0, Math.PI*2); ctx.fill();
    var box = size*1.5;
    ctx.drawImage(Signs.bitmap(type, Math.round(box*2)), -box/2, -box/2, box, box);
    ctx.restore();
  }

  /* the "priority road bends" plate under sign 306 */
  function drawBendPlate(ctx, x, y, bend){
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = '#fff';
    ctx.fillRect(-24, -15, 48, 30);
    ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.strokeRect(-24, -15, 48, 30);
    /* thick line = course of the priority road, thin = the side roads */
    ctx.strokeStyle = '#111'; ctx.lineWidth = 5; ctx.lineCap = 'butt';
    var a = Geo.ARM_VEC[bend[0]], b = Geo.ARM_VEC[bend[1]];
    ctx.beginPath();
    ctx.moveTo(a.x*16, a.y*16); ctx.lineTo(0,0); ctx.lineTo(b.x*16, b.y*16);
    ctx.stroke();
    ctx.lineWidth = 2;
    var c = Geo.ARM_VEC[Geo.opposite(bend[0])], d = Geo.ARM_VEC[Geo.opposite(bend[1])];
    ctx.beginPath();
    ctx.moveTo(0,0); ctx.lineTo(c.x*15, c.y*15);
    ctx.moveTo(0,0); ctx.lineTo(d.x*15, d.y*15);
    ctx.stroke();
    ctx.restore();
  }

  /* ---------- traffic lights ---------- */
  function drawLights(ctx, world){
    var sc = world.junctionFor(world.player);
    if (!sc.lights) return;
    sc.layout.arms.forEach(function(arm){
      var st = Rules.lightFor(sc, arm, world.t);
      if (!st) return;
      var o = Geo.ARM_VEC[arm], r = Geo.rot90cw(o);
      var x = o.x*(CFG.BOX+30) + r.x*(-(CFG.BOX+30));
      var y = o.y*(CFG.BOX+30) + r.y*(-(CFG.BOX+30));
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = '#15181c';
      ctx.beginPath();
      ctx.moveTo(-11,-30); ctx.lineTo(11,-30); ctx.lineTo(11,30); ctx.lineTo(-11,30);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#2a2f36'; ctx.lineWidth = 2; ctx.stroke();
      var on = { red:'#ff3b30', yellow:'#ffcc00', green:'#2ecc5b' };
      [['red',-19],['yellow',0],['green',19]].forEach(function(l){
        var lit = (st === l[0]) || (st === 'redyellow' && (l[0]==='red'||l[0]==='yellow'));
        ctx.beginPath(); ctx.arc(0, l[1], 7.5, 0, Math.PI*2);
        ctx.fillStyle = lit ? on[l[0]] : '#23272d';
        ctx.fill();
        if (lit){
          ctx.shadowColor = on[l[0]]; ctx.shadowBlur = 16;
          ctx.fill(); ctx.shadowBlur = 0;
        }
      });
      ctx.restore();
    });
  }

  /* ---------- pedestrians ---------- */
  function drawPeds(ctx, world){
    world.peds.forEach(function(ped){
      if (ped.state === 'done') return;
      var p = ped.point();
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.fillStyle = COL.shadow;
      ctx.beginPath(); ctx.ellipse(2,3,10,7,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = ped.kid ? '#ffd166' : '#f2e8d5';
      ctx.beginPath(); ctx.ellipse(0,0, ped.kid?7:9, ped.kid?5:6, 0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = ped.kid ? '#e0863a' : '#5b6b8a';
      ctx.beginPath(); ctx.arc(0,0, ped.kid?4.5:5.5, 0, Math.PI*2); ctx.fill();
      if (ped.state === 'waiting'){
        ctx.strokeStyle = 'rgba(255,220,120,0.85)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0,0,15,0,Math.PI*2); ctx.stroke();
      }
      ctx.restore();
    });
  }

  /* ---------- vehicles ---------- */
  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawVehicle(ctx, v, t){
    var L = v.len, W = v.wid;
    ctx.save();
    ctx.translate(v.pos.x, v.pos.y);
    ctx.rotate(v.pos.h);

    ctx.fillStyle = COL.shadow;
    roundRect(ctx, -L/2+3, -W/2+4, L, W, 7); ctx.fill();

    if (v.kind === 'tram'){
      ctx.fillStyle = v.color || '#d8dde3';
      roundRect(ctx, -L/2, -W/2, L, W, 8); ctx.fill();
      ctx.fillStyle = '#c8322a';
      ctx.fillRect(-L/2, -W/2, L, 5);
      ctx.fillStyle = '#2c3540';
      for (var i=0;i<5;i++) ctx.fillRect(-L/2+14+i*(L-30)/5, -W/2+6, (L-30)/5-8, W-12);
    } else {
      ctx.fillStyle = v.color;
      roundRect(ctx, -L/2, -W/2, L, W, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 2; ctx.stroke();
      /* windows */
      ctx.fillStyle = 'rgba(20,28,38,0.72)';
      roundRect(ctx, L*0.06, -W/2+4, L*0.24, W-8, 3); ctx.fill();
      roundRect(ctx, -L*0.30, -W/2+4, L*0.26, W-8, 3); ctx.fill();
      if (v.kind === 'bus'){
        ctx.fillStyle = 'rgba(20,28,38,0.6)';
        ctx.fillRect(-L*0.05, -W/2+4, L*0.08, W-8);
      }
    }
    /* head / tail lights */
    ctx.fillStyle = v.brakeLight ? '#ff5a4a' : '#8a3b34';
    ctx.fillRect(-L/2-1, -W/2+3, 4, 6);
    ctx.fillRect(-L/2-1,  W/2-9, 4, 6);
    ctx.fillStyle = '#ffeec2';
    ctx.fillRect(L/2-3, -W/2+3, 4, 6);
    ctx.fillRect(L/2-3,  W/2-9, 4, 6);

    /* indicators */
    var blink = (t*2.2) % 1 < 0.55;
    if (v.indicator === 'left' && blink){
      ctx.fillStyle = '#ffb02e';
      ctx.fillRect(L/2-6, -W/2-2, 7, 6);
      ctx.fillRect(-L/2-1, -W/2-2, 7, 6);
    }
    if (v.indicator === 'right' && blink){
      ctx.fillStyle = '#ffb02e';
      ctx.fillRect(L/2-6, W/2-4, 7, 6);
      ctx.fillRect(-L/2-1, W/2-4, 7, 6);
    }
    /* blue lights */
    if (v.emergency){
      var f = (t*7) % 1 < 0.5;
      ctx.fillStyle = f ? '#4da3ff' : '#1a3f6b';
      ctx.fillRect(-6, -W/2-3, 12, 5);
      ctx.fillStyle = f ? '#1a3f6b' : '#4da3ff';
      ctx.fillRect(-6, W/2-2, 12, 5);
    }
    ctx.restore();
  }

  /* ---------- main entry ---------- */
  function frame(ctx, w, h, world, preview){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,w,h);
    var scale = camera(ctx, w, h, world, preview);
    drawGround(ctx, world);
    drawMarkings(ctx, world);
    drawRoute(ctx, world);
    drawSigns(ctx, world, scale);
    drawPeds(ctx, world);
    world.vehicles.forEach(function(v){ if (!v.done) drawVehicle(ctx, v, world.t); });
    drawLights(ctx, world);

    if (world.crashPoint){
      var c = world.crashPoint, r = 26 + Math.sin(world.endTimer*9)*6;
      ctx.strokeStyle = COL.bad; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, Math.PI*2); ctx.stroke();
    }
    ctx.setTransform(1,0,0,1,0,0);
  }

  return { frame:frame, COL:COL, syncTheme:syncTheme };
})();

/* ---------- js/pov.js ---------- */
'use strict';
/* ------------------------------------------------------------------
   pov.js - the view from the driver's seat.

   A pinhole camera sitting where the driver's eyes are, projecting the
   same world the top-down view draws. Ground geometry is painted first
   (road, markings, crossings), then everything that stands up off the
   road is depth-sorted and drawn far to near.

   Camera space is (f, r, z): f forward, r to the right, z world height.
   ------------------------------------------------------------------ */

var POV = (function(){

  var M = CFG.PPM;                 // world units per metre
  var EYE_H   = 1.20 * M;          // eye height above the road
  var NEAR    = 0.75 * M;          // near clip plane
  var FAR_CUT = 130  * M;          // draw distance
  var FOV     = 78 * Math.PI/180;  // horizontal field of view

  var COL = {
    sky1:'#1b2740', sky2:'#3d4a63', haze:'#3d4a63',
    grass:'#23291f', road:'#2f2e2b', kerb:'#4c4941',
    paint:'#e9e5d9', paintDim:'#a8a499', island:'#2b3624',
    glass:'#161b21', interior:'#191713', dash:'#221f1a',
    route:'rgba(107,178,245,0.45)'
  };
  var VARS = {
    grass:'--grass', road:'--road', kerb:'--kerb', paint:'--paint',
    paintDim:'--paint-dim', island:'--island',
    sky1:'--sky-1', sky2:'--sky-2', haze:'--sky-2',
    interior:'--cabin', dash:'--cabin-dark'
  };
  function syncTheme(){
    if (typeof document === 'undefined' || typeof getComputedStyle !== 'function') return;
    var cs = getComputedStyle(document.documentElement);
    for (var k in VARS){
      var v = cs.getPropertyValue(VARS[k]);
      if (v && v.trim()) COL[k] = v.trim();
    }
    var info = (cs.getPropertyValue('--info') || '').trim();
    if (/^#[0-9a-f]{6}$/i.test(info)){
      var n = parseInt(info.slice(1), 16);
      COL.route = 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+',0.45)';
    }
  }

  /* ---------- colour helpers ---------- */
  function shade(hex, k){
    var h = (hex || '#888').replace('#','');
    if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var n = parseInt(h, 16);
    if (isNaN(n)) return hex;
    var r = Math.min(255, Math.round(((n>>16)&255)*k));
    var g = Math.min(255, Math.round(((n>>8)&255)*k));
    var b = Math.min(255, Math.round((n&255)*k));
    return 'rgb('+r+','+g+','+b+')';
  }

  /* ---------- camera ---------- */
  function makeCam(world, yaw, w, h){
    var p = world.player;
    var c = Math.cos(p.pos.h), s = Math.sin(p.pos.h);
    /* the driver sits ahead of the car's centre and to the left */
    var ex = p.pos.x + c*(p.len*0.10) + (-s)*(-p.wid*0.20);
    var ey = p.pos.y + s*(p.len*0.10) + ( c)*(-p.wid*0.20);
    var hh = p.pos.h + yaw;
    return {
      ex:ex, ey:ey,
      fx:Math.cos(hh), fy:Math.sin(hh),
      rx:-Math.sin(hh), ry:Math.cos(hh),
      F:(w/2)/Math.tan(FOV/2),
      cx:w/2, hy:h*0.47, eh:EYE_H, near:NEAR, w:w, h:h
    };
  }
  function toCam(cam, x, y, z){
    var dx = x - cam.ex, dy = y - cam.ey;
    return { f: dx*cam.fx + dy*cam.fy, r: dx*cam.rx + dy*cam.ry, z: z || 0 };
  }
  function proj(cam, p){
    var f = p.f < cam.near ? cam.near : p.f;
    var x = cam.cx + cam.F*p.r/f;
    var y = cam.hy + cam.F*(cam.eh - p.z)/f;
    /* keep the numbers sane for the rasteriser on extreme angles */
    if (x < -30000) x = -30000; else if (x > 30000) x = 30000;
    if (y < -30000) y = -30000; else if (y > 30000) y = 30000;
    return { x:x, y:y };
  }
  /* clip a polygon against the near plane (Sutherland-Hodgman, one plane) */
  function clipNear(pts, near){
    var out = [], n = pts.length, i;
    for (i = 0; i < n; i++){
      var a = pts[i], b = pts[(i+1) % n];
      var ain = a.f >= near, bin = b.f >= near;
      if (ain) out.push(a);
      if (ain !== bin){
        var t = (near - a.f) / (b.f - a.f);
        out.push({ f:near, r:a.r + (b.r-a.r)*t, z:a.z + (b.z-a.z)*t });
      }
    }
    return out;
  }
  /* pts: array of [x, y, z] in world space */
  function fillPoly(ctx, cam, pts, color){
    var cs = [], i;
    for (i = 0; i < pts.length; i++) cs.push(toCam(cam, pts[i][0], pts[i][1], pts[i][2]));
    cs = clipNear(cs, cam.near);
    if (cs.length < 3) return;
    ctx.fillStyle = color;
    ctx.beginPath();
    for (i = 0; i < cs.length; i++){
      var s = proj(cam, cs[i]);
      if (i) ctx.lineTo(s.x, s.y); else ctx.moveTo(s.x, s.y);
    }
    ctx.closePath();
    ctx.fill();
  }

  /* a flat quad on the road, given in arm-local coordinates
     (d = distance out along the arm, lat = across it)             */
  function armQuad(ctx, cam, arm, d1, lat1, d2, lat2, color, ox, oy){
    ox = ox || 0; oy = oy || 0;
    var o = Geo.ARM_VEC[arm], q = Geo.rot90cw(o);
    function P(d, lat){ return [o.x*d + q.x*lat + ox, o.y*d + q.y*lat + oy, 0]; }
    fillPoly(ctx, cam, [P(d1,lat1), P(d2,lat1), P(d2,lat2), P(d1,lat2)], color);
  }

  /* ---------- billboards ---------- */
  function billboard(cam, x, y, zBottom, zTop){
    var c = toCam(cam, x, y, 0);
    if (c.f < cam.near || c.f > FAR_CUT) return null;
    var top = proj(cam, { f:c.f, r:c.r, z:zTop });
    var bot = proj(cam, { f:c.f, r:c.r, z:zBottom });
    return { x:top.x, top:top.y, h:bot.y - top.y, depth:c.f };
  }
  function drawBillboard(ctx, bb, img, worldW, worldH){
    if (!bb || bb.h <= 0.4) return;
    var w = bb.h * (worldW / worldH);
    ctx.drawImage(img, bb.x - w/2, bb.top, w, bb.h);
  }

  /* ---------- cached sprites ---------- */
  var sprites = {};
  function sprite(key, wpx, hpx, paint){
    if (sprites[key]) return sprites[key];
    var c = document.createElement('canvas');
    c.width = wpx; c.height = hpx;
    paint(c.getContext('2d'), wpx, hpx);
    sprites[key] = c;
    return c;
  }
  function pedSprite(kid){
    return sprite('ped' + (kid?'k':'a'), 48, 96, function(g, w, h){
      var skin = kid ? '#f0c9a0' : '#e8c9a8';
      var coat = kid ? '#e0863a' : '#4a5c7a';
      g.fillStyle = coat;
      g.beginPath();
      g.moveTo(w*0.28, h*0.30); g.lineTo(w*0.72, h*0.30);
      g.lineTo(w*0.68, h*0.66); g.lineTo(w*0.32, h*0.66);
      g.closePath(); g.fill();
      g.fillRect(w*0.34, h*0.62, w*0.13, h*0.36);   // legs
      g.fillRect(w*0.53, h*0.62, w*0.13, h*0.36);
      g.fillStyle = shade(coat, 0.75);
      g.fillRect(w*0.20, h*0.32, w*0.10, h*0.30);   // arms
      g.fillRect(w*0.70, h*0.32, w*0.10, h*0.30);
      g.fillStyle = skin;
      g.beginPath(); g.arc(w*0.5, h*0.19, w*0.16, 0, Math.PI*2); g.fill();
      g.fillStyle = '#2b2620';
      g.beginPath(); g.arc(w*0.5, h*0.13, w*0.16, Math.PI, Math.PI*2); g.fill();
    });
  }
  function lightSprite(state){
    return sprite('tl' + state, 44, 132, function(g, w, h){
      g.fillStyle = '#15181c';
      g.fillRect(w*0.10, 0, w*0.80, h);
      g.strokeStyle = '#2c3239'; g.lineWidth = 2;
      g.strokeRect(w*0.10, 0, w*0.80, h);
      var on = { red:'#ff3b30', yellow:'#ffcc00', green:'#2ecc5b' };
      [['red', h*0.19], ['yellow', h*0.50], ['green', h*0.81]].forEach(function(l){
        var lit = (state === l[0]) || (state === 'redyellow' && l[0] !== 'green');
        g.beginPath(); g.arc(w*0.5, l[1], w*0.26, 0, Math.PI*2);
        g.fillStyle = lit ? on[l[0]] : '#23272d';
        g.fill();
        if (lit){ g.shadowColor = on[l[0]]; g.shadowBlur = 14; g.fill(); g.shadowBlur = 0; }
      });
    });
  }

  /* ---------- ground ---------- */
  function drawWorldGround(ctx, cam, world){
    /* Everything here is built as if the current junction sat at the
       world origin - true for a lesson, not for the open world, where
       junctions sit at their own real map coordinates. ox/oy carries
       that real position through, and is zero for a lesson (its
       junction has no x/y), so nothing changes there. */
    var sc = world.junctionFor(world.player), L = sc.layout;
    var ox = sc.x || 0, oy = sc.y || 0;
    var ring = L.type === 'roundabout';
    var inner = ring ? CFG.RING + CFG.BOX : 0;
    var i;

    /* carriageways + kerbs */
    L.arms.forEach(function(arm){
      var from = inner ? inner - 6 : -CFG.BOX;
      armQuad(ctx, cam, arm, from, -CFG.BOX-7, FAR_CUT, CFG.BOX+7, COL.kerb, ox, oy);
      armQuad(ctx, cam, arm, from, -CFG.BOX,   FAR_CUT, CFG.BOX,   COL.road, ox, oy);
    });

    if (ring){
      var N = 40, R0 = CFG.RING - CFG.BOX, R1 = CFG.RING + CFG.BOX;
      for (i = 0; i < N; i++){
        var a0 = i/N*Math.PI*2, a1 = (i+1)/N*Math.PI*2;
        fillPoly(ctx, cam, [
          [Math.cos(a0)*(R1+7)+ox, Math.sin(a0)*(R1+7)+oy, 0],
          [Math.cos(a1)*(R1+7)+ox, Math.sin(a1)*(R1+7)+oy, 0],
          [Math.cos(a1)*R0+ox, Math.sin(a1)*R0+oy, 0],
          [Math.cos(a0)*R0+ox, Math.sin(a0)*R0+oy, 0]], COL.kerb);
        fillPoly(ctx, cam, [
          [Math.cos(a0)*R1+ox, Math.sin(a0)*R1+oy, 0],
          [Math.cos(a1)*R1+ox, Math.sin(a1)*R1+oy, 0],
          [Math.cos(a1)*R0+ox, Math.sin(a1)*R0+oy, 0],
          [Math.cos(a0)*R0+ox, Math.sin(a0)*R0+oy, 0]], COL.road);
      }
      var island = [];
      for (i = 0; i < N; i++)
        island.push([Math.cos(i/N*Math.PI*2)*R0+ox, Math.sin(i/N*Math.PI*2)*R0+oy, 0]);
      fillPoly(ctx, cam, island, COL.island);
    } else {
      fillPoly(ctx, cam, [
        [-CFG.BOX+ox,-CFG.BOX+oy,0], [CFG.BOX+ox,-CFG.BOX+oy,0],
        [ CFG.BOX+ox, CFG.BOX+oy,0], [-CFG.BOX+ox, CFG.BOX+oy,0]], COL.road);
    }

    /* markings */
    L.arms.forEach(function(arm){
      var start = (ring ? CFG.RING + CFG.BOX : CFG.BOX) + 14;
      for (var d = start; d < FAR_CUT; d += 48)
        armQuad(ctx, cam, arm, d, -2, d + 26, 2, COL.paintDim, ox, oy);

      var sign = Rules.signOf(sc, arm);
      var lit  = sc.lights && sc.lights.groups[arm];
      var lineX = ring ? CFG.RING + CFG.BOX + 8 : CFG.BOX + 8;
      var hasCross = L.crossings && L.crossings.indexOf(arm) >= 0;
      if (hasCross) lineX = Sim.CROSS_MID + Sim.CROSS_HALF + 12;

      if (lit || sign === 'stop'){
        armQuad(ctx, cam, arm, lineX, -CFG.BOX, lineX + 7, 0, COL.paint, ox, oy);
      } else if (sign === 'yield' || sign === 'ringentry' || sign === 'exit'){
        for (var y = -CFG.BOX + 3; y < -2; y += 17)
          armQuad(ctx, cam, arm, lineX, y, lineX + 7, y + 10, COL.paint, ox, oy);
      }
      if (hasCross){
        for (var yy = -CFG.BOX + 6; yy < CFG.BOX - 4; yy += 17)
          armQuad(ctx, cam, arm, Sim.CROSS_MID - Sim.CROSS_HALF, yy,
                                 Sim.CROSS_MID + Sim.CROSS_HALF, yy + 10, COL.paint, ox, oy);
      }
    });

    /* the route we are supposed to take, as chevrons on the road */
    var p = world.player;
    for (var s = p.s + 70; s < Math.min(p.path.length, p.s + 620); s += 62){
      var q = p.path.at(s);
      var c = Math.cos(q.h), sn = Math.sin(q.h);
      function P(fwd, lat){ return [q.x + c*fwd - sn*lat, q.y + sn*fwd + c*lat, 0.4]; }
      fillPoly(ctx, cam, [P(16,0), P(-8,-13), P(-2,0), P(-8,13)], COL.route);
    }
  }

  /* ---------- vehicles as boxes ---------- */
  function boxFaces(v, z0, z1, shrink){
    var c = Math.cos(v.pos.h), s = Math.sin(v.pos.h);
    var hl = v.len/2 * (shrink || 1), hw = v.wid/2 * (shrink ? 0.94 : 1);
    function P(fwd, lat, z){
      return [v.pos.x + c*fwd - s*lat, v.pos.y + s*fwd + c*lat, z];
    }
    return [
      { pts:[P(hl,-hw,z0), P(hl,hw,z0), P(hl,hw,z1), P(hl,-hw,z1)],      n:[ c, s, 0], k:0.94 },
      { pts:[P(-hl,hw,z0), P(-hl,-hw,z0), P(-hl,-hw,z1), P(-hl,hw,z1)],  n:[-c,-s, 0], k:0.74 },
      { pts:[P(-hl,-hw,z0), P(hl,-hw,z0), P(hl,-hw,z1), P(-hl,-hw,z1)],  n:[ s,-c, 0], k:0.64 },
      { pts:[P(hl,hw,z0), P(-hl,hw,z0), P(-hl,hw,z1), P(hl,hw,z1)],      n:[-s, c, 0], k:0.80 },
      { pts:[P(hl,-hw,z1), P(hl,hw,z1), P(-hl,hw,z1), P(-hl,-hw,z1)],    n:[ 0, 0, 1], k:1.10 }
    ];
  }
  function drawBox(ctx, cam, v, z0, z1, color, shrink){
    boxFaces(v, z0, z1, shrink).forEach(function(face){
      /* is this face turned towards the camera? */
      var mid = face.pts[0], i;
      var cx = 0, cy = 0, cz = 0;
      for (i = 0; i < face.pts.length; i++){
        cx += face.pts[i][0]; cy += face.pts[i][1]; cz += face.pts[i][2];
      }
      cx /= 4; cy /= 4; cz /= 4;
      var fc = toCam(cam, cx, cy, cz);
      var nf = face.n[0]*cam.fx + face.n[1]*cam.fy;
      var nr = face.n[0]*cam.rx + face.n[1]*cam.ry;
      var nz = face.n[2];
      if (nf*fc.f + nr*fc.r + nz*(fc.z - cam.eh) >= 0) return;   // back-facing
      fillPoly(ctx, cam, face.pts, shade(color, face.k));
    });
  }
  function vehicleHeights(v){
    if (v.kind === 'tram') return { body:[0.35*M, 3.30*M], cab:null };
    if (v.kind === 'bus')  return { body:[0.32*M, 2.85*M], cab:null };
    return { body:[0.22*M, 1.05*M], cab:[1.05*M, 1.48*M] };
  }
  function drawVehicle(ctx, cam, v, t){
    var H = vehicleHeights(v);
    drawBox(ctx, cam, v, H.body[0], H.body[1], v.color);
    if (H.cab) drawBox(ctx, cam, v, H.cab[0], H.cab[1], COL.glass, 0.62);
    if (v.kind === 'tram' || v.kind === 'bus'){
      /* a window band rather than a separate cabin box */
      drawBox(ctx, cam, v, H.body[1]*0.52, H.body[1]*0.82, COL.glass, 0.97);
    }

    /* lamps: only visible from the side that has them */
    var c = Math.cos(v.pos.h), s = Math.sin(v.pos.h);
    var toCamX = cam.ex - v.pos.x, toCamY = cam.ey - v.pos.y;
    var behind = (toCamX*c + toCamY*s) < 0;
    var lampZ = H.body[1]*0.62, hl = v.len/2, hw = v.wid/2;
    function lamp(fwd, lat, col, size){
      var x = v.pos.x + c*fwd - s*lat, y = v.pos.y + s*fwd + c*lat;
      var bb = billboard(cam, x, y, lampZ - size/2, lampZ + size/2);
      if (!bb || bb.h < 0.6) return;
      ctx.fillStyle = col;
      ctx.fillRect(bb.x - bb.h*0.7, bb.top, bb.h*1.4, bb.h);
    }
    var blink = (t*2.2) % 1 < 0.55;
    if (behind){
      var tail = v.brakeLight ? '#ff4436' : '#8f2f28';
      lamp(-hl, -hw*0.72, tail, 3.2);
      lamp(-hl,  hw*0.72, tail, 3.2);
      if (blink && v.indicator === 'left')  lamp(-hl, -hw*0.95, '#ffb02e', 3.4);
      if (blink && v.indicator === 'right') lamp(-hl,  hw*0.95, '#ffb02e', 3.4);
    } else {
      lamp(hl, -hw*0.72, '#fff3d0', 3.2);
      lamp(hl,  hw*0.72, '#fff3d0', 3.2);
      if (blink && v.indicator === 'left')  lamp(hl, -hw*0.95, '#ffb02e', 3.4);
      if (blink && v.indicator === 'right') lamp(hl,  hw*0.95, '#ffb02e', 3.4);
    }
    if (v.emergency){
      var f = (t*7) % 1 < 0.5;
      lamp(0, -hw*0.5, f ? '#5ab4ff' : '#1d4470', 4);
      lamp(0,  hw*0.5, f ? '#1d4470' : '#5ab4ff', 4);
    }
  }

  /* ---------- standing objects, depth sorted ---------- */
  function collectObjects(world, cam){
    var sc = world.junctionFor(world.player), L = sc.layout, out = [];
    var ox = sc.x || 0, oy = sc.y || 0;

    world.vehicles.forEach(function(v){
      if (v.done || v.isPlayer) return;
      var c = toCam(cam, v.pos.x, v.pos.y, 0);
      if (c.f < cam.near - v.len || c.f > FAR_CUT) return;
      out.push({ depth:c.f, kind:'veh', v:v });
    });

    world.peds.forEach(function(ped){
      if (ped.state === 'done') return;
      var pt = ped.point();
      var c = toCam(cam, pt.x, pt.y, 0);
      if (c.f < cam.near || c.f > FAR_CUT) return;
      out.push({ depth:c.f, kind:'ped', ped:ped, pt:pt });
    });

    /* road signs, on their posts */
    L.arms.forEach(function(arm){
      var type = L.type === 'roundabout' ? 'roundabout' : Rules.signOf(sc, arm);
      var o = Geo.ARM_VEC[arm], q = Geo.rot90cw(o);
      var base = L.type === 'roundabout' ? CFG.RING + CFG.BOX : CFG.BOX;
      var d = base + 46, lat = -(CFG.BOX + 26);
      var x = o.x*d + q.x*lat + ox, y = o.y*d + q.y*lat + oy;

      if (type !== 'none') push(type, x, y, 0);
      if (L.zone && arm === sc.player.from) push(L.zone, x + o.x*74, y + o.y*74, 0);
      if (sc.gruenpfeil && sc.gruenpfeil.indexOf(arm) >= 0) push('green_arrow', x, y, -0.55*M);

      function push(t, sx, sy, dz){
        var c = toCam(cam, sx, sy, 0);
        if (c.f < cam.near || c.f > FAR_CUT) return;
        out.push({ depth:c.f, kind:'sign', type:t, x:sx, y:sy, dz:dz||0 });
      }
    });
    if (L.busstop){
      var ob = Geo.ARM_VEC[L.busstop], qb = Geo.rot90cw(ob);
      var bx = ob.x*(CFG.BOX+430) + qb.x*(-(CFG.BOX+26)) + ox;
      var by = ob.y*(CFG.BOX+430) + qb.y*(-(CFG.BOX+26)) + oy;
      var cb = toCam(cam, bx, by, 0);
      if (cb.f >= cam.near && cb.f <= FAR_CUT)
        out.push({ depth:cb.f, kind:'sign', type:'bus_stop', x:bx, y:by, dz:0 });
    }

    /* traffic lights: one before the junction, one on the far side */
    if (sc.lights){
      L.arms.forEach(function(arm){
        var st = Rules.lightFor(sc, arm, world.t);
        if (!st) return;
        var o = Geo.ARM_VEC[arm], q = Geo.rot90cw(o);
        [[CFG.BOX + 26, -(CFG.BOX + 24)], [-(CFG.BOX + 30), -(CFG.BOX + 24)]].forEach(function(pos){
          var x = o.x*pos[0] + q.x*pos[1] + ox, y = o.y*pos[0] + q.y*pos[1] + oy;
          var c = toCam(cam, x, y, 0);
          if (c.f < cam.near || c.f > FAR_CUT) return;
          out.push({ depth:c.f, kind:'light', state:st, x:x, y:y });
        });
      });
    }

    out.sort(function(a, b){ return b.depth - a.depth; });
    return out;
  }

  /* ---------- the cabin you are sitting in ---------- */
  function drawInterior(ctx, w, h, world, yaw){
    var col = world.player.color;
    var shift = -yaw * w * 0.42;          // the cabin swings as you look round
    var hood = h * 0.845;

    ctx.save();
    ctx.translate(shift, 0);

    /* headlining */
    ctx.fillStyle = COL.dash;
    ctx.fillRect(-w, -1, w*3, h*0.055);

    /* A-pillars: raked back, and no wider than they need to be */
    ctx.fillStyle = COL.interior;
    ctx.beginPath();
    ctx.moveTo(-w*0.03, 0); ctx.lineTo(w*0.085, 0);
    ctx.lineTo(w*0.012, hood); ctx.lineTo(-w*0.03, hood);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(w*1.03, 0); ctx.lineTo(w*0.915, 0);
    ctx.lineTo(w*0.988, hood); ctx.lineTo(w*1.03, hood);
    ctx.closePath(); ctx.fill();

    /* mirror */
    ctx.fillStyle = COL.dash;
    ctx.beginPath();
    ctx.moveTo(w*0.44, 0); ctx.lineTo(w*0.56, 0);
    ctx.lineTo(w*0.555, h*0.085); ctx.lineTo(w*0.445, h*0.085);
    ctx.closePath(); ctx.fill();

    /* bonnet */
    var g = ctx.createLinearGradient(0, hood, 0, h);
    g.addColorStop(0, shade(col, 0.72));
    g.addColorStop(1, shade(col, 0.42));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-w*0.05, h + 2);
    ctx.lineTo(w*0.10, hood);
    ctx.quadraticCurveTo(w*0.5, hood - h*0.035, w*0.90, hood);
    ctx.lineTo(w*1.05, h + 2);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = shade(col, 1.25); ctx.lineWidth = 1.5;
    ctx.stroke();

    /* dashboard lip + steering wheel rim */
    ctx.fillStyle = COL.dash;
    ctx.beginPath();
    ctx.ellipse(w*0.30, h*1.16, w*0.20, h*0.235, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    /* a soft vignette so the eye goes to the road */
    var v = ctx.createRadialGradient(w/2, h*0.42, h*0.28, w/2, h*0.42, h*0.95);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(0,0,0,0.26)');
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, w, h);
  }

  /* ---------- main entry ---------- */
  function frame(ctx, w, h, world, yaw){
    var cam = makeCam(world, yaw || 0, w, h);
    var horizon = cam.hy;

    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0, 0, w, h);

    /* sky */
    var sky = ctx.createLinearGradient(0, 0, 0, Math.max(1, horizon));
    sky.addColorStop(0, COL.sky1);
    sky.addColorStop(1, COL.sky2);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, w, Math.max(0, horizon));

    /* ground */
    ctx.fillStyle = COL.grass;
    ctx.fillRect(0, Math.max(0, horizon), w, h - Math.max(0, horizon));

    drawWorldGround(ctx, cam, world);

    /* haze along the horizon gives the distance some depth */
    var haze = ctx.createLinearGradient(0, horizon - h*0.02, 0, horizon + h*0.10);
    haze.addColorStop(0, COL.haze);
    haze.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = haze;
    ctx.fillRect(0, horizon - h*0.02, w, h*0.12);
    ctx.globalAlpha = 1;

    collectObjects(world, cam).forEach(function(ob){
      if (ob.kind === 'veh'){
        drawVehicle(ctx, cam, ob.v, world.t);
      } else if (ob.kind === 'ped'){
        var bb = billboard(cam, ob.pt.x, ob.pt.y, 0, (ob.ped.kid ? 1.25 : 1.74)*M);
        drawBillboard(ctx, bb, pedSprite(ob.ped.kid), 0.55, 1.74);
      } else if (ob.kind === 'sign'){
        var post = billboard(cam, ob.x, ob.y, 0, 1.72*M + ob.dz);
        if (post && post.h > 1){
          ctx.fillStyle = '#8b8b86';
          ctx.fillRect(post.x - post.h*0.018, post.top, Math.max(1, post.h*0.036), post.h);
        }
        var face = billboard(cam, ob.x, ob.y, 1.72*M + ob.dz, 2.62*M + ob.dz);
        drawBillboard(ctx, face, Signs.bitmap(ob.type, 96), 1, 1);
      } else if (ob.kind === 'light'){
        var lb = billboard(cam, ob.x, ob.y, 2.05*M, 3.10*M);
        drawBillboard(ctx, lb, lightSprite(ob.state), 0.35, 1.05);
        if (lb && lb.h > 2){
          ctx.fillStyle = '#4b4f55';
          var mast = billboard(cam, ob.x, ob.y, 0, 2.05*M);
          if (mast) ctx.fillRect(mast.x - lb.h*0.02, mast.top, Math.max(1, lb.h*0.04), mast.h);
        }
      }
    });

    drawInterior(ctx, w, h, world, yaw || 0);
    ctx.setTransform(1,0,0,1,0,0);
  }

  return { frame:frame, syncTheme:syncTheme, EYE_H:EYE_H, COL:COL };
})();

/* ---------- js/main.js ---------- */
'use strict';
/* ------------------------------------------------------------------
   main.js - screens, input, HUD, scoring, progress, theme, language.
   ------------------------------------------------------------------ */

(function(){

  var canvas = document.getElementById('game');
  var ctx    = canvas.getContext('2d');
  var mini   = document.getElementById('minimap');
  var mctx   = mini.getContext('2d');
  var W = 0, H = 0;

  var MAX_YAW = 1.25;                 // how far you can turn your head

  var state = {
    screen:'menu', world:null, scIndex:0, mode:'lesson',
    hints:true, view:'pov',
    yaw:0, yawTarget:0, drag:null,
    last:0
  };

  var DRIVE_BRIEF = {
    task: { de:'Fahr ganz normal. Der Prüfer schweigt, bis du einen Fehler machst, und ' +
                'hält dann an, um ihn zu erklären – dieselben Regeln wie in jeder Lektion, ' +
                'jetzt aber alle gemischt.',
            en:'Drive normally. The examiner sits quietly until you get something wrong, ' +
               'then stops the car to explain it – the same rules as every lesson, now all ' +
               'mixed together.' },
    merk: { de:'Hier gibt es kein Drehbuch – lies jede Kreuzung, so wie sie kommt.',
            en:'There is no script here – read every junction as it comes.' }
  };
  var input = { throttle:false, brake:false, indicator:'off' };
  var look  = { left:false, right:false };

  function el(id){ return document.getElementById(id); }
  function show(id, on){ el(id).classList.toggle('hidden', !on); }
  function clear(n){ while (n.firstChild) n.removeChild(n.firstChild); }
  function make(tag, cls, text){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  /* a main line in the chosen language plus the other language beneath */
  function bilingual(parent, pair, mainCls, subCls){
    var main = I18N.pick(pair), sub = I18N.other(pair);
    if (main) parent.appendChild(make('div', mainCls, main));
    if (sub && sub !== main) parent.appendChild(make('div', subCls, sub));
  }

  /* ---------------- storage ---------------- */
  function load(key, fb){
    try { var v = localStorage.getItem(key); return v === null ? fb : JSON.parse(v); }
    catch(e){ return fb; }
  }
  function save(key, val){ try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){} }
  var STORE = 'fahrschule.progress.v1';
  var THEME = 'fahrschule.theme.v1';
  var LANG  = 'fahrschule.lang.v1';
  var VIEW  = 'fahrschule.view.v1';
  var progress = load(STORE, {}) || {};

  /* ---------------- theme ---------------- */
  function systemDark(){
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function isDark(){
    var a = document.documentElement.getAttribute('data-theme');
    return a ? a === 'dark' : systemDark();
  }
  function applyTheme(choice){
    if (choice) document.documentElement.setAttribute('data-theme', choice);
    else document.documentElement.removeAttribute('data-theme');
    el('btn-theme').textContent = I18N.t(isDark() ? 'theme.day' : 'theme.night');
    Render.syncTheme();
    POV.syncTheme();
    if (state.world) draw();
  }

  /* ---------------- language ---------------- */
  function applyLang(){
    var l = I18N.get();
    document.documentElement.setAttribute('lang', l);
    el('btn-lang').textContent = I18N.t('lang.next');
    el('btn-theme').textContent = I18N.t(isDark() ? 'theme.day' : 'theme.night');
    el('menu-h1').innerHTML   = I18N.t('menu.h1');
    el('menu-lead').innerHTML = I18N.t('menu.lead');
    el('btn-view').textContent = I18N.t(state.view === 'pov' ? 'view.toTop' : 'view.toPov');

    var nodes = document.querySelectorAll('[data-t]');
    for (var i = 0; i < nodes.length; i++)
      nodes[i].textContent = I18N.t(nodes[i].getAttribute('data-t'));

    /* the keyboard legend in the briefing */
    var keys = el('brief-keys');
    clear(keys);
    [['W', 'keys.throttle'], ['S', 'keys.brake'], ['Q E', 'keys.look'],
     ['A D', 'keys.indicators'], ['V', 'keys.view'], ['H', 'keys.hints']]
    .forEach(function(k){
      var sp = make('span');
      k[0].split(' ').forEach(function(key){ sp.appendChild(make('kbd', null, key)); });
      sp.appendChild(document.createTextNode(' ' + I18N.t(k[1])));
      keys.appendChild(sp);
    });

    el('ref-body').innerHTML = '';
    buildMenu();
    if (state.world){
      if (state.mode === 'drive') fillDriveBrief();
      else fillLesson(state.world.sc);
    }
    if (state.screen === 'result') refreshResultLabels();
    if (state.world && state.world.pending && !el('overlay-fault').classList.contains('hidden'))
      showFaultOverlay(state.world.pending);
  }

  /* ---------------- canvas sizing ---------------- */
  function resize(){
    var wrap = el('canvas-wrap');
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = wrap.clientWidth; H = wrap.clientHeight;
    if (!W || !H) return;
    canvas.width  = Math.round(W*dpr);
    canvas.height = Math.round(H*dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (state.world) draw();
  }

  /* ---------------- menu ---------------- */
  function buildMenu(){
    var grid = el('level-grid');
    clear(grid);
    var groups = {}, order = [];
    SCENARIOS.forEach(function(sc, i){
      if (!groups[sc.group]){ groups[sc.group] = []; order.push(sc.group); }
      groups[sc.group].push({ sc:sc, i:i });
    });
    order.forEach(function(g){
      var sec = make('div','group');
      sec.appendChild(make('h3','group-title eyebrow', I18N.group(g)));
      var row = make('div','group-row');
      groups[g].forEach(function(item){
        var sc = item.sc, p = progress[sc.id];
        var card = make('button','card' + (p && p.passed ? ' done' : ''));
        card.type = 'button';
        card.appendChild(make('div','card-lvl', I18N.t('card.level') + ' ' + sc.level));
        card.appendChild(make('div','card-title', I18N.pick({ de:sc.title, en:sc.en })));
        card.appendChild(make('div','card-en',    I18N.other({ de:sc.title, en:sc.en })));
        var foot = make('div','card-foot');
        foot.appendChild(p
          ? make('span','badge' + (p.passed ? ' ok' : ' bad'), p.best + ' ' + I18N.t('card.points'))
          : make('span','badge new', I18N.t('card.new')));
        card.appendChild(foot);
        card.onclick = function(){ startScenario(item.i); };
        row.appendChild(card);
      });
      sec.appendChild(row);
      grid.appendChild(sec);
    });
    var done = SCENARIOS.filter(function(s){
      return progress[s.id] && progress[s.id].passed;
    }).length;
    el('progress-line').textContent = I18N.t('menu.passed', { a:done, b:SCENARIOS.length });
    el('tally-fill').style.width = Math.round(done/SCENARIOS.length*100) + '%';
  }

  /* ---------------- lesson text ---------------- */
  function signList(sc){
    var out = [], L = sc.layout;
    var mine = L.type === 'roundabout' ? 'roundabout' : Rules.signOf(sc, sc.player.from);
    out.push(mine);
    if (L.zone) out.push(L.zone);
    if (sc.gruenpfeil && sc.gruenpfeil.indexOf(sc.player.from) >= 0) out.push('green_arrow');
    if (L.crossings && L.crossings.length) out.push('crossing');
    if (L.rails) out.push('tram');
    if (L.busstop) out.push('bus_stop');
    var cross = Rules.signOf(sc, Geo.rightOf(sc.player.from));
    if (L.type !== 'roundabout' && cross !== mine && cross !== 'none') out.push(cross);
    return out.filter(function(s,i,a){ return s !== 'none' && a.indexOf(s) === i; });
  }

  function fillLesson(sc){
    var titlePair = { de:sc.title, en:sc.en };
    var taskPair  = { de:sc.task,  en:sc.taskEn };
    var merkPair  = { de:sc.merksatz, en:sc.merksatzEn };

    el('brief-group').textContent   = I18N.group(sc.group) + ' · ' + I18N.t('card.level') + ' ' + sc.level;
    el('brief-title').textContent   = I18N.pick(titlePair);
    el('brief-en').textContent      = I18N.other(titlePair);
    el('brief-task').textContent    = I18N.pick(taskPair);
    el('brief-task-en').textContent = I18N.other(taskPair);
    el('brief-merk').textContent    = I18N.pick(merkPair);
    el('brief-merk-sub').textContent = I18N.other(merkPair);

    var box = el('brief-signs');
    clear(box);
    signList(sc).forEach(function(t){
      var item = make('div','signitem');
      item.appendChild(Signs.chip(t, 52));
      var lab = Signs.LABEL[t] || [t, ''];
      var txt = make('div','signtxt');
      txt.appendChild(make('div','sl-de', I18N.pick(lab)));
      txt.appendChild(make('div','sl-en', I18N.other(lab)));
      item.appendChild(txt);
      box.appendChild(item);
    });

    el('side-title').textContent = I18N.pick(titlePair);
    el('side-task').textContent  = I18N.pick(taskPair);
    el('hud-task').textContent   = I18N.pick(taskPair);
    var sb = el('side-signs');
    clear(sb);
    signList(sc).forEach(function(t){ sb.appendChild(Signs.chip(t, 40)); });
  }

  function startScenario(i){
    state.mode = 'lesson';
    state.scIndex = i;
    var sc = SCENARIOS[i];
    state.world = new Sim.World(sc);
    input.throttle = false; input.brake = false; input.indicator = 'off';
    look.left = false; look.right = false;
    state.yaw = 0; state.yawTarget = 0; state.drag = null;
    el('pedal-gas').classList.remove('down');
    el('pedal-brake').classList.remove('down');
    state.screen = 'brief';
    fillLesson(sc);
    show('screen-menu', false);
    show('screen-play', true);
    show('overlay-brief', true);
    show('overlay-result', false);
    show('overlay-ref', false);
    show('overlay-fault', false);
    el('btn-end-drive').classList.add('hidden');
    applyView();
    resize();
    updateHud();
    draw();
  }

  /* ---------------- free drive ---------------- */
  function fillDriveBrief(){
    var w = state.world, titlePair = { de:w.sc.title, en:w.sc.en };
    el('brief-group').textContent   = I18N.t('drive.cta.button');
    el('brief-title').textContent   = I18N.pick(titlePair);
    el('brief-en').textContent      = I18N.other(titlePair);
    el('brief-task').textContent    = I18N.pick(DRIVE_BRIEF.task);
    el('brief-task-en').textContent = I18N.other(DRIVE_BRIEF.task);
    el('brief-merk').textContent    = I18N.pick(DRIVE_BRIEF.merk);
    el('brief-merk-sub').textContent = I18N.other(DRIVE_BRIEF.merk);
    clear(el('brief-signs'));

    el('side-title').textContent = I18N.pick(titlePair);
    el('side-task').textContent  = I18N.pick(DRIVE_BRIEF.task);
    clear(el('side-signs'));
  }

  function startDrive(){
    state.mode = 'drive';
    var seed = Math.floor(Math.random()*100000);
    state.world = new Drive.DriveWorld({ seed:seed, cols:6, rows:5, target:1e9 });
    input.throttle = false; input.brake = false; input.indicator = 'off';
    look.left = false; look.right = false;
    state.yaw = 0; state.yawTarget = 0; state.drag = null;
    el('pedal-gas').classList.remove('down');
    el('pedal-brake').classList.remove('down');
    state.screen = 'brief';
    fillDriveBrief();
    show('screen-menu', false);
    show('screen-play', true);
    show('overlay-brief', true);
    show('overlay-result', false);
    show('overlay-ref', false);
    show('overlay-fault', false);
    el('btn-end-drive').classList.remove('hidden');
    applyView();
    resize();
    updateHud();
    draw();
  }

  function beginDriving(){
    state.screen = 'play';
    show('overlay-brief', false);
    state.last = performance.now();
  }

  /* stopped mid-drive to explain a fault, examiner-in-the-passenger-seat style */
  function showFaultOverlay(f){
    var box = el('fault-card');
    clear(box);
    box.appendChild(faultRow(f));
    el('btn-fault-rewind').classList.toggle('hidden', !state.world.canRewind());
    show('overlay-fault', true);
  }
  /* one explained mistake: what, which law, why it matters, what to do */
  function faultRow(f){
    var def = Rules.FAULTS[f.id];
    var row = make('div','fault ' + def.sev);
    row.appendChild(make('div','f-plate', def.pts ? '−' + def.pts : 'i'));
    var body = make('div','f-body');
    body.appendChild(make('div','f-title', I18N.pick(def.title)));
    body.appendChild(make('div','f-en', I18N.other(def.title) + (def.law ? '  ·  ' + def.law : '')));
    if (f.detail) body.appendChild(make('div','f-detail', I18N.pick(f.detail)));
    body.appendChild(make('div','f-why',   I18N.pick(def.why)));
    body.appendChild(make('div','f-whyen', I18N.other(def.why)));
    var r = Rules.REASON_TEXT[f.reason];
    if (r && I18N.pick(r.text)){
      var rb = make('div','f-rule');
      rb.appendChild(make('strong', null, I18N.pick(r.title) + ': '));
      rb.appendChild(document.createTextNode(I18N.pick(r.text)));
      rb.appendChild(make('div','f-ruleen', I18N.other(r.text)));
      body.appendChild(rb);
    }
    body.appendChild(make('div','f-tip', I18N.t('res.tip') + I18N.pick(def.tip)));
    row.appendChild(body);
    return row;
  }
  function resumeDrive(){
    show('overlay-fault', false);
    if (state.world) state.world.resume();
  }
  /* back to a few seconds before the mistake, frozen until you press gas */
  function rewindDrive(){
    if (!state.world || !state.world.rewind()) return;
    show('overlay-fault', false);
    input.throttle = false; input.brake = false;
    input.indicator = state.world.player.indicator || 'off';
    el('pedal-gas').classList.remove('down');
    el('pedal-brake').classList.remove('down');
    updateHud();
    draw();
  }

  function driveResult(){
    if (!state.world) return;
    state.screen = 'result';
    show('overlay-fault', false);
    var w = state.world, rep = w.report();
    var majors = rep.faults.filter(function(f){ return f.def.sev === 'major'; }).length;

    el('res-score').textContent = rep.score;
    var verdict = el('res-verdict');
    verdict.textContent = I18N.t('drive.result.title');
    verdict.className = 'verdict ' + (majors ? 'bad' : 'ok');
    el('res-sub').textContent = I18N.t('drive.result.sub', { a:rep.cleared });

    var list = el('res-faults');
    clear(list);
    if (rep.faults.length){
      list.appendChild(make('div','sub', I18N.t('drive.result.explained')));
      rep.faults.forEach(function(f){ list.appendChild(faultRow(f)); });
    } else {
      var row0 = make('div','fault ok');
      row0.appendChild(make('div','f-plate','0'));
      var b0 = make('div','f-body');
      b0.appendChild(make('div','f-title', I18N.t('res.noFaults')));
      b0.appendChild(make('div','f-why',   I18N.t('res.noFaultsWhy')));
      row0.appendChild(b0);
      list.appendChild(row0);
    }
    if (rep.fixed.length){
      list.appendChild(make('div','sub', I18N.t('drive.result.fixed', { n:rep.fixed.length })));
      rep.fixed.forEach(function(f){
        var r = faultRow(f);
        r.classList.add('fixed');
        r.querySelector('.f-plate').textContent = '↺';
        list.appendChild(r);
      });
    }
    clear(el('res-points'));

    refreshResultLabels();
    show('overlay-result', true);
    draw();
  }
  function endDrive(){
    if (state.mode === 'drive' && state.world) driveResult();
  }

  /* ---------------- view ---------------- */
  function applyView(){
    var pov = state.view === 'pov';
    el('btn-view').textContent = I18N.t(pov ? 'view.toTop' : 'view.toPov');
    mini.classList.toggle('hidden', !pov);
    el('look-l').classList.toggle('hidden', !pov);
    el('look-r').classList.toggle('hidden', !pov);
  }
  function toggleView(){
    state.view = state.view === 'pov' ? 'top' : 'pov';
    save(VIEW, state.view);
    applyView();
    draw();
  }

  /* ---------------- loop ---------------- */
  function tick(now){
    requestAnimationFrame(tick);
    var dt = Math.min(0.05, (now - state.last)/1000);
    state.last = now;
    if (state.screen !== 'play' || !state.world) return;

    /* head movement: keys, buttons or a drag on the road */
    if (state.drag === null){
      var t = 0;
      if (look.left)  t -= MAX_YAW;
      if (look.right) t += MAX_YAW;
      state.yawTarget = t;
    }
    state.yaw += (state.yawTarget - state.yaw) * Math.min(1, dt*8);
    if (Math.abs(state.yaw - state.yawTarget) < 0.002) state.yaw = state.yawTarget;

    state.world.update(dt, input);
    updateHud();
    draw();

    if (state.mode === 'drive'){
      var fo = el('overlay-fault'), open = !fo.classList.contains('hidden');
      if (state.world.pending && !open) showFaultOverlay(state.world.pending);
      else if (!state.world.pending && open) show('overlay-fault', false);
      if (state.world.state !== 'run' && state.world.endTimer > 0.9) driveResult();
    } else if (state.world.state !== 'run' && state.world.endTimer > 0.9){
      finishRun();
    }
  }

  function draw(){
    if (!state.world || !W || !H) return;
    if (state.view === 'pov' && state.screen !== 'brief'){
      POV.frame(ctx, W, H, state.world, state.yaw);
      drawMinimap();
    } else {
      Render.frame(ctx, W, H, state.world, state.screen === 'brief');
      if (state.view === 'pov') drawMinimap();
    }
  }
  function drawMinimap(){
    if (mini.classList.contains('hidden')) return;
    var s = mini.width;
    Render.frame(mctx, s, s, state.world, true);
  }

  /* ---------------- HUD ---------------- */
  function updateHud(){
    var w = state.world, p = w.player;
    var v = Math.round(toKmh(p.v));
    var sp = el('hud-speed');
    sp.textContent = v;
    sp.className = v > w.sc.limit + 4 ? 'over' : '';
    el('hud-limit').textContent  = w.sc.limit;
    if (state.mode === 'drive'){
      el('hud-time-label').textContent = I18N.t('hud.cleared');
      el('hud-time').textContent = w.cleared;
      var instr = w.instruction();
      el('hud-task').textContent = instr ? I18N.pick(instr) : '';
    } else {
      el('hud-time-label').textContent = I18N.t('hud.time');
      el('hud-time').textContent = Math.max(0, Math.ceil((w.sc.timeLimit || 45) - w.t));
    }
    el('hud-faults').textContent = w.faults.length;

    var blink = (w.t*2.2) % 1 < 0.55;
    el('ind-l').classList.toggle('on', p.indicator === 'left'  && blink);
    el('ind-r').classList.toggle('on', p.indicator === 'right' && blink);
    el('look-l').classList.toggle('on', state.yaw < -0.05);
    el('look-r').classList.toggle('on', state.yaw >  0.05);

    var h = state.hints ? I18N.pick(w.hint()) : '';
    /* after a rewind, always say what you are retrying and how to get it right */
    if (w.hold){
      var fd = Rules.FAULTS[w.hold.fault.id];
      h = I18N.t('drive.hold.retrying', { what:I18N.pick(fd.title) }) + '\n' +
          I18N.t('drive.hold', { s:w.hold.back, tip:I18N.pick(fd.tip) });
    }
    var hb = el('hud-hint');
    if (h !== hb.dataset.msg){
      hb.textContent = h || '';
      hb.dataset.msg = h || '';
    }
    hb.classList.toggle('hidden', !h);
  }

  /* ---------------- debrief ---------------- */
  /* the retry/list buttons are shared between a lesson's debrief and a
     drive's summary; keep their wording matched to whichever is showing,
     including across a language toggle while the result screen is up */
  function refreshResultLabels(){
    if (state.mode === 'drive'){
      el('btn-retry').querySelector('span').textContent = I18N.t('drive.result.retry');
      el('btn-retry').onclick = startDrive;
      el('btn-next').classList.add('hidden');
      el('btn-list').textContent = I18N.t('drive.result.list');
    } else {
      el('btn-retry').querySelector('span').textContent = I18N.t('res.again');
      el('btn-retry').onclick = function(){ startScenario(state.scIndex); };
      el('btn-next').classList.toggle('hidden', state.scIndex >= SCENARIOS.length - 1);
      el('btn-list').textContent = I18N.t('res.list');
    }
  }

  function finishRun(){
    if (state.screen === 'result') return;
    state.screen = 'result';
    var w = state.world, sc = w.sc, rep = w.report();

    var prev = progress[sc.id];
    progress[sc.id] = {
      best:   Math.max(rep.score, prev ? prev.best : 0),
      passed: rep.passed || !!(prev && prev.passed)
    };
    save(STORE, progress);

    el('res-score').textContent = rep.score;
    var verdict = el('res-verdict');
    verdict.textContent = I18N.t(rep.passed ? 'res.passed' : 'res.failed');
    verdict.className = 'verdict ' + (rep.passed ? 'ok' : 'bad');
    el('res-sub').textContent = rep.passed
      ? I18N.t(rep.faults.length ? 'res.subMinor' : 'res.subClean')
      : I18N.t('res.subFail');

    var list = el('res-faults');
    clear(list);
    if (!rep.faults.length){
      var row0 = make('div','fault ok');
      row0.appendChild(make('div','f-plate','0'));
      var b0 = make('div','f-body');
      b0.appendChild(make('div','f-title', I18N.t('res.noFaults')));
      b0.appendChild(make('div','f-why',   I18N.t('res.noFaultsWhy')));
      row0.appendChild(b0);
      list.appendChild(row0);
    }
    rep.faults.forEach(function(f){
      var d = f.def;
      var row = make('div','fault ' + d.sev);
      row.appendChild(make('div','f-plate', d.pts ? '−' + d.pts : 'i'));

      var body = make('div','f-body');
      body.appendChild(make('div','f-title', I18N.pick(d.title)));
      body.appendChild(make('div','f-en',
        I18N.other(d.title) + (d.law ? '  ·  ' + d.law : '')));
      if (f.detail) body.appendChild(make('div','f-detail', I18N.pick(f.detail)));
      body.appendChild(make('div','f-why',   I18N.pick(d.why)));
      body.appendChild(make('div','f-whyen', I18N.other(d.why)));

      var r = Rules.REASON_TEXT[f.reason];
      if (r && I18N.pick(r.text)){
        var rb = make('div','f-rule');
        rb.appendChild(make('strong', null, I18N.pick(r.title) + ': '));
        rb.appendChild(document.createTextNode(I18N.pick(r.text)));
        rb.appendChild(make('div','f-ruleen', I18N.other(r.text)));
        body.appendChild(rb);
      }
      body.appendChild(make('div','f-tip', I18N.t('res.tip') + I18N.pick(d.tip)));
      row.appendChild(body);
      list.appendChild(row);
    });

    var pts = el('res-points');
    clear(pts);
    pts.appendChild(make('h4','eyebrow', I18N.t('res.about')));
    sc.points.forEach(function(p){
      var li = make('div','point');
      bilingual(li, p, 'p-de', 'p-en');
      pts.appendChild(li);
    });

    refreshResultLabels();
    show('overlay-result', true);
    draw();
    buildMenu();
  }

  /* ---------------- reference sheet ---------------- */
  var REF_ROWS = [
    ['none', { de:'Rechts vor links', en:'Right before left' },
      { de:'Keine Schilder, keine Ampel: wer von rechts kommt, fährt zuerst. Auch dann, wenn der andere abbiegt.',
        en:'No signs, no lights: whoever comes from the right goes first, even if they are turning.' }],
    ['yield', { de:'Vorfahrt gewähren (Z 205)', en:'Give way (sign 205)' },
      { de:'Du musst warten. Anhalten nur, wenn nötig – aber der Bevorrechtigte darf nicht bremsen müssen.',
        en:'You must wait. Stop only if you need to, but never make the other driver brake.' }],
    ['stop', { de:'Stop (Z 206)', en:'Stop (sign 206)' },
      { de:'Immer vollständig anhalten an der Haltelinie, auch bei freier Strasse. Danach vortasten.',
        en:'Always come to a complete stop at the line, even on an empty road. Then edge forward.' }],
    ['priority', { de:'Vorfahrtstrasse (Z 306)', en:'Priority road (sign 306)' },
      { de:'Du hast Vorfahrt, solange du der Strasse folgst. Beim Abbiegen gelten wieder die Abbiegeregeln.',
        en:'You have priority as long as you follow the road. Turning off, the turning rules apply again.' }],
    ['crossing', { de:'Fussgängerüberweg (Z 350)', en:'Zebra crossing (sign 350)' },
      { de:'Fussgängern, die erkennbar hinüber wollen, das Überqueren ermöglichen. Ausserdem Überhol- und Halteverbot.',
        en:'Let pedestrians who clearly want to cross go. No overtaking and no stopping either.' }],
    ['roundabout', { de:'Kreisverkehr (Z 215 + 205)', en:'Roundabout (signs 215 + 205)' },
      { de:'Der Verkehr im Kreisel hat Vorfahrt. Rein ohne Blinker, raus mit rechts.',
        en:'Traffic in the circle has priority. No indicator going in, right indicator coming out.' }],
    ['green_arrow', { de:'Grünpfeil (Z 720)', en:'Green arrow (sign 720)' },
      { de:'Rechtsabbiegen bei Rot nur nach vollständigem Halt und ohne jede Behinderung.',
        en:'Right turn on red only after a full stop and only if you obstruct nobody.' }],
    ['tram', { de:'Schienenfahrzeuge', en:'Rail vehicles' },
      { de:'An ungeregelten Kreuzungen haben Bahnen Vorrang, auch von links. Schilder und Ampeln gehen aber vor.',
        en:'Trams go first at unregulated junctions, even from the left. Signs and lights still override that.' }],
    ['bus_stop', { de:'Linienbus (§ 20 StVO)', en:'Buses (§ 20 StVO)' },
      { de:'Blinkt der Bus an der Haltestelle, hat er Vorrang beim Abfahren. Bus mit Warnblinklicht: nur Schrittgeschwindigkeit vorbei.',
        en:'A bus indicating at a stop has priority pulling out. Passing one with hazard lights on: walking pace only.' }],
    ['play_street', { de:'Verkehrsberuhigter Bereich (Z 325)', en:'Home zone (sign 325)' },
      { de:'Schrittgeschwindigkeit, Fussgänger dürfen die ganze Strasse nutzen, beim Verlassen allen Vorfahrt gewähren.',
        en:'Walking pace, pedestrians may use the whole road, and you give way to everyone when leaving.' }],
    ['zone30', { de:'Zone 30', en:'Zone 30' },
      { de:'Höchstens 30 km/h, meist ohne Vorfahrtschilder – also rechts vor links.',
        en:'30 km/h maximum, and usually no priority signs, so rechts vor links applies.' }]
  ];

  function buildReference(){
    var box = el('ref-body');
    if (box.childElementCount) return;
    var sec = make('div','ref-order');
    sec.appendChild(make('h4', null, I18N.t('ref.orderTitle')));
    [['1','ref.s1'], ['2','ref.s2'], ['3','ref.s3'], ['+','ref.s4']].forEach(function(s){
      var row = make('div','ref-step');
      row.appendChild(make('i', null, s[0]));
      row.appendChild(make('div', null, I18N.t(s[1])));
      sec.appendChild(row);
    });
    box.appendChild(sec);

    REF_ROWS.forEach(function(r){
      var row = make('div','ref-row');
      var c = make('div','ref-sign');
      c.appendChild(Signs.chip(r[0], 50));
      row.appendChild(c);
      var t = make('div','ref-txt');
      t.appendChild(make('div','ref-title', I18N.pick(r[1])));
      t.appendChild(make('div','ref-de', I18N.pick(r[2])));
      t.appendChild(make('div','ref-en', I18N.other(r[2])));
      row.appendChild(t);
      box.appendChild(row);
    });
  }

  /* ---------------- input ---------------- */
  function setIndicator(dir){
    input.indicator = (input.indicator === dir) ? 'off' : dir;
    if (state.world) updateHud();
  }
  function setHints(on){
    state.hints = on;
    el('btn-hints').classList.toggle('off', !on);
  }

  window.addEventListener('keydown', function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key.toLowerCase();
    if (k === ' ' || k.indexOf('arrow') === 0) e.preventDefault();

    if (state.screen === 'brief' && (k === ' ' || k === 'enter')){ beginDriving(); return; }
    if (state.screen === 'result'){
      if (k === 'r' || k === ' '){
        if (state.mode === 'drive') startDrive(); else startScenario(state.scIndex);
        return;
      }
      if (k === 'enter' && state.mode !== 'drive' && state.scIndex < SCENARIOS.length - 1){
        startScenario(state.scIndex + 1); return;
      }
    }
    if (k === 'h'){ setHints(!state.hints); return; }
    if (k === 'v'){ toggleView(); return; }
    if (k === 'escape'){ toMenu(); return; }
    if (state.screen !== 'play') return;

    /* the examiner has stopped the car to explain something: only the
       Continue key does anything until you acknowledge it */
    if (state.mode === 'drive' && !el('overlay-fault').classList.contains('hidden')){
      if (k === ' ' || k === 'enter' || k === 'backspace'){
        if (state.world.canRewind()) rewindDrive(); else resumeDrive();
      }
      if (k === 'c') resumeDrive();
      return;
    }

    /* the Space that chose "rewind" must not auto-repeat into a brake press
       and set the car off before you are ready */
    if (e.repeat && k === ' ' && state.world && state.world.hold) return;
    if (k === 'w' || k === 'arrowup')   { input.throttle = true; el('pedal-gas').classList.add('down'); }
    if (k === 's' || k === 'arrowdown' || k === ' '){ input.brake = true; el('pedal-brake').classList.add('down'); }
    if (k === 'q' || k === 'arrowleft')  look.left = true;
    if (k === 'e' || k === 'arrowright') look.right = true;
    if (k === 'a') setIndicator('left');
    if (k === 'd') setIndicator('right');
    if (k === 'x') input.indicator = 'off';
    if (k === 'r'){ if (state.mode === 'drive') startDrive(); else startScenario(state.scIndex); }
  });
  window.addEventListener('keyup', function(e){
    var k = e.key.toLowerCase();
    if (k === 'w' || k === 'arrowup')   { input.throttle = false; el('pedal-gas').classList.remove('down'); }
    if (k === 's' || k === 'arrowdown' || k === ' '){ input.brake = false; el('pedal-brake').classList.remove('down'); }
    if (k === 'q' || k === 'arrowleft')  look.left = false;
    if (k === 'e' || k === 'arrowright') look.right = false;
  });
  window.addEventListener('blur', function(){
    input.throttle = false; input.brake = false;
    look.left = false; look.right = false;
    el('pedal-gas').classList.remove('down');
    el('pedal-brake').classList.remove('down');
  });

  /* press-and-hold buttons (mouse, touch and pen in one path) */
  function hold(id, onDown, onUp){
    var n = el(id);
    function down(e){
      e.preventDefault();
      if (n.setPointerCapture && e.pointerId !== undefined){
        try { n.setPointerCapture(e.pointerId); } catch(err){}
      }
      onDown(); n.classList.add('down');
    }
    function up(e){ if (e) e.preventDefault(); onUp(); n.classList.remove('down'); }
    n.addEventListener('pointerdown', down);
    n.addEventListener('pointerup', up);
    n.addEventListener('pointercancel', up);
    n.addEventListener('lostpointercapture', up);
    n.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  }

  /* drag across the road to look around, like turning your head */
  function initDragLook(){
    canvas.addEventListener('pointerdown', function(e){
      if (state.screen !== 'play' || state.view !== 'pov') return;
      state.drag = { id:e.pointerId, x:e.clientX, yaw:state.yawTarget };
      try { canvas.setPointerCapture(e.pointerId); } catch(err){}
    });
    canvas.addEventListener('pointermove', function(e){
      if (!state.drag || e.pointerId !== state.drag.id) return;
      var dx = e.clientX - state.drag.x;
      state.yawTarget = Geo.clamp(state.drag.yaw - dx/Math.max(160, W*0.42), -MAX_YAW, MAX_YAW);
    });
    function release(e){
      if (!state.drag || (e && e.pointerId !== state.drag.id)) return;
      state.drag = null;
      state.yawTarget = 0;
    }
    canvas.addEventListener('pointerup', release);
    canvas.addEventListener('pointercancel', release);
    canvas.addEventListener('lostpointercapture', release);
  }

  /* ---------------- navigation ---------------- */
  function toMenu(){
    state.screen = 'menu';
    state.world = null;
    show('screen-play', false);
    show('screen-menu', true);
    show('overlay-ref', false);
    buildMenu();
  }

  function init(){
    I18N.set(load(LANG, 'en'));
    state.view = load(VIEW, 'pov') === 'top' ? 'top' : 'pov';
    applyTheme(load(THEME, null));
    applyLang();
    applyView();

    hold('pedal-gas',   function(){ input.throttle = true; },  function(){ input.throttle = false; });
    hold('pedal-brake', function(){ input.brake = true; },     function(){ input.brake = false; });
    hold('look-l',      function(){ look.left = true; },       function(){ look.left = false; });
    hold('look-r',      function(){ look.right = true; },      function(){ look.right = false; });
    initDragLook();

    el('btn-start').onclick = beginDriving;
    el('btn-retry').onclick = function(){ startScenario(state.scIndex); };
    el('btn-next').onclick  = function(){ startScenario(Math.min(SCENARIOS.length-1, state.scIndex+1)); };
    el('btn-list').onclick  = toMenu;
    el('btn-menu').onclick  = toMenu;
    el('btn-quit').onclick  = toMenu;
    el('btn-drive').onclick = startDrive;
    el('btn-fault-continue').onclick = resumeDrive;
    el('btn-fault-rewind').onclick = rewindDrive;
    el('btn-end-drive').onclick = endDrive;
    el('btn-view').onclick  = toggleView;
    el('btn-ref').onclick   = function(){ buildReference(); show('overlay-ref', true); };
    el('btn-ref-close').onclick = function(){ show('overlay-ref', false); };
    el('btn-hints').onclick = function(){ setHints(!state.hints); };
    el('ind-l').onclick = function(){ setIndicator('left'); };
    el('ind-r').onclick = function(){ setIndicator('right'); };
    el('btn-lang').onclick = function(){
      save(LANG, I18N.toggle());
      applyLang();
    };
    el('btn-theme').onclick = function(){
      var choice = isDark() ? 'light' : 'dark';
      save(THEME, choice);
      applyTheme(choice);
    };
    el('btn-reset').onclick = function(){
      if (confirm(I18N.t('menu.confirmReset'))){
        progress = {}; save(STORE, progress); buildMenu();
      }
    };

    if (window.matchMedia){
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      var onChange = function(){ if (!load(THEME, null)) applyTheme(null); };
      if (mq.addEventListener) mq.addEventListener('change', onChange);
      else if (mq.addListener) mq.addListener(onChange);
    }
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', function(){ setTimeout(resize, 250); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

    resize();
    requestAnimationFrame(tick);
  }

  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
